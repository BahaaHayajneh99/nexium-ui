<div class="nx-ranking-list">
    @for (item of items; track item.id) {
        <div class="nx-ranking-list-row">
            <span class="nx-ranking-list-rank">{{ item.rank }}</span>
            <nx-avatar [src]="item.avatarUrl" [alt]="item.name" size="small"></nx-avatar>
            <span class="nx-ranking-list-name">{{ item.name }}</span>
            <span class="nx-ranking-list-value">{{ item.value }}</span>
            @if (item.delta) {
                <span class="nx-ranking-list-delta">{{ item.delta }}</span>
            }
        </div>
    }
</div>
