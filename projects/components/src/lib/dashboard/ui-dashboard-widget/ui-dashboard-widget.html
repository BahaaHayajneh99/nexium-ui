<div class="nx-dashboard-widget">
    <div class="nx-dashboard-widget-header">
        <span class="nx-dashboard-widget-title">{{ title }}</span>
        <div class="nx-dashboard-widget-actions">
            <ng-content select="[nxDashboardWidgetActions]"></ng-content>
        </div>
    </div>

    <div class="nx-dashboard-widget-body">
        <div class="nx-dashboard-widget-state" *ngIf="loading; else elseIfBlock1">
            <nx-spinner></nx-spinner>
        </div>
        <ng-template #elseIfBlock1>
            <div class="nx-dashboard-widget-state nx-dashboard-widget-error" *ngIf="error; else elseBlock1">{{ error }}</div>
            <ng-template #elseBlock1>
                <ng-content></ng-content>
            </ng-template>
        </ng-template>
    </div>
</div>
