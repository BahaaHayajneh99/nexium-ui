<ng-container *ngIf="licensed(); else elseBlock1">
    <div class="nx-statistic-group" [class.bordered]="bordered">
        <ng-container *ngFor="let item of items; trackBy: trackByLabel; let last = last">
            <div class="nx-statistic-group-item">
                <nx-statistic
                    [label]="item.label"
                    [value]="item.value"
                    [prefix]="item.prefix ?? ''"
                    [suffix]="item.suffix ?? ''"
                    [delta]="item.delta ?? ''"
                    [direction]="item.direction"
                    [upIsGood]="item.upIsGood ?? true">
                </nx-statistic>
            </div>
            <span class="nx-statistic-group-divider" *ngIf="!last"></span>
        </ng-container>
    </div>
</ng-container>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Statistic Group"></nx-pro-locked>
</ng-template>
