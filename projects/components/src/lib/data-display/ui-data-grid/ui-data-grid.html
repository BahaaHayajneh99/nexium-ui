<div class="nx-data-grid">
    <div class="nx-data-grid-toolbar">
        <input
            type="text"
            class="nx-data-grid-search"
            placeholder="Search..."
            [value]="searchTerm()"
            (input)="onSearchInput($event)" />
        <span class="nx-data-grid-count">{{ sortedRows.length }} rows</span>
    </div>

    <div class="nx-data-grid-scroll">
        <table class="nx-data-grid-table">
            <thead>
                <tr>
                    <ng-container *ngFor="let column of columns; trackBy: trackByColumnField">
                        <th
                            [class.sortable]="column.sortable"
                            (click)="onHeaderClick(column)">
                            {{ column.header }}
                            <span class="nx-data-grid-sort-icon" *ngIf="column.sortable && sortIndicator(column.field)">{{ sortIndicator(column.field) }}</span>
                        </th>
                    </ng-container>
                </tr>
            </thead>
            <tbody>
                <ng-container *ngFor="let row of pagedRows; trackBy: trackByIndex">
                    <tr>
                        <ng-container *ngFor="let column of columns; trackBy: trackByColumnField">
                            <td>{{ row[column.field] }}</td>
                        </ng-container>
                    </tr>
                </ng-container>
                <ng-container *ngIf="!pagedRows || pagedRows.length === 0">
                    <tr>
                        <td [attr.colspan]="columns.length" class="nx-data-grid-empty">No data available</td>
                    </tr>
                </ng-container>
            </tbody>
        </table>
    </div>

    <div class="nx-data-grid-paginator" *ngIf="totalPages > 1">
            <div class="nx-data-grid-paginator-info">
                {{ sortedRows.length === 0 ? 0 : pageStart + 1 }}-{{ pageEnd }} of {{ sortedRows.length }}
            </div>
            <div class="nx-data-grid-pagination">
                <button type="button" class="nx-data-grid-page-btn" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">‹</button>
                <ng-container *ngFor="let pageNum of pageNumbers; trackBy: trackByPageNum">
                    <button
                        type="button"
                        class="nx-data-grid-page-btn"
                        [class.active]="pageNum === currentPage"
                        (click)="goToPage(pageNum)">
                        {{ pageNum }}
                    </button>
                </ng-container>
                <button type="button" class="nx-data-grid-page-btn" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">›</button>
            </div>
        </div>
</div>
