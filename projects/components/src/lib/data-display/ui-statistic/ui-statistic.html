<div class="nx-statistic">
    <div class="nx-statistic-label">{{ label }}</div>
    <div class="nx-statistic-value">
        <span class="nx-statistic-affix" *ngIf="prefix">{{ prefix }}</span>
        {{ value }}
        <span class="nx-statistic-affix" *ngIf="suffix">{{ suffix }}</span>
    </div>
    <div class="nx-statistic-delta" *ngIf="delta" [class]="deltaClass">
        <span class="nx-statistic-arrow" *ngIf="resolvedDirection === 'up'">&#8593;</span>
        <span class="nx-statistic-arrow" *ngIf="resolvedDirection === 'down'">&#8595;</span>
        {{ delta }}
    </div>
</div>
