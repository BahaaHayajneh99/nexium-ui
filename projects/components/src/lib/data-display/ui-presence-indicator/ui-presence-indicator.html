<span class="nx-presence-indicator" [class.avatar-mode]="mode === 'avatar'">

    <span class="nx-presence-indicator-avatar" *ngIf="mode === 'avatar'; else elseBlock2">
        <nx-avatar
            *ngIf="hasAvatarInputs; else elseBlock1"
            [src]="avatarUrl"
            [alt]="avatarAlt"
            [name]="avatarName"
            [size]="avatarSize"
            [shape]="avatarShape"
            [variant]="avatarVariant">
        </nx-avatar>
        <ng-template #elseBlock1>
            <ng-content></ng-content>
        </ng-template>
        <span
            class="nx-presence-indicator-dot overlay"
            [class]="status"
            [class.pulse]="pulse && status === 'online'"
            [attr.aria-label]="displayLabel"
            role="img">
        </span>
    </span>
    <ng-template #elseBlock2>
        <span
            class="nx-presence-indicator-dot"
            [class]="status"
            [class.pulse]="pulse && status === 'online'"
            [attr.aria-label]="displayLabel"
            role="img">
        </span>
    </ng-template>

    <span class="nx-presence-indicator-label" *ngIf="showLabel">{{ displayLabel }}</span>

</span>
