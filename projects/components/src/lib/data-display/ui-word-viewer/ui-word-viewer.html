<div class="nx-word-viewer" *ngIf="licensed(); else elseBlock1">
    <div class="nx-word-toolbar">
        <span class="nx-word-title">{{ title }}</span>
        <span class="nx-word-count">{{ wordCount() }} words</span>
        <div class="nx-word-actions">
            <button type="button" (click)="zoomOut()" aria-label="Zoom out">
                <nx-icon icon="nx-minus" variant="svg" [size]="14"></nx-icon>
            </button>
            <span class="nx-word-zoom-label">{{ zoom() }}%</span>
            <button type="button" (click)="zoomIn()" aria-label="Zoom in">
                <nx-icon icon="nx-plus" variant="svg" [size]="14"></nx-icon>
            </button>
            <span class="nx-word-sep"></span>
            <button type="button" (click)="print()" aria-label="Print">
                <nx-icon icon="nx-file" variant="svg" [size]="14"></nx-icon>
                Print
            </button>
        </div>
    </div>

    <div class="nx-word-canvas">
        <div class="nx-word-page" [style.transform]="'scale(' + zoom() / 100 + ')'">
            <ng-container *ngFor="let group of renderGroups(); trackBy: trackByIndex">
                <ng-container [ngSwitch]="group.type">
                    <h1 class="nx-word-h1" *ngSwitchCase="'heading1'">
                        <span *ngFor="let run of group.items[0].runs; trackBy: trackByIndex" [class.bold]="run.bold" [class.italic]="run.italic" [class.underline]="run.underline">{{ run.text }}</span>
                    </h1>
                    <h2 class="nx-word-h2" *ngSwitchCase="'heading2'">
                        <span *ngFor="let run of group.items[0].runs; trackBy: trackByIndex" [class.bold]="run.bold" [class.italic]="run.italic" [class.underline]="run.underline">{{ run.text }}</span>
                    </h2>
                    <h3 class="nx-word-h3" *ngSwitchCase="'heading3'">
                        <span *ngFor="let run of group.items[0].runs; trackBy: trackByIndex" [class.bold]="run.bold" [class.italic]="run.italic" [class.underline]="run.underline">{{ run.text }}</span>
                    </h3>
                    <ul class="nx-word-list" *ngSwitchCase="'bullet'">
                        <li *ngFor="let item of group.items; trackBy: trackByIndex">
                            <span *ngFor="let run of item.runs; trackBy: trackByIndex" [class.bold]="run.bold" [class.italic]="run.italic" [class.underline]="run.underline">{{ run.text }}</span>
                        </li>
                    </ul>
                    <ol class="nx-word-list" *ngSwitchCase="'numbered'">
                        <li *ngFor="let item of group.items; trackBy: trackByIndex">
                            <span *ngFor="let run of item.runs; trackBy: trackByIndex" [class.bold]="run.bold" [class.italic]="run.italic" [class.underline]="run.underline">{{ run.text }}</span>
                        </li>
                    </ol>
                    <p class="nx-word-paragraph" *ngSwitchDefault>
                        <span *ngFor="let run of group.items[0].runs; trackBy: trackByIndex" [class.bold]="run.bold" [class.italic]="run.italic" [class.underline]="run.underline">{{ run.text }}</span>
                    </p>
                </ng-container>
            </ng-container>
        </div>
    </div>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Word Viewer"></nx-pro-locked>
</ng-template>
