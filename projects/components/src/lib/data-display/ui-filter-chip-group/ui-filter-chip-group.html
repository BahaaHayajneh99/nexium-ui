<div class="nx-filter-chip-group" role="group">
    <ng-container *ngFor="let option of options; trackBy: trackByOptionId">
        <button
            type="button"
            class="nx-filter-chip"
            [class.active]="isSelected(option.id)"
            [attr.aria-pressed]="isSelected(option.id)"
            (click)="toggle(option.id)">
            {{ option.label }}
            <span class="nx-filter-chip-count" *ngIf="option.count !== undefined">{{ option.count }}</span>
        </button>
    </ng-container>

    <button type="button" class="nx-filter-chip-clear" (click)="clearAll()" *ngIf="selectedIds.length > 0">{{ clearLabel }}</button>
</div>
