<div class="nx-filter-chip-group" role="group">
    @for (option of options; track option.id) {
        <button
            type="button"
            class="nx-filter-chip"
            [class.active]="isSelected(option.id)"
            [attr.aria-pressed]="isSelected(option.id)"
            (click)="toggle(option.id)">
            {{ option.label }}
            @if (option.count !== undefined) {
                <span class="nx-filter-chip-count">{{ option.count }}</span>
            }
        </button>
    }

    @if (selectedIds.length > 0) {
        <button type="button" class="nx-filter-chip-clear" (click)="clearAll()">{{ clearLabel }}</button>
    }
</div>
