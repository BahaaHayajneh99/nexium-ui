<div class="nx-result" [class]="'status-' + status">

    <nx-icon class="nx-result-icon" [icon]="resolvedIcon" variant="svg" [size]="56"></nx-icon>

    <h3 class="nx-result-title" *ngIf="title">{{ title }}</h3>

    <p class="nx-result-description" *ngIf="description">{{ description }}</p>

    <button type="button" class="nx-result-action" *ngIf="actionLabel" (click)="actionClick.emit()">{{ actionLabel }}</button>

    <ng-content></ng-content>

</div>
