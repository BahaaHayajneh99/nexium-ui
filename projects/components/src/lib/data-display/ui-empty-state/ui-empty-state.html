<div class="nx-empty-state">

    <nx-icon class="nx-empty-state-icon" [icon]="icon" variant="svg" [size]="iconSize" *ngIf="icon"></nx-icon>

    <h3 class="nx-empty-state-title" *ngIf="title">{{ title }}</h3>

    <p class="nx-empty-state-description" *ngIf="description">{{ description }}</p>

    <button type="button" class="nx-empty-state-action" (click)="actionClick.emit()" *ngIf="actionLabel">{{ actionLabel }}</button>

    <ng-content></ng-content>

</div>
