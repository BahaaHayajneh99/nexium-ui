<div class="nx-tree-node">
    <div class="nx-tree-node-label" (click)="toggle()">
        <span class="nx-tree-toggle" *ngIf="hasChildren; else elseBlock1" [class.open]="node.expanded">▸</span>
        <ng-template #elseBlock1>
            <span class="nx-tree-toggle-placeholder"></span>
        </ng-template>
        <span>{{ node.label }}</span>
    </div>

    <div class="nx-tree-children" *ngIf="hasChildren && node.expanded">
        <nx-tree-node *ngFor="let child of node.children; trackBy: trackByLabel" [node]="child"></nx-tree-node>
    </div>
</div>
