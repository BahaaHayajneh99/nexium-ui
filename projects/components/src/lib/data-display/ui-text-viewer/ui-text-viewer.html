<div class="nx-text-viewer" *ngIf="licensed(); else elseBlock1">
    <div class="nx-text-viewer-toolbar">
        <span class="nx-text-viewer-filename">{{ filename }}</span>

        <div class="nx-text-viewer-search">
            <input
                type="text"
                placeholder="Find in file..."
                [ngModel]="searchQuery()"
                (ngModelChange)="onSearchChange($event)" />
            <ng-container *ngIf="searchQuery()">
                <span class="nx-text-viewer-match-count">{{ totalMatches() ? activeMatch() + 1 : 0 }}/{{ totalMatches() }}</span>
                <button type="button" (click)="prevMatch()" aria-label="Previous match">
                    <nx-icon icon="nx-chevron-up" variant="svg" [size]="12"></nx-icon>
                </button>
                <button type="button" (click)="nextMatch()" aria-label="Next match">
                    <nx-icon icon="nx-chevron-down" variant="svg" [size]="12"></nx-icon>
                </button>
            </ng-container>
        </div>

        <div class="nx-text-viewer-actions">
            <button type="button" class="nx-text-viewer-btn" [class.active]="wordWrap()" (click)="toggleWordWrap()">Wrap</button>
            <button type="button" class="nx-text-viewer-btn" (click)="copy()">{{ copied() ? 'Copied!' : 'Copy' }}</button>
            <button type="button" class="nx-text-viewer-btn" (click)="download()">Download</button>
        </div>
    </div>

    <div class="nx-text-viewer-body" [class.wrap]="wordWrap()">
        <div class="nx-text-viewer-line" *ngFor="let line of lines(); trackBy: trackByIndex; let lineIndex = index">
            <span class="nx-text-viewer-line-number" *ngIf="showLineNumbers">{{ lineIndex + 1 }}</span>
            <span class="nx-text-viewer-line-content">
                <ng-container *ngFor="let segment of lineSegments(line); trackBy: trackByIndex">
                    <mark class="nx-text-viewer-match" *ngIf="segment.match; else elseBlock2" [class.active]="isActiveMatch(lineIndex, segment)">{{ segment.text }}</mark>
                    <ng-template #elseBlock2>
                        <span>{{ segment.text }}</span>
                    </ng-template>
                </ng-container>
                <wbr *ngIf="line === ''" />
            </span>
        </div>
    </div>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Text Viewer"></nx-pro-locked>
</ng-template>
