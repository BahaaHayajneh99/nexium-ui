<div class="nx-todo-list" *ngIf="licensed(); else elseBlock1" [class.disabled]="disabled">
    <label class="nx-todo-list-label" *ngIf="label">{{ label }}</label>

    <div class="nx-todo-list-add" *ngIf="showAddInput">
        <input
            type="text"
            class="nx-todo-list-input"
            [placeholder]="placeholder"
            [disabled]="disabled"
            [value]="draft"
            (input)="onDraftInput($event)"
            (keydown.enter)="addItem()" />
        <button
            type="button"
            class="nx-todo-list-add-btn"
            [disabled]="disabled || !draft.trim()"
            (click)="addItem()">
            Add
        </button>
    </div>

    <ng-container *ngIf="items.length; else elseBlock2">
        <ul class="nx-todo-list-items">
            <li class="nx-todo-list-item" *ngFor="let item of items; trackBy: trackByItemId" [class.done]="item.done">
                <label class="nx-todo-list-checkbox">
                    <input
                        type="checkbox"
                        [checked]="item.done"
                        [disabled]="disabled"
                        (change)="toggleItem(item)" />
                    <span class="nx-todo-list-checkbox-box"></span>
                </label>
                <span class="nx-todo-list-item-label">{{ item.label }}</span>
                <button
                    type="button"
                    class="nx-todo-list-remove"
                    [disabled]="disabled"
                    (click)="removeItem(item)"
                    aria-label="Remove task">
                    ×
                </button>
            </li>
        </ul>

        <p class="nx-todo-list-summary" *ngIf="showSummary">{{ remainingCount }} of {{ items.length }} remaining</p>
    </ng-container>
    <ng-template #elseBlock2>
        <p class="nx-todo-list-empty">{{ emptyText }}</p>
    </ng-template>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Todo List"></nx-pro-locked>
</ng-template>
