<div class="nx-comments" *ngIf="licensed(); else elseBlock1">
    <div class="nx-comments-composer">
        <textarea
            class="nx-comments-input"
            [placeholder]="placeholder"
            [value]="composerDraft()"
            (input)="composerDraft.set($any($event.target).value)"></textarea>
        <button
            type="button"
            class="nx-comments-post"
            [disabled]="!composerDraft().trim()"
            (click)="postRootComment()">
            Post
        </button>
    </div>

    <ng-template #commentTpl let-comment let-parentId="parentId">
        <div class="nx-comment">
            <div class="nx-comment-avatar" [style.--nx-avatar-hue]="avatarHueFor(comment.authorName)">
                <ng-container *ngIf="comment.authorAvatarUrl; else elseBlock2">
                    <img [src]="comment.authorAvatarUrl" [alt]="comment.authorName" />
                </ng-container>
                <ng-template #elseBlock2>
                    <span>{{ initialFor(comment.authorName) }}</span>
                </ng-template>
            </div>

            <div class="nx-comment-content">
                <div class="nx-comment-head">
                    <strong class="nx-comment-author">{{ comment.authorName }}</strong>
                    <span class="nx-comment-time">{{ timeLabel(comment.timestamp) }}</span>
                </div>

                <ng-container *ngIf="isEditing(comment); else elseBlock3">
                    <div class="nx-comment-edit">
                        <textarea
                            class="nx-comments-input"
                            [value]="editDraft()"
                            (input)="editDraft.set($any($event.target).value)"></textarea>
                        <div class="nx-comment-edit-actions">
                            <button type="button" class="nx-comments-post" [disabled]="!editDraft().trim()" (click)="saveEdit(comment)">
                                Save
                            </button>
                            <button type="button" class="nx-comment-link" (click)="cancelEdit()">Cancel</button>
                        </div>
                    </div>
                </ng-container>
                <ng-template #elseBlock3>
                    <p class="nx-comment-body">{{ comment.body }}</p>

                    <div class="nx-comment-actions">
                        <button type="button" class="nx-comment-link" (click)="toggleReply(comment)">
                            <nx-icon icon="nx-message" variant="svg" [size]="14"></nx-icon>
                            Reply
                        </button>

                        <ng-container *ngIf="isOwn(comment)">
                            <button type="button" class="nx-comment-link" (click)="startEdit(comment)">
                                <nx-icon icon="nx-edit" variant="svg" [size]="14"></nx-icon>
                                Edit
                            </button>
                            <button type="button" class="nx-comment-link nx-comment-link-danger" (click)="deleteComment(comment, parentId)">
                                <nx-icon icon="nx-trash" variant="svg" [size]="14"></nx-icon>
                                Delete
                            </button>
                        </ng-container>
                    </div>
                </ng-template>

                <div class="nx-comments-composer nx-comments-reply-composer" *ngIf="isReplying(comment)">
                        <textarea
                            class="nx-comments-input"
                            [placeholder]="replyPlaceholder"
                            [value]="replyDraft()"
                            (input)="replyDraft.set($any($event.target).value)"></textarea>
                        <button
                            type="button"
                            class="nx-comments-post"
                            [disabled]="!replyDraft().trim()"
                            (click)="postReply(comment)">
                            Reply
                        </button>
                    </div>

                <div class="nx-comment-replies" *ngIf="comment.replies?.length">
                        <ng-container *ngFor="let reply of comment.replies; trackBy: trackByCommentId">
                            <ng-container
                                *ngTemplateOutlet="commentTpl; context: { $implicit: reply, parentId: comment.id }">
                            </ng-container>
                        </ng-container>
                    </div>
            </div>
        </div>
    </ng-template>

    <div class="nx-comments-list">
        <ng-container *ngFor="let comment of comments; trackBy: trackByCommentId">
            <ng-container *ngTemplateOutlet="commentTpl; context: { $implicit: comment, parentId: null }"></ng-container>
        </ng-container>
        <ng-container *ngIf="!comments || comments.length === 0">
            <p class="nx-comments-empty">No comments yet - be the first to say something.</p>
        </ng-container>
    </div>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Comments"></nx-pro-locked>
</ng-template>
