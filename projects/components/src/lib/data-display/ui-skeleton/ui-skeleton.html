<div class="nx-skeleton-group">
    @for (line of lines; track $index) {
        <span
            class="nx-skeleton"
            [ngClass]="variant"
            [class.animated]="animated"
            [style.width]="width"
            [style.height]="resolvedHeight"
            [style.border-radius]="resolvedRadius">
        </span>
    }
</div>
