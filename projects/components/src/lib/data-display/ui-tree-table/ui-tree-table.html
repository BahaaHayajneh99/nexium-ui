<div class="nx-tree-table-wrapper" *ngIf="licensed(); else elseBlock2">
    <table class="nx-tree-table" [class.striped]="striped" [class.hoverable]="hoverable">
        <thead>
            <tr>
                <th *ngFor="let col of columns; trackBy: trackByColumnField" [style.width]="col.width">{{ col.header }}</th>
            </tr>
        </thead>
        <tbody>
            <tr
                class="nx-tree-table-row"
                *ngFor="let row of rows; trackBy: trackByRowNodeId"
                [class.selected]="isSelected(row.node)"
                [class.selectable]="selectable"
                (click)="selectNode(row.node)">
                <td *ngFor="let col of columns; trackBy: trackByColumnField; let first = first">
                    <ng-container *ngIf="first">
                        <span class="nx-tree-table-indent" [style.width.px]="row.level * indentSize"></span>
                        <button
                            type="button"
                            class="nx-tree-table-toggle"
                            *ngIf="row.hasChildren; else elseBlock1"
                            [attr.aria-expanded]="isExpanded(row.node.id)"
                            [attr.aria-label]="isExpanded(row.node.id) ? 'Collapse' : 'Expand'"
                            (click)="$event.stopPropagation(); toggleNode(row.node)">
                            <nx-icon
                                [icon]="isExpanded(row.node.id) ? 'nx-chevron-down' : 'nx-chevron-right'"
                                variant="svg"
                                [size]="14">
                            </nx-icon>
                        </button>
                        <ng-template #elseBlock1>
                            <span class="nx-tree-table-toggle-spacer"></span>
                        </ng-template>
                    </ng-container>
                    {{ valueFor(row.node, col.field) }}
                </td>
            </tr>

            <tr class="nx-tree-table-empty-row" *ngIf="rows.length === 0">
                <td [attr.colspan]="columns.length">No data</td>
            </tr>
        </tbody>
    </table>
</div>
<ng-template #elseBlock2>
    <nx-pro-locked componentName="Tree Table"></nx-pro-locked>
</ng-template>
