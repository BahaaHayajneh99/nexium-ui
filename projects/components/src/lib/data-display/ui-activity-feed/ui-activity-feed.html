<div class="nx-activity-feed" *ngIf="licensed(); else elseBlock1">
    <div class="nx-activity-feed-filters" *ngIf="showFilters && (actors.length > 1 || hasCategories)">
            <select class="nx-activity-feed-select" [ngModel]="actorFilter" (ngModelChange)="actorFilter = $event">
                <option [value]="'all'">All people</option>
                <ng-container *ngFor="let actor of actors; trackBy: trackByActor">
                    <option [value]="actor">{{ actor }}</option>
                </ng-container>
            </select>

            <select class="nx-activity-feed-select" [ngModel]="categoryFilter" (ngModelChange)="categoryFilter = $event" *ngIf="hasCategories">
                    <option [value]="'all'">All types</option>
                    <ng-container *ngFor="let category of categories; trackBy: trackByCategory">
                        <option [value]="category">{{ category }}</option>
                    </ng-container>
                </select>

            <button type="button" class="nx-activity-feed-reset" (click)="resetFilters()" *ngIf="hasActiveFilters">Reset</button>
        </div>

    <ng-container *ngFor="let group of groups; trackBy: trackByGroupLabel">
        <div class="nx-activity-feed-day" *ngIf="group.label">{{ group.label }}</div>

        <ng-container *ngFor="let item of group.items; trackBy: trackByItem; let last = last">
            <div class="nx-activity-feed-row" [class.nx-activity-feed-row-chained]="!last">
                <div class="nx-activity-feed-avatar" [style.--nx-avatar-hue]="avatarHueFor(item.actorName)">
                    <ng-container *ngIf="item.actorAvatarUrl; else elseBlock2">
                        <img [src]="item.actorAvatarUrl" [alt]="item.actorName" />
                    </ng-container>
                    <ng-template #elseBlock2>
                        <span>{{ initialFor(item.actorName) }}</span>
                    </ng-template>
                </div>

                <div class="nx-activity-feed-content">
                    <div class="nx-activity-feed-row-head">
                        <p class="nx-activity-feed-text">
                            <strong>{{ item.actorName }}</strong> {{ item.action }}
                            <span class="nx-activity-feed-target" *ngIf="item.target">{{ item.target }}</span>
                            <span class="nx-activity-feed-category" *ngIf="item.category">{{ item.category }}</span>
                        </p>

                        <div class="nx-activity-feed-actions">
                            <ng-container *ngFor="let action of actionsFor(item); trackBy: trackByActionId">
                                <button
                                    type="button"
                                    class="nx-activity-feed-action"
                                    (click)="invokeAction(item, action)">
                                    <nx-icon *ngIf="action.icon" [icon]="action.icon" variant="svg" [size]="12"></nx-icon>
                                    {{ action.label }}
                                </button>
                            </ng-container>

                            <button
                                type="button"
                                class="nx-activity-feed-detail-toggle"
                                [class.open]="isExpanded(item)"
                                (click)="toggleExpand(item)"
                                [attr.aria-expanded]="isExpanded(item)"
                                [attr.aria-label]="isExpanded(item) ? 'Hide details' : 'Show details'"
                                *ngIf="item.metadata?.length">
                                <nx-icon icon="nx-chevron-down" variant="svg" [size]="12"></nx-icon>
                            </button>
                        </div>
                    </div>

                    <span class="nx-activity-feed-time">{{ item.timestamp | date: 'shortTime' }}</span>

                    <dl class="nx-activity-feed-metadata" *ngIf="item.metadata?.length && isExpanded(item)">
                            <ng-container *ngFor="let entry of item.metadata; trackBy: trackByMetadataLabel">
                                <div class="nx-activity-feed-metadata-row">
                                    <dt>{{ entry.label }}</dt>
                                    <dd>{{ entry.value }}</dd>
                                </div>
                            </ng-container>
                        </dl>
                </div>
            </div>
        </ng-container>
    </ng-container>

    <ng-container *ngIf="items.length === 0; else elseIfBlock1">
        <p class="nx-activity-feed-empty">No activity yet.</p>
    </ng-container>
    <ng-template #elseIfBlock1>
        <ng-container *ngIf="groups.length === 0">
            <p class="nx-activity-feed-empty">No activity matches these filters.</p>
        </ng-container>
    </ng-template>

    <button type="button" class="nx-activity-feed-load-more" (click)="loadMore.emit()" *ngIf="showLoadMore && items.length > 0">Load more</button>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Activity Feed"></nx-pro-locked>
</ng-template>
