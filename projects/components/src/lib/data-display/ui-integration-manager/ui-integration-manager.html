<div class="nx-integration-manager" *ngIf="licensed(); else elseBlock1">
        <div class="nx-integration-manager-toolbar">
            <nx-search class="nx-integration-manager-search" placeholder="Search integrations..." [(value)]="searchTerm"></nx-search>

            <div class="nx-integration-manager-filters">
                <ng-container *ngFor="let option of filterOptions; trackBy: trackByOptionValue">
                    <button
                        type="button"
                        class="nx-integration-manager-filter"
                        [class.active]="statusFilter() === option.value"
                        (click)="setFilter(option.value)">
                        {{ option.label }}
                    </button>
                </ng-container>
            </div>
        </div>

        <ng-container *ngIf="filteredIntegrations().length; else elseBlock2">
            <div class="nx-integration-manager-grid">
                <ng-container *ngFor="let integration of filteredIntegrations(); trackBy: trackByIntegrationId">
                    <nx-integration-card
                        [name]="integration.name"
                        [description]="integration.description ?? ''"
                        [icon]="integration.icon ?? ''"
                        [status]="integration.status"
                        [configurable]="integration.configurable ?? true"
                        (connect)="connect.emit(integration)"
                        (disconnect)="disconnect.emit(integration)"
                        (configure)="configure.emit(integration)">
                    </nx-integration-card>
                </ng-container>
            </div>
        </ng-container>
        <ng-template #elseBlock2>
            <p class="nx-integration-manager-empty">No integrations match your search.</p>
        </ng-template>
    </div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Integration Manager"></nx-pro-locked>
</ng-template>
