<div class="nx-code-block">
    <div class="nx-code-block-toolbar">
        @if (language) {
            <span class="nx-code-block-language">{{ language }}</span>
        }
        <button type="button" class="nx-code-block-copy" (click)="copy()">
            {{ copied() ? 'Copied!' : 'Copy' }}
        </button>
    </div>

    <pre class="nx-code-block-pre"><code>{{ displayCode }}</code></pre>
</div>
