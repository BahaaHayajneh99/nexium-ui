<div class="nx-pinned-list" *ngIf="licensed(); else elseBlock1">
    <div class="nx-pinned-item" *ngFor="let item of items; trackBy: trackByPinnedItemId; let i = index" [class]="'nx-pinned-item-' + item.type">
        <button type="button" class="nx-pinned-item-body" (click)="onActivate(item)">
            <ng-container [ngSwitch]="item.type">
                <div class="nx-pinned-thumb" *ngSwitchCase="'image'">
                    <img [src]="item.content" [alt]="item.title" />
                </div>
                <div class="nx-pinned-thumb nx-pinned-thumb-video" *ngSwitchCase="'video'">
                    <img [src]="item.content" [alt]="item.title" />
                    <nx-icon icon="nx-video" variant="svg" [size]="20" class="nx-pinned-play-icon"></nx-icon>
                </div>
                <nx-icon [icon]="item.icon || 'nx-link'" variant="svg" [size]="18" class="nx-pinned-icon" *ngSwitchCase="'link'"></nx-icon>
                <ng-container *ngSwitchCase="'custom'">
                    <ng-container *ngIf="customTemplate">
                        <ng-container *ngTemplateOutlet="customTemplate; context: { $implicit: item }"></ng-container>
                    </ng-container>
                </ng-container>
                <nx-icon [icon]="item.icon || 'nx-file'" variant="svg" [size]="18" class="nx-pinned-icon" *ngSwitchDefault></nx-icon>
            </ng-container>

            <div class="nx-pinned-text" *ngIf="item.type !== 'custom'">
                <div class="nx-pinned-title">{{ item.title }}</div>
                <div class="nx-pinned-subtitle" *ngIf="item.subtitle">{{ item.subtitle }}</div>
                <div class="nx-pinned-snippet" *ngIf="item.type === 'text' && item.content">{{ item.content }}</div>
            </div>
        </button>

        <div class="nx-pinned-actions">
            <button type="button" class="nx-pinned-action" [disabled]="i === 0" (click)="moveUp(i)" aria-label="Move up">
                <nx-icon icon="nx-chevron-up" variant="svg" [size]="14"></nx-icon>
            </button>
            <button type="button" class="nx-pinned-action" [disabled]="i === items.length - 1" (click)="moveDown(i)" aria-label="Move down">
                <nx-icon icon="nx-chevron-down" variant="svg" [size]="14"></nx-icon>
            </button>
            <button type="button" class="nx-pinned-action nx-pinned-unpin" (click)="unpin(item)" aria-label="Unpin">
                <nx-icon icon="nx-close" variant="svg" [size]="14"></nx-icon>
            </button>
        </div>
    </div>
    <div class="nx-pinned-empty" *ngIf="!items || items.length === 0">{{ emptyMessage }}</div>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Pinned Item List"></nx-pro-locked>
</ng-template>
