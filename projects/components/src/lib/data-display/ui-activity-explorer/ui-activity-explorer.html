<div class="nx-activity-explorer" *ngIf="licensed(); else elseBlock1">
        <div class="nx-activity-filters">
            <input
                type="text"
                class="nx-activity-search"
                placeholder="Search activity..."
                [ngModel]="searchText()"
                (ngModelChange)="searchText.set($event)" />

            <select class="nx-activity-select" [ngModel]="userFilter()" (ngModelChange)="userFilter.set($event)">
                <option value="all">All users</option>
                <ng-container *ngFor="let user of users(); trackBy: trackByUser">
                    <option [value]="user">{{ user }}</option>
                </ng-container>
            </select>

            <select class="nx-activity-select" [ngModel]="actionFilter()" (ngModelChange)="actionFilter.set($event)">
                <option value="all">All actions</option>
                <ng-container *ngFor="let action of actions(); trackBy: trackByAction">
                    <option [value]="action">{{ action }}</option>
                </ng-container>
            </select>

            <select class="nx-activity-select" [ngModel]="entityFilter()" (ngModelChange)="entityFilter.set($event)">
                <option value="all">All entities</option>
                <ng-container *ngFor="let entity of entities(); trackBy: trackByEntity">
                    <option [value]="entity">{{ entity }}</option>
                </ng-container>
            </select>

            <input type="date" class="nx-activity-date" [ngModel]="dateFrom()" (ngModelChange)="dateFrom.set($event)" />
            <span class="nx-activity-date-sep">to</span>
            <input type="date" class="nx-activity-date" [ngModel]="dateTo()" (ngModelChange)="dateTo.set($event)" />

            <button type="button" class="nx-activity-reset" (click)="resetFilters()">Reset</button>
        </div>

        <div class="nx-activity-timeline">
            <ng-container *ngFor="let group of groups(); trackBy: trackByDateLabel">
                <div class="nx-activity-group">
                    <div class="nx-activity-date-header">{{ group.dateLabel }}</div>
                    <div class="nx-activity-events">
                        <ng-container *ngFor="let event of group.events; trackBy: trackByEventId">
                            <div class="nx-activity-event">
                                <div class="nx-activity-dot">
                                    <nx-icon [icon]="event.icon || 'nx-check-circle'" variant="svg" [size]="12"></nx-icon>
                                </div>
                                <div class="nx-activity-event-body">
                                    <div class="nx-activity-event-line">
                                        <strong>{{ event.user }}</strong>
                                        {{ event.action }}
                                        <span class="nx-activity-entity">{{ event.entity }}</span>
                                        <ng-container *ngIf="event.entityName">
                                            <span class="nx-activity-entity-name">{{ event.entityName }}</span>
                                        </ng-container>
                                        <span class="nx-activity-time">{{ timeLabel(event.date) }}</span>
                                    </div>
                                    <ng-container *ngIf="event.detail">
                                        <div class="nx-activity-detail">{{ event.detail }}</div>
                                    </ng-container>
                                </div>
                            </div>
                        </ng-container>
                    </div>
                </div>
            </ng-container>
            <ng-container *ngIf="!groups() || groups().length === 0">
                <div class="nx-activity-empty">No activity matches these filters.</div>
            </ng-container>
        </div>
    </div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Activity Explorer"></nx-pro-locked>
</ng-template>
