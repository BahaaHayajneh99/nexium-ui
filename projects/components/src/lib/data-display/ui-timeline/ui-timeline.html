<div class="nx-timeline">
    <div class="nx-timeline-item" *ngFor="let item of items; trackBy: trackByIndex">
        <div class="nx-timeline-marker" [ngClass]="item.variant || 'primary'"></div>
        <div class="nx-timeline-content">
            <div class="nx-timeline-header">
                <span class="nx-timeline-title">{{ item.title }}</span>
                <span class="nx-timeline-time" *ngIf="item.time">{{ item.time }}</span>
            </div>
            <p class="nx-timeline-description" *ngIf="item.description">{{ item.description }}</p>
        </div>
    </div>
</div>
