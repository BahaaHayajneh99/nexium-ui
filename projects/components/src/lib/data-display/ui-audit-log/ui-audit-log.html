<div class="nx-audit-log" *ngIf="licensed(); else elseBlock1">
        <div class="nx-audit-log-filters">
            <input
                type="text"
                class="nx-audit-log-search"
                placeholder="Search user, entity, action..."
                [value]="searchText()"
                (input)="searchText.set($any($event.target).value)" />

            <select class="nx-audit-log-action-filter" [value]="actionFilter()" (change)="actionFilter.set($any($event.target).value)">
                <option value="all">All actions</option>
                <ng-container *ngFor="let action of actions; trackBy: trackByAction">
                    <option [value]="action">{{ action }}</option>
                </ng-container>
            </select>
        </div>

        <table class="nx-audit-log-table">
            <thead>
                <tr>
                    <th></th>
                    <th>User</th>
                    <th>Date</th>
                    <th>Action</th>
                    <th>Entity</th>
                </tr>
            </thead>
            <tbody>
                <ng-container *ngFor="let entry of filteredEntries; trackBy: trackByEntryId">
                    <tr class="nx-audit-log-row" (click)="toggleExpanded(entry.id)">
                        <td class="nx-audit-log-expand-cell">
                            <nx-icon
                                *ngIf="entry.changes?.length"
                                icon="nx-chevron-right"
                                variant="svg"
                                [size]="14"
                                class="nx-audit-log-chevron"
                                [class.open]="isExpanded(entry.id)"></nx-icon>
                        </td>
                        <td>{{ entry.user }}</td>
                        <td>{{ entry.date }}</td>
                        <td><span class="nx-audit-log-action-badge">{{ entry.action }}</span></td>
                        <td>{{ entry.entity }}</td>
                    </tr>
                    <tr class="nx-audit-log-details-row" *ngIf="isExpanded(entry.id) && entry.changes?.length">
                            <td [attr.colspan]="5">
                                <table class="nx-audit-log-changes">
                                    <thead>
                                        <tr>
                                            <th>Field</th>
                                            <th>Before</th>
                                            <th>After</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <ng-container *ngFor="let change of entry.changes; trackBy: trackByChangeField">
                                            <tr>
                                                <td>{{ change.field }}</td>
                                                <td class="nx-audit-log-before">{{ change.before }}</td>
                                                <td class="nx-audit-log-after">{{ change.after }}</td>
                                            </tr>
                                        </ng-container>
                                    </tbody>
                                </table>
                            </td>
                        </tr>
                </ng-container>
            </tbody>
        </table>
    </div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Audit Log"></nx-pro-locked>
</ng-template>
