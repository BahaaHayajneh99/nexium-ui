<div class="nx-activity-timeline">
    @for (item of items; track item.id; let last = $last) {
        <div class="nx-activity-row" [class.last]="last">
            <div class="nx-activity-avatar">
                @if (item.actorAvatarUrl) {
                    <img [src]="item.actorAvatarUrl" [alt]="item.actorName" />
                } @else {
                    <span>{{ initialFor(item.actorName) }}</span>
                }
            </div>

            <div class="nx-activity-content">
                <p class="nx-activity-text">
                    <strong>{{ item.actorName }}</strong> {{ item.action }}
                    @if (item.target) {
                        <span class="nx-activity-target">{{ item.target }}</span>
                    }
                </p>
                <span class="nx-activity-time">{{ item.timestamp }}</span>
            </div>
        </div>
    }
</div>
