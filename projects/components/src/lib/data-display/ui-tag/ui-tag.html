<span
    #swatch
    class="nx-tag"
    [class.outline]="variant === 'outline'"
    [class.disabled]="disabled"
    [style.background]="variant === 'outline' ? 'transparent' : color"
    [style.border-color]="color"
    [style.color]="variant === 'outline' ? color : computedTextColor">

    <input
        type="text"
        class="nx-tag-input"
        *ngIf="editable; else elseBlock1"
        [style.color]="variant === 'outline' ? color : computedTextColor"
        [value]="value"
        [placeholder]="placeholder"
        [disabled]="disabled"
        (input)="onInput($event)"
        (keydown.enter)="onEnter($event)">
    <ng-template #elseBlock1>
        <ng-content></ng-content>
    </ng-template>

    <button
        type="button"
        class="nx-tag-close"
        *ngIf="closable && !editable"
        [disabled]="disabled"
        aria-label="Remove tag"
        (click)="onClose($event)">
        &times;
    </button>

</span>
