<span
    #swatch
    class="nx-tag"
    [class.outline]="variant === 'outline'"
    [class.disabled]="disabled"
    [style.background]="variant === 'outline' ? 'transparent' : color"
    [style.border-color]="color"
    [style.color]="variant === 'outline' ? color : computedTextColor">

    @if (editable) {
        <input
            type="text"
            class="nx-tag-input"
            [style.color]="variant === 'outline' ? color : computedTextColor"
            [value]="value"
            [placeholder]="placeholder"
            [disabled]="disabled"
            (input)="onInput($event)"
            (keydown.enter)="onEnter($event)">
    } @else {
        <ng-content></ng-content>
    }

    @if (closable && !editable) {
        <button
            type="button"
            class="nx-tag-close"
            [disabled]="disabled"
            aria-label="Remove tag"
            (click)="onClose($event)">
            &times;
        </button>
    }

</span>
