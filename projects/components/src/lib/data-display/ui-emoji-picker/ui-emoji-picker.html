<div class="nx-emoji-picker">
    <div class="nx-emoji-picker-search">
        <nx-search
            [value]="search"
            [placeholder]="searchPlaceholder"
            [showResultsPanel]="false"
            (valueChange)="onSearchChange($event)">
        </nx-search>
    </div>

    <div class="nx-emoji-picker-tabs" role="tablist" aria-label="Emoji categories" *ngIf="showCategories && !isSearching">
            <ng-container *ngFor="let tab of tabs; trackBy: trackByTab">
                <button
                    type="button"
                    class="nx-emoji-picker-tab"
                    role="tab"
                    [class.active]="tab === activeCategory"
                    [attr.aria-selected]="tab === activeCategory"
                    (click)="selectCategory(tab)">
                    {{ tab }}
                </button>
            </ng-container>
        </div>

    <div class="nx-emoji-picker-grid" role="listbox" aria-label="Emoji">
        <ng-container *ngIf="filteredNames.length; else elseBlock1">
            <ng-container *ngFor="let name of filteredNames; trackBy: trackByName">
                <button
                    type="button"
                    class="nx-emoji-picker-cell"
                    role="option"
                    [attr.aria-label]="name"
                    [title]="name"
                    (click)="selectEmoji(name)">
                    <nx-emoji [emoji]="name" [size]="emojiSize"></nx-emoji>
                </button>
            </ng-container>
        </ng-container>
        <ng-template #elseBlock1>
            <div class="nx-emoji-picker-empty">
                <nx-icon icon="nx-search" variant="svg" [size]="20"></nx-icon>
                <p>{{ noResultsText }}</p>
                <p class="nx-emoji-picker-empty-hint" *ngIf="isSearching">Try a different search term</p>
            </div>
        </ng-template>
    </div>
</div>
