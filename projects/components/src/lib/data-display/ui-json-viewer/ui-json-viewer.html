<div class="nx-json-viewer" *ngIf="licensed(); else elseBlock2">
    <div class="nx-json-row" *ngFor="let row of rows; trackBy: trackByRowPath" [style.padding-left.px]="row.indent * 16">
        <button
            type="button"
            class="nx-json-toggle"
            *ngIf="row.hasChildren; else elseBlock1"
            [attr.aria-label]="isCollapsed(row.path) ? 'Expand' : 'Collapse'"
            (click)="toggle(row.path)">
            {{ isCollapsed(row.path) ? '▶' : '▼' }}
        </button>
        <ng-template #elseBlock1>
            <span class="nx-json-toggle-spacer"></span>
        </ng-template>

        <span class="nx-json-key" *ngIf="row.key !== null">{{ row.key }}:</span>

        <span class="nx-json-value" [class]="row.valueType">{{ row.preview }}</span>
    </div>
</div>
<ng-template #elseBlock2>
    <nx-pro-locked componentName="JSON Viewer"></nx-pro-locked>
</ng-template>
