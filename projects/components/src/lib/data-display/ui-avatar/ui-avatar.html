<span class="nx-avatar" [ngClass]="avatarClasses">

    <ng-container *ngIf="showImage; else elseIfBlock1">
        <img
            class="nx-avatar-image"
            [src]="src"
            [alt]="alt || name"
            (error)="onImageError()">
    </ng-container>
    <ng-template #elseIfBlock1>
        <ng-container *ngIf="initials; else elseBlock1">
            <span class="nx-avatar-initials">
                {{ initials }}
            </span>
        </ng-container>
        <ng-template #elseBlock1>
            <span class="nx-avatar-content" role="img" [attr.aria-label]="alt || name || 'Avatar'">
                <ng-content></ng-content>
            </span>
        </ng-template>
    </ng-template>

    <span class="nx-avatar-status" [ngClass]="status" *ngIf="status"></span>

</span>
