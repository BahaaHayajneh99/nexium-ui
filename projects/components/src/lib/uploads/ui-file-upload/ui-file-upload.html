<div class="nx-file-upload">
    <label
        class="nx-file-upload-zone"
        [class.dragging]="isDragging"
        [class.no-drag]="!draggable"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave()"
        (drop)="onDrop($event)">

        <input type="file" hidden [accept]="accept" [multiple]="multiple" (change)="onFileInputChange($event)" />

        <span class="nx-file-upload-icon">⬆</span>
        <span class="nx-file-upload-text">{{ label }}</span>

    </label>

    <ul class="nx-file-upload-list" *ngIf="files.length">
        <li class="nx-file-upload-item" *ngFor="let file of files; trackBy: trackByFileName; let i = index">
            <span class="nx-file-upload-item-name">{{ file.name }}</span>
            <span class="nx-file-upload-item-size">{{ file.size | nxFileSize }}</span>
            <button type="button" (click)="removeFile(i)">×</button>
        </li>
    </ul>
</div>
