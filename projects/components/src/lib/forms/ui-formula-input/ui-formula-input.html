<div class="nx-formula-wrapper" *ngIf="licensed(); else elseBlock1">
    <div class="nx-formula-field">
        <input
            #inputRef
            type="text"
            class="nx-formula-input"
            [class.error]="!!displayError"
            [placeholder]="placeholder"
            [disabled]="disabled"
            [attr.aria-required]="isRequired ? true : null"
            [attr.aria-invalid]="displayError ? true : null"
            [value]="value"
            (input)="onInput($event)"
            (keydown)="onKeydown($event)"
            (blur)="onBlur()" />

        <div class="nx-formula-panel" *ngIf="open">
            <div class="nx-formula-empty" *ngIf="filteredFields.length === 0">No matching fields</div>
            <button
                type="button"
                class="nx-formula-option"
                *ngFor="let field of filteredFields; trackBy: trackByFieldName; let i = index"
                [class.active]="i === activeIndex"
                (mousedown)="$event.preventDefault(); insertField(field)">
                <span class="nx-formula-option-name">{{ field.name }}</span>
                <span class="nx-formula-option-label">{{ field.label }}</span>
            </button>
        </div>
    </div>

    <span class="nx-formula-error" *ngIf="displayError">{{ displayError }}</span>

    <div class="nx-formula-tokens" *ngIf="showTokens && tokens.length > 0">
        <span class="nx-formula-token" *ngFor="let token of tokens; trackBy: trackByIndex" [class.unknown]="!token.known">
            {{ token.label }}
            <span class="nx-formula-token-flag" title="Unknown field" *ngIf="!token.known">?</span>
        </span>
    </div>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Formula Input"></nx-pro-locked>
</ng-template>
