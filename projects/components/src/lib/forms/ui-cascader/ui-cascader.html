<div class="nx-cascader" *ngIf="licensed(); else elseBlock1">
    <button
        type="button"
        class="nx-cascader-trigger"
        [class.open]="open()"
        [attr.aria-expanded]="open()"
        (click)="toggleOpen()">
        <span class="nx-cascader-trigger-text" [class.placeholder]="!value || !value.length">
            {{ triggerLabel() }}
        </span>
        <nx-icon class="nx-cascader-chevron-icon" icon="nx-chevron-down" variant="svg" [size]="16"></nx-icon>
    </button>

    <div class="nx-cascader-panel" *ngIf="open()">
        <div class="nx-cascader-column" *ngFor="let column of columns(); trackBy: trackByIndex; let depth = index">
            <button
                type="button"
                class="nx-cascader-option"
                *ngFor="let option of column; trackBy: trackByOptionValue"
                [class.active]="isSelected(depth, option)"
                (click)="selectOption(depth, option)">
                <span>{{ option.label }}</span>
                <nx-icon icon="nx-chevron-right" variant="svg" [size]="12" *ngIf="option.children?.length"></nx-icon>
            </button>
            <ng-container *ngIf="!column || column.length === 0">
                <div class="nx-cascader-empty">No options</div>
            </ng-container>
        </div>
    </div>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Cascader"></nx-pro-locked>
</ng-template>
