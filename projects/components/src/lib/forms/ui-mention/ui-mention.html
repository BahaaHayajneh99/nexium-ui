<div class="nx-mention-wrapper">
    <textarea
        #textareaRef
        class="nx-mention-textarea"
        [class.error]="!!displayError"
        [rows]="rows"
        [placeholder]="placeholder"
        [disabled]="disabled"
        [attr.aria-required]="isRequired ? true : null"
        [attr.aria-invalid]="displayError ? true : null"
        [value]="value"
        (input)="onInput($event)"
        (keydown)="onKeydown($event)"
        (blur)="onBlur()">
    </textarea>

    <span class="nx-mention-error" *ngIf="displayError">{{ displayError }}</span>

    <div class="nx-mention-panel" *ngIf="open">
        <button
            type="button"
            class="nx-mention-option"
            *ngFor="let suggestion of filteredSuggestions; trackBy: trackBySuggestionId; let i = index"
            [class.active]="i === activeIndex"
            (mousedown)="$event.preventDefault(); selectSuggestion(suggestion)">
            {{ trigger }}{{ suggestion.label }}
        </button>
    </div>
</div>
