<div class="nx-search-wrapper">
    <div class="nx-search" [class.disabled]="disabled" [class.error]="!!displayError">
        <nx-icon class="nx-search-icon" icon="nx-search" variant="svg" [size]="18"></nx-icon>

        <input
            class="nx-search-input"
            type="text"
            [placeholder]="placeholder"
            [disabled]="disabled"
            [attr.aria-required]="isRequired ? true : null"
            [attr.aria-invalid]="displayError ? true : null"
            [value]="value"
            (input)="onInput($event)"
            (focus)="onFocus()"
            (blur)="onBlur()"
            (keydown)="onKeydown($event)" />

        <button type="button" class="nx-search-clear" aria-label="Clear search" (mousedown)="clear($event)" *ngIf="showClear && value">
            <nx-icon icon="nx-close" variant="svg" [size]="14"></nx-icon>
        </button>
    </div>

    <span class="nx-search-error" *ngIf="displayError">{{ displayError }}</span>

    <ul class="nx-search-results" *ngIf="showPanel">
        <ng-container *ngIf="normalizedResults.length; else elseBlock1">
            <li
                class="nx-search-result"
                *ngFor="let result of normalizedResults; trackBy: trackByIndex; let i = index"
                [class.active]="i === activeIndex"
                (mousedown)="selectResult(result)">
                {{ result.label }}
            </li>
        </ng-container>
        <ng-template #elseBlock1>
            <li class="nx-search-empty">
                <p>{{ noResultsText }} for "{{ value }}"</p>
                <p class="nx-search-empty-hint">{{ noResultsHint }}</p>
            </li>
        </ng-template>
    </ul>
</div>
