<div class="nx-combobox-wrapper">
    <label class="nx-combobox-label" *ngIf="label">{{ label }}<span class="nx-combobox-required" *ngIf="isRequired">*</span></label>

    <div class="nx-combobox-field">
        <div class="nx-combobox" [class.error]="!!displayError" [class.disabled]="disabled">
            <input
                #inputRef
                type="text"
                class="nx-combobox-input"
                role="combobox"
                aria-autocomplete="list"
                [attr.aria-expanded]="open"
                [attr.aria-required]="isRequired ? true : null"
                [attr.aria-invalid]="displayError ? true : null"
                [placeholder]="placeholder"
                [disabled]="disabled"
                [value]="query"
                (input)="onInput($event)"
                (focus)="onFocus()"
                (blur)="onBlur()"
                (keydown)="onKeydown($event)" />

            <button
                type="button"
                class="nx-combobox-clear"
                tabindex="-1"
                aria-label="Clear selection"
                (mousedown)="$event.preventDefault(); clear($event)"
                *ngIf="showClear && !!value">
                &times;
            </button>

            <button
                type="button"
                class="nx-combobox-toggle"
                tabindex="-1"
                [disabled]="disabled"
                aria-label="Toggle options"
                (mousedown)="$event.preventDefault(); toggleList()">
                <span class="nx-combobox-chevron" [class.open]="open"></span>
            </button>
        </div>

        <div class="nx-combobox-panel" role="listbox" *ngIf="open">
            <div class="nx-combobox-empty" *ngIf="filteredOptions.length === 0">No matches</div>
            <button
                type="button"
                class="nx-combobox-option"
                role="option"
                *ngFor="let option of filteredOptions; trackBy: trackByOptionValue; let i = index"
                [class.active]="i === activeIndex"
                [class.selected]="option.value === value"
                [class.disabled]="option.disabled"
                [attr.aria-selected]="option.value === value"
                [disabled]="option.disabled"
                (mousedown)="$event.preventDefault(); selectOption(option)">
                {{ option.label }}
            </button>
        </div>
    </div>

    <span class="nx-combobox-error" *ngIf="displayError">{{ displayError }}</span>
</div>
