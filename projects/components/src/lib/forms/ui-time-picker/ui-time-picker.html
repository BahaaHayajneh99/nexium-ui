<div class="nx-time-picker" [class.disabled]="disabled" [class.inline]="inline">

    <div class="nx-time-picker-input-wrapper" [class.invalid]="!!displayError" (click)="toggle()" *ngIf="!inline">
        <input
            class="nx-time-picker-input"
            type="text"
            readonly
            [placeholder]="placeholder"
            [disabled]="disabled"
            [value]="displayValue"
            [attr.aria-required]="isRequired ? true : null"
            [attr.aria-invalid]="displayError ? true : null"
            (blur)="onBlur()" />
        <nx-icon class="nx-time-picker-icon" icon="nx-clock" variant="svg" [size]="16"></nx-icon>
    </div>

    <div class="nx-time-picker-panel" *ngIf="inline || open">

        <div class="nx-time-picker-column">
            <div class="nx-time-picker-column-label">Hour</div>
            <ul class="nx-time-picker-list">
                <li *ngFor="let h of hourOptions; trackBy: trackByHour" [class.active]="h === selectedHour" (mousedown)="selectHour(h)">{{ pad(h) }}</li>
            </ul>
        </div>

        <div class="nx-time-picker-column">
            <div class="nx-time-picker-column-label">Minute</div>
            <ul class="nx-time-picker-list">
                <li *ngFor="let m of minuteOptions; trackBy: trackByMinute" [class.active]="m === selectedMinute" (mousedown)="selectMinute(m)">{{ pad(m) }}</li>
            </ul>
        </div>

        <div class="nx-time-picker-column" *ngIf="showSeconds">
            <div class="nx-time-picker-column-label">Second</div>
            <ul class="nx-time-picker-list">
                <li *ngFor="let s of secondOptions; trackBy: trackBySecond" [class.active]="s === selectedSecond" (mousedown)="selectSecond(s)">{{ pad(s) }}</li>
            </ul>
        </div>

        <div class="nx-time-picker-column nx-time-picker-period" *ngIf="use12Hour">
            <div class="nx-time-picker-column-label">&nbsp;</div>
            <button type="button" [class.active]="selectedPeriod === 'AM'" (mousedown)="selectPeriod('AM')">AM</button>
            <button type="button" [class.active]="selectedPeriod === 'PM'" (mousedown)="selectPeriod('PM')">PM</button>
        </div>

    </div>

    <span class="nx-time-picker-error" *ngIf="displayError">{{ displayError }}</span>

</div>
