<div class="nx-rte" [class.disabled]="disabled" [class.invalid]="!!displayError">

    <div class="nx-rte-toolbar">
        <button
            type="button"
            class="nx-rte-btn"
            *ngFor="let button of toolbar; trackBy: trackByToolbarButton"
            [class.nx-rte-btn-bold]="button.command === 'bold'"
            [class.nx-rte-btn-italic]="button.command === 'italic'"
            [disabled]="disabled"
            [attr.aria-label]="button.label"
            [title]="button.label"
            (mousedown)="$event.preventDefault()"
            (click)="runCommand(button)">
            {{ button.icon }}
        </button>
        <button
            type="button"
            class="nx-rte-btn"
            [disabled]="disabled"
            title="Link"
            (mousedown)="$event.preventDefault()"
            (click)="insertLink()">
            🔗
        </button>
    </div>

    <div
        #editorRef
        class="nx-rte-editor"
        [attr.contenteditable]="!disabled"
        [attr.data-placeholder]="placeholder"
        [attr.aria-required]="isRequired ? true : null"
        [attr.aria-invalid]="displayError ? true : null"
        (input)="onInput()"
        (keydown)="onKeydown($event)"
        (blur)="onBlur()"
        (drop)="onDrop($event)"
        (dragover)="onDragOver($event)">
    </div>

    <input #fileInputRef type="file" accept="image/*" hidden (change)="onImageSelected($event)" />

    <div class="nx-rte-footer">
        <span class="nx-rte-count">{{ wordCount }} words · {{ charCount }} characters</span>
        <span class="nx-rte-autosave" *ngIf="autosaveInterval > 0">{{ lastSavedAt() ? 'Saved ' + (lastSavedAt() | date: 'shortTime') : 'Not saved yet' }}</span>
    </div>

    <span class="nx-rte-error" *ngIf="displayError">{{ displayError }}</span>

    <div class="nx-rte-popup" [style.left.px]="popupPos().x" [style.top.px]="popupPos().y" *ngIf="slashMenuOpen() && filteredSlashCommands.length">
        <button type="button" class="nx-rte-popup-item" *ngFor="let cmd of filteredSlashCommands; trackBy: trackBySlashCommandId" (mousedown)="$event.preventDefault()" (click)="runSlashCommand(cmd)">
            <span class="nx-rte-popup-icon">{{ cmd.icon }}</span>
            {{ cmd.label }}
        </button>
    </div>

    <div class="nx-rte-popup" [style.left.px]="popupPos().x" [style.top.px]="popupPos().y" *ngIf="mentionMenuOpen() && filteredMentions.length">
        <button type="button" class="nx-rte-popup-item" *ngFor="let name of filteredMentions; trackBy: trackByMentionName" (mousedown)="$event.preventDefault()" (click)="insertMention(name)">
            {{ '@' }}{{ name }}
        </button>
    </div>

    <div class="nx-rte-emoji-popup" *ngIf="emojiMenuOpen()">
        <button type="button" class="nx-rte-emoji-item" *ngFor="let emoji of emojiList; trackBy: trackByEmoji" (mousedown)="$event.preventDefault()" (click)="insertEmoji(emoji)">
            {{ emoji }}
        </button>
    </div>

</div>
