<div class="nx-tag-input">
    <div class="nx-tag-input-field" (click)="focusInput()">
        <span class="nx-tag-chip" *ngFor="let tag of value; trackBy: trackByIndex; let i = index">
            {{ tag }}
            <button type="button" class="nx-tag-remove" (click)="$event.stopPropagation(); removeTag(i)" aria-label="Remove tag">&times;</button>
        </span>
        <input
            #inputEl
            type="text"
            class="nx-tag-input-control"
            [placeholder]="value.length === 0 ? placeholder : ''"
            [value]="draft()"
            (input)="onInputChange($event)"
            (keydown)="onKeyDown($event)"
            (focus)="onFocus()"
            (blur)="onBlur()" />
    </div>

    <div class="nx-tag-suggestions" *ngIf="showSuggestions() && filteredSuggestions().length > 0">
        <button type="button" class="nx-tag-suggestion" *ngFor="let s of filteredSuggestions(); trackBy: trackBySuggestion" (mousedown)="$event.preventDefault()" (click)="selectSuggestion(s)">{{ s }}</button>
    </div>
</div>
