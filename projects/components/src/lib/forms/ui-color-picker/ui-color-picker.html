<div class="nx-color-picker-wrapper">
    @if (label) {
        <label class="nx-color-picker-label">{{ label }}@if (isRequired) {<span class="nx-color-picker-required">*</span>}</label>
    }

    <button
        type="button"
        class="nx-color-picker-field"
        [class.invalid]="invalid || !!displayError"
        [class.disabled]="disabled"
        [class.open]="open"
        [disabled]="disabled"
        [attr.aria-required]="isRequired ? true : null"
        [attr.aria-invalid]="(invalid || !!displayError) ? true : null"
        (click)="toggle()">
        <span class="nx-color-picker-swatch" [style.background]="isValidHex ? value : 'transparent'"></span>
        <span class="nx-color-picker-value">{{ value }}</span>
    </button>

    @if (displayError) {
        <span class="nx-color-picker-error">{{ displayError }}</span>
    }

    @if (open) {
        <div class="nx-color-picker-panel">

            <div class="nx-color-picker-presets">
                @for (preset of presets; track preset) {
                    <button
                        type="button"
                        class="nx-color-picker-preset"
                        [class.selected]="preset === value"
                        [style.background]="preset"
                        [attr.aria-label]="preset"
                        (click)="selectPreset(preset)">
                    </button>
                }
            </div>

            <div class="nx-color-picker-custom">
                <input
                    type="color"
                    class="nx-color-picker-native"
                    [value]="isValidHex ? value : '#3498db'"
                    (input)="onNativeInput($event)"
                    (blur)="onBlur()" />

                <input
                    type="text"
                    class="nx-color-picker-hex"
                    [value]="hexDraft"
                    (input)="onHexDraftChange($event)"
                    (blur)="commitHexDraft(); onBlur()"
                    (keydown.enter)="commitHexDraft()"
                    spellcheck="false" />
            </div>

        </div>
    }
</div>
