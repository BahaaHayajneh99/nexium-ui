<div
    class="nx-autocomplete"
    [ngClass]="[variant, multiple ? 'multiple' : '', (invalid || !!displayError) ? 'invalid' : '', disabled ? 'disabled' : '']">

    <label class="nx-autocomplete-label" *ngIf="label && !floatLabel">{{ label }}<span class="nx-autocomplete-required" *ngIf="isRequired">*</span></label>

    <div class="nx-autocomplete-input-wrapper" (click)="focusInput()">

        <ul class="nx-autocomplete-chips" *ngIf="multiple && values.length">
            <li class="nx-autocomplete-chip" *ngFor="let val of values; trackBy: trackByValue">
                {{ labelFor(val) }}
                <button type="button" class="nx-autocomplete-chip-remove" (mousedown)="removeChip(val, $event)">×</button>
            </li>
        </ul>

        <input
            #input
            class="nx-autocomplete-input"
            [placeholder]="floatLabel ? '' : placeholder"
            [disabled]="disabled"
            [value]="multiple ? query : displayValue"
            [attr.aria-required]="isRequired ? true : null"
            [attr.aria-invalid]="(invalid || !!displayError) ? true : null"
            (input)="onInput($event)"
            (focus)="onFocus()"
            (blur)="onBlur()" />

        <label class="nx-autocomplete-float-label" [class.active]="focused || hasValue" *ngIf="floatLabel && label">{{ label }}<span class="nx-autocomplete-required" *ngIf="isRequired">*</span></label>

        <button type="button" class="nx-autocomplete-clear" (mousedown)="clear($event)" *ngIf="showClear && hasValue && !disabled">×</button>

    </div>

    <span class="nx-autocomplete-error" *ngIf="displayError">{{ displayError }}</span>

    <ul class="nx-autocomplete-list" [style.max-height.px]="virtualScroll ? scrollHeight : null" (scroll)="onListScroll($event)" *ngIf="showList">
        <ng-container *ngIf="rows.length; else elseBlock1">
            <li class="nx-autocomplete-spacer" [style.height.px]="topSpacerHeight" *ngIf="virtualScroll"></li>
            <ng-container *ngFor="let row of visibleRows; trackBy: trackByVisibleRow">
                <li class="nx-autocomplete-group-header" *ngIf="row.type === 'group'; else nonGroupItemBlock1">{{ row.group }}</li>
                <ng-template #nonGroupItemBlock1>
                    <li class="nx-autocomplete-item" (mousedown)="selectOption(row.option!)">{{ row.option!.label }}</li>
                </ng-template>
            </ng-container>
            <li class="nx-autocomplete-spacer" [style.height.px]="bottomSpacerHeight" *ngIf="virtualScroll"></li>
        </ng-container>
        <ng-template #elseBlock1>
            <li class="nx-autocomplete-empty">No results found</li>
        </ng-template>
    </ul>

</div>
