<div class="nx-segmented-wrapper">
    <div
        class="nx-segmented-control"
        [class]="'size-' + size"
        [class.full-width]="fullWidth"
        [class.disabled]="disabled"
        role="radiogroup"
        [attr.aria-required]="isRequired ? true : null"
        [attr.aria-invalid]="displayError ? true : null">
        <button
            type="button"
            [id]="segmentId(option)"
            class="nx-segment"
            *ngFor="let option of options; trackBy: trackByOptionValue; let i = index"
            [class.active]="option.value === value"
            role="radio"
            [attr.aria-checked]="option.value === value"
            [tabindex]="isTabStop(option, i) ? 0 : -1"
            [disabled]="disabled || option.disabled"
            (click)="select(option)"
            (keydown)="onKeydown($event, i)">
            <nx-icon [icon]="option.icon" variant="svg" [size]="14" *ngIf="option.icon"></nx-icon>
            <span>{{ option.label }}</span>
        </button>
    </div>

    <span class="nx-segmented-error" *ngIf="displayError">{{ displayError }}</span>
</div>
