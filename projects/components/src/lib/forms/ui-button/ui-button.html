<button [ngClass]="buttonClasses" [disabled]="disabled || loading" [attr.aria-busy]="loading || null">

    <span class="nx-button-spinner" aria-hidden="true" *ngIf="loading"></span>

    <span *ngIf="loading && loadingText; else elseBlock1">{{ loadingText }}</span>
    <ng-template #elseBlock1>
        <ng-content></ng-content>
    </ng-template>

</button>
