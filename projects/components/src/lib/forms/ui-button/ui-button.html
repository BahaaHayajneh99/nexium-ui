<button [ngClass]="buttonClasses" [disabled]="disabled || loading" [attr.aria-busy]="loading || null">

    @if (loading) {
        <span class="nx-button-spinner" aria-hidden="true"></span>
    }

    @if (loading && loadingText) {
        <span>{{ loadingText }}</span>
    } @else {
        <ng-content></ng-content>
    }

</button>
