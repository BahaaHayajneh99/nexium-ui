<div class="nx-file-input-wrapper" *ngIf="licensed(); else elseBlock1">
    <label class="nx-file-input-label" *ngIf="label">{{ label }}<span class="nx-file-input-required" *ngIf="isRequired">*</span></label>

    <label class="nx-file-input-trigger">
        <input
            type="file"
            class="nx-file-input-native"
            [attr.accept]="accept === '*' ? null : accept"
            [multiple]="multiple"
            (change)="onFilesSelected($event)" />
        <nx-icon icon="nx-upload" variant="svg" [size]="14"></nx-icon>
        <span>{{ multiple ? 'Choose files' : 'Choose file' }}</span>
    </label>

    <div class="nx-file-input-hint">
        Max {{ maxSizeMb }}MB per file - up to {{ maxFiles }} file{{ maxFiles === 1 ? '' : 's' }}<span *ngIf="accept !== '*'"> - accepted: {{ accept }}</span>
    </div>

    <ul class="nx-file-input-list" *ngIf="acceptedFiles().length">
        <li class="nx-file-input-item" *ngFor="let file of acceptedFiles(); trackBy: trackByFile">
            <nx-icon icon="nx-file" variant="svg" [size]="14"></nx-icon>
            <span class="nx-file-input-name">{{ file.name }}</span>
            <span class="nx-file-input-size">{{ formatSize(file.size) }}</span>
            <button type="button" class="nx-file-input-remove" (click)="removeFile(file)" aria-label="Remove file">
                <nx-icon icon="nx-close" variant="svg" [size]="12"></nx-icon>
            </button>
        </li>
    </ul>

    <ul class="nx-file-input-errors" *ngIf="errors().length">
        <li class="nx-file-input-error" *ngFor="let error of errors(); trackBy: trackByError">
            <nx-icon icon="nx-alert-triangle" variant="svg" [size]="12"></nx-icon>
            {{ error }}
        </li>
    </ul>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="File Input"></nx-pro-locked>
</ng-template>
