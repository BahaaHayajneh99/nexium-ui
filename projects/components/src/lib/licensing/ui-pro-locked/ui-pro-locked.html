<div class="nx-pro-locked">
    <span class="nx-pro-locked-badge">PRO</span>
    <p class="nx-pro-locked-text">
        <strong>{{ componentName }}</strong> is a NexiumUI PRO component. Configure a license token with
        <code>provideNxLicense()</code> to use it in your app.
    </p>
    <a class="nx-pro-locked-link" [href]="upgradeUrl" target="_blank" rel="noopener noreferrer">
        Get a PRO license
    </a>
</div>
