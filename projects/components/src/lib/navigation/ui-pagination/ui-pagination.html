<div class="nx-pagination">
    <button type="button" class="nx-pagination-btn" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">‹</button>

    @for (page of pages; track page) {
        <button
            type="button"
            class="nx-pagination-btn"
            [ngClass]="{ active: page === currentPage }"
            (click)="goToPage(page)">
            {{ page }}
        </button>
    }

    <button type="button" class="nx-pagination-btn" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">›</button>
</div>
