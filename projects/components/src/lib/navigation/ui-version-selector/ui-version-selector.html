<nx-dropdown-menu *ngIf="licensed(); else elseBlock1">
    <button type="button" nx-dropdown-trigger class="nx-version-selector-trigger">
        <span class="nx-version-selector-current">{{ selectedLabel }}</span>
        <span *ngIf="selectedTag" class="nx-version-selector-tag" [class]="'tag-' + selectedTag">{{ selectedTag }}</span>
        <nx-icon icon="nx-chevron-down" variant="svg" [size]="14"></nx-icon>
    </button>

    <div nx-dropdown-content class="nx-version-selector-list">
        <button
            *ngFor="let version of versions; trackBy: trackByVersionValue"
            type="button"
            class="nx-version-selector-option"
            [class.active]="version.value === selected"
            (click)="choose(version)">
            <span>{{ version.label }}</span>
            <span *ngIf="version.tag" class="nx-version-selector-tag" [class]="'tag-' + version.tag">{{ version.tag }}</span>
        </button>
        <div *ngIf="!versions || versions.length === 0" class="nx-version-selector-empty">No versions available</div>
    </div>
</nx-dropdown-menu>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Version Selector"></nx-pro-locked>
</ng-template>
