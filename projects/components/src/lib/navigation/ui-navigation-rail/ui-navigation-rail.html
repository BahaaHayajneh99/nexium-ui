<nav *ngIf="licensed(); else elseBlock1" class="nx-navigation-rail">
    <button
        *ngFor="let item of items; trackBy: trackByItemId"
        type="button"
        class="nx-navigation-rail-item"
        [class.active]="item.id === active"
        (click)="select(item)">
        <span class="nx-navigation-rail-icon-wrap">
            <nx-icon [icon]="item.icon" variant="svg" [size]="20"></nx-icon>
            <span *ngIf="item.badge !== undefined" class="nx-navigation-rail-badge">{{ item.badge }}</span>
        </span>
        <span *ngIf="showLabels" class="nx-navigation-rail-label">{{ item.label }}</span>
    </button>
</nav>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Navigation Rail"></nx-pro-locked>
</ng-template>
