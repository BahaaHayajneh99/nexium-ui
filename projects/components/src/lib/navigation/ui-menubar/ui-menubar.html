<div class="nx-menubar">
    <div *ngFor="let menu of menus; trackBy: trackByMenuLabel; let i = index" class="nx-menubar-item-wrapper">
        <button
            type="button"
            class="nx-menubar-label"
            [class.active]="openIndex === i"
            (click)="toggle(i)">
            {{ menu.label }}
        </button>

        <nx-menu *ngIf="openIndex === i" class="nx-menubar-panel" [items]="menu.items" (itemSelect)="onSelect($event)"></nx-menu>
    </div>
</div>
