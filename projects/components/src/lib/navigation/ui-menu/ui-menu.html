<div class="nx-menu" role="menu">
    <ng-container *ngFor="let item of items; trackBy: trackByItemId">
        <div *ngIf="item.divider; else elseBlock1" class="nx-menu-divider"></div>
        <ng-template #elseBlock1>
            <button
                type="button"
                class="nx-menu-item"
                [class.danger]="item.danger"
                [disabled]="item.disabled"
                role="menuitem"
                (click)="onSelect(item)">
                <nx-icon *ngIf="item.icon" class="nx-menu-item-icon" [icon]="item.icon" variant="svg" [size]="16"></nx-icon>
                <span>{{ item.label }}</span>
            </button>
        </ng-template>
    </ng-container>
</div>
