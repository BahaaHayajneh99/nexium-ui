<div class="nx-command-bar" role="toolbar">
    <ng-container *ngFor="let group of groups; trackBy: trackByIndex; let lastGroup = last">
        <div class="nx-command-bar-group">
            <button
                *ngFor="let item of group.items; trackBy: trackByItemId"
                type="button"
                class="nx-command-bar-item"
                [disabled]="item.disabled"
                [title]="item.label"
                (click)="select(item)">
                <nx-icon *ngIf="item.icon" [icon]="item.icon" variant="svg" [size]="16"></nx-icon>
                <span>{{ item.label }}</span>
            </button>
        </div>
        <span *ngIf="!lastGroup" class="nx-command-bar-separator"></span>
    </ng-container>
</div>
