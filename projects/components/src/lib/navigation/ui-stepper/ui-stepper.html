<div class="nx-stepper">
    <ng-container *ngFor="let step of steps; trackBy: trackByStepLabel; let i = index; let last = last">
        <div class="nx-step" [ngClass]="{ active: i === activeIndex, completed: i < activeIndex }" (click)="goToStep(i)">
            <div class="nx-step-circle">
                <span *ngIf="i < activeIndex; else elseBlock1">✓</span>
                <ng-template #elseBlock1>
                    <span>{{ i + 1 }}</span>
                </ng-template>
            </div>
            <span class="nx-step-label">{{ step.label }}</span>
        </div>
        <div *ngIf="!last" class="nx-step-connector" [ngClass]="{ completed: i < activeIndex }"></div>
    </ng-container>
</div>
