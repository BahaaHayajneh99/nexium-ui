<ng-container *ngIf="licensed(); else elseBlock1">
    <ng-content></ng-content>

    <ng-container *ngIf="!dismissed">
        <button
            type="button"
            class="nx-coachmark-dot"
            [class.nx-coachmark-dot-pulse]="showPulse && !open()"
            [attr.aria-expanded]="open()"
            [attr.aria-label]="dotLabel"
            (click)="toggleOpen()">
            <span class="nx-coachmark-dot-core"></span>
        </button>

        <div
            class="nx-coachmark-popover"
            *ngIf="open()"
            role="dialog"
            [attr.aria-label]="title || 'Feature hint'"
            [attr.data-placement]="placement">
            <div class="nx-coachmark-popover-title" *ngIf="title">{{ title }}</div>
            <p class="nx-coachmark-popover-description" *ngIf="description">{{ description }}</p>
            <button type="button" class="nx-coachmark-popover-dismiss" (click)="dismiss()">Got it</button>
        </div>
    </ng-container>
</ng-container>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Coachmark"></nx-pro-locked>
</ng-template>
