<div class="nx-command-backdrop" *ngIf="open" (click)="onBackdropClick()"></div>

<div class="nx-command-panel" *ngIf="open" (click)="$event.stopPropagation()">
    <input
        #searchInput
        type="text"
        class="nx-command-input"
        [placeholder]="placeholder"
        [value]="query"
        (input)="onQueryChange($event)"
        autofocus />

    <div class="nx-command-list">
        <ng-container *ngFor="let item of filtered; trackBy: trackByItemId; let i = index">
            <div class="nx-command-group" *ngIf="item.group && isFirstInGroup(i)">{{ item.group }}</div>
            <button
                type="button"
                class="nx-command-item"
                [class.active]="i === activeIndex"
                (mouseenter)="activeIndex = i"
                (click)="select(item)">
                <span>{{ item.label }}</span>
                <kbd class="nx-command-shortcut" *ngIf="item.shortcut">{{ item.shortcut }}</kbd>
            </button>
        </ng-container>
        <div class="nx-command-empty" *ngIf="!filtered || filtered.length === 0">No matching commands.</div>
    </div>
</div>
