<ng-container *ngFor="let position of positions; trackBy: trackByPosition">
    <div class="nx-toast-container" *ngIf="toastsFor(position).length" [ngClass]="position" role="status" aria-live="polite" aria-atomic="false">
        <div class="nx-toast" *ngFor="let toast of toastsFor(position); trackBy: trackByToastId" [ngClass]="toast.variant">
            <span>{{ toast.message }}</span>
            <button type="button" class="nx-toast-close" (click)="dismiss(toast.id)">×</button>
        </div>
    </div>
</ng-container>
