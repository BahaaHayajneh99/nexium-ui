<div class="nx-popover-menu-wrapper">
    <div class="nx-popover-menu-trigger" [class.disabled]="disabled" (click)="toggle()">
        <ng-content select="[nx-popover-menu-trigger]"></ng-content>
    </div>

    @if (open) {
        <div class="nx-popover-menu-panel" [class]="'placement-' + resolvedPlacement">
            <span class="nx-popover-menu-arrow"></span>

            @if (items.length > 0) {
                <nx-menu [items]="items" (itemSelect)="onSelect($event)"></nx-menu>
            }

            <ng-content></ng-content>
        </div>
    }
</div>
