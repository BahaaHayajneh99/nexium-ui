<div class="nx-alert" *ngIf="visible" [ngClass]="variant">

    <nx-icon *ngIf="icon" class="nx-alert-icon" [icon]="iconName" variant="svg" [size]="18"></nx-icon>

    <div class="nx-alert-content">
        <div class="nx-alert-title" *ngIf="title">{{ title }}</div>
        <div class="nx-alert-message">
            <ng-content></ng-content>
        </div>
    </div>

    <button type="button" class="nx-alert-close" *ngIf="dismissible" (click)="dismiss()" aria-label="Dismiss">
        <nx-icon icon="nx-close" variant="svg" [size]="14"></nx-icon>
    </button>

</div>
