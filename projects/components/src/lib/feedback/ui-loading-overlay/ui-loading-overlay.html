<div class="nx-loading-overlay-container">
    <ng-content></ng-content>

    <div class="nx-loading-overlay" *ngIf="loading" [class.fullscreen]="fullscreen" [class.blur]="blur">
        <nx-spinner [variant]="spinnerVariant" size="large"></nx-spinner>
        <span class="nx-loading-overlay-message" *ngIf="message">{{ message }}</span>
    </div>
</div>
