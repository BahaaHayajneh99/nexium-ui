@if (open) {
    <div #panel class="nx-fullscreen-dialog" role="dialog" aria-modal="true" [attr.aria-label]="header" tabindex="-1">
        <div class="nx-fullscreen-dialog-header">
            <span class="nx-fullscreen-dialog-title">{{ header }}</span>
            <button type="button" class="nx-fullscreen-dialog-close" aria-label="Close" (click)="close()">×</button>
        </div>
        <div class="nx-fullscreen-dialog-body">
            <ng-content select="[nx-fullscreen-dialog-body]"></ng-content>
        </div>
        <div class="nx-fullscreen-dialog-footer">
            <ng-content select="[nx-fullscreen-dialog-footer]"></ng-content>
        </div>
    </div>
}
