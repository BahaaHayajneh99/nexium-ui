<div class="nx-notification-center">

    <button
        type="button"
        class="nx-notification-trigger"
        (click)="toggle()"
        [attr.aria-label]="'Notifications' + (unreadCount > 0 ? ', ' + unreadCount + ' unread' : '')">
        <svg viewBox="0 0 24 24" width="20" height="20">
            <path
                d="M6 10C6 6.7 8.7 4 12 4C15.3 4 18 6.7 18 10V15L20 18H4L6 15V10Z"
                fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
            <path d="M9.5 18C9.5 19.4 10.6 20.5 12 20.5C13.4 20.5 14.5 19.4 14.5 18"
                fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        @if (unreadCount > 0) {
            <span class="nx-notification-count" aria-hidden="true">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
        }
    </button>

    <span class="nx-notification-sr-only" role="status" aria-live="polite">
        @if (unreadCount > 0) {
            {{ unreadCount }} unread notification{{ unreadCount === 1 ? '' : 's' }}
        }
    </span>

    @if (open) {
        <div class="nx-notification-panel">

            <div class="nx-notification-header">
                <span class="nx-notification-title">Notifications</span>
                @if (unreadCount > 0) {
                    <button type="button" class="nx-notification-mark-all" (click)="onMarkAllRead()">Mark all read</button>
                }
            </div>

            <div class="nx-notification-list">
                @for (item of notifications; track item.id) {
                    <div class="nx-notification-item" [class.unread]="!item.read" (click)="onItemClick(item)">
                        <span class="nx-notification-dot"></span>
                        <div class="nx-notification-body">
                            <div class="nx-notification-item-title">{{ item.title }}</div>
                            <div class="nx-notification-item-message">{{ item.message }}</div>
                            <div class="nx-notification-item-time">{{ item.time }}</div>
                        </div>
                        <button type="button" class="nx-notification-dismiss" (click)="onDismiss($event, item)" aria-label="Dismiss">&times;</button>
                    </div>
                } @empty {
                    <div class="nx-notification-empty">{{ emptyMessage }}</div>
                }
            </div>

        </div>
    }

</div>
