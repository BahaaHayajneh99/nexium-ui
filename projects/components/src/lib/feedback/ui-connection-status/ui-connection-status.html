<span class="nx-connection-status-pill" *ngIf="display === 'pill'; else elseIfBlock1" [class]="currentStatus()">
    <span class="nx-connection-status-dot"></span>
    {{ currentStatus() === 'offline' ? 'Offline' : 'Online' }}
</span>
<ng-template #elseIfBlock1>
    <div class="nx-connection-status-banner" *ngIf="bannerVisible" [class]="bannerVariant" role="status">
        <nx-icon [icon]="currentStatus() === 'offline' ? 'nx-wifi' : 'nx-check-circle'" variant="svg" [size]="16"></nx-icon>
        <span>{{ bannerMessage }}</span>
    </div>
</ng-template>
