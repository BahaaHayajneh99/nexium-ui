<ng-container *ngIf="open && activeImage">
    <div class="nx-lightbox" *ngIf="licensed(); else elseBlock1" role="dialog" aria-modal="true" [attr.aria-label]="activeImage.alt || 'Image viewer'">
        <button type="button" class="nx-lightbox-close" aria-label="Close" (click)="close()">×</button>

        <div class="nx-lightbox-stage" (click)="close()">
            <button type="button" class="nx-lightbox-nav prev" *ngIf="hasMultiple" aria-label="Previous image" (click)="$event.stopPropagation(); prev()">‹</button>

            <img
                class="nx-lightbox-image"
                [src]="activeImage.src"
                [alt]="activeImage.alt || ''"
                (click)="$event.stopPropagation()" />

            <button type="button" class="nx-lightbox-nav next" *ngIf="hasMultiple" aria-label="Next image" (click)="$event.stopPropagation(); next()">›</button>
        </div>

        <p class="nx-lightbox-caption" *ngIf="activeImage.caption">{{ activeImage.caption }}</p>

        <div class="nx-lightbox-thumbnails" *ngIf="showThumbnails && hasMultiple">
            <ng-container *ngFor="let image of images; trackBy: trackByIndex; let i = index">
                <button
                    type="button"
                    class="nx-lightbox-thumbnail"
                    [class.active]="i === activeIndex"
                    [attr.aria-label]="'Go to image ' + (i + 1)"
                    (click)="setIndex(i)">
                    <img [src]="image.src" [alt]="image.alt || ''" />
                </button>
            </ng-container>
        </div>
    </div>
    <ng-template #elseBlock1>
        <div class="nx-lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
            <button type="button" class="nx-lightbox-close" aria-label="Close" (click)="close()">×</button>
            <nx-pro-locked componentName="Lightbox"></nx-pro-locked>
        </div>
    </ng-template>
</ng-container>
