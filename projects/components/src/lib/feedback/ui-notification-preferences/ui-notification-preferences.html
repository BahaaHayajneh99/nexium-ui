<ng-container *ngIf="licensed(); else elseBlock1">
    <div class="nx-notification-preferences">
        <div class="nx-notification-preferences-row nx-notification-preferences-header">
            <div class="nx-notification-preferences-category-cell"></div>
            <div class="nx-notification-preferences-channel-cell" *ngFor="let channel of channels; trackBy: trackByChannelKey">{{ channel.label }}</div>
        </div>

        <div class="nx-notification-preferences-row" *ngFor="let category of categories; trackBy: trackByCategoryKey">
            <div class="nx-notification-preferences-category-cell">
                <span class="nx-notification-preferences-category-label">{{ category.label }}</span>
                <span class="nx-notification-preferences-category-description" *ngIf="category.description">{{ category.description }}</span>
            </div>
            <div class="nx-notification-preferences-channel-cell" *ngFor="let channel of channels; trackBy: trackByChannelKey">
                <nx-switch
                    [checked]="cellValue(category.key, channel.key)"
                    (checkedChange)="onToggle(category.key, channel.key, $event)">
                </nx-switch>
            </div>
        </div>
    </div>
</ng-container>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Notification Preferences"></nx-pro-locked>
</ng-template>
