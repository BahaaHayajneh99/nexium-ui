@if (open) {
    <div class="nx-banner" [class]="variant" role="status">
        <nx-icon class="nx-banner-icon" [icon]="resolvedIcon" variant="svg" [size]="18"></nx-icon>

        <span class="nx-banner-message">
            {{ message }}
            <ng-content></ng-content>
        </span>

        @if (actionLabel) {
            <button type="button" class="nx-banner-action" (click)="actionClick.emit()">{{ actionLabel }}</button>
        }

        @if (dismissible) {
            <button type="button" class="nx-banner-dismiss" aria-label="Dismiss" (click)="dismiss()">&times;</button>
        }
    </div>
}
