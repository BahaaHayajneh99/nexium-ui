<div class="nx-banner" *ngIf="open" [class]="variant" role="status">
    <nx-icon class="nx-banner-icon" [icon]="resolvedIcon" variant="svg" [size]="18"></nx-icon>

    <span class="nx-banner-message">
        {{ message }}
        <ng-content></ng-content>
    </span>

    <button type="button" class="nx-banner-action" *ngIf="actionLabel" (click)="actionClick.emit()">{{ actionLabel }}</button>

    <button type="button" class="nx-banner-dismiss" *ngIf="dismissible" aria-label="Dismiss" (click)="dismiss()">&times;</button>
</div>
