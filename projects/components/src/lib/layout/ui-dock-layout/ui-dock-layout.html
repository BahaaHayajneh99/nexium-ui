<div
    class="nx-dock-layout"
    [style.grid-template-columns]="gridTemplateColumns()"
    [style.grid-template-rows]="gridTemplateRows()"
    *ngIf="licensed(); else elseBlock1">

    <ng-container *ngIf="leftPanel() as panel">
        <div class="nx-dock-panel nx-dock-panel-left" [class.closed]="isClosed(panel)">
            <div class="nx-dock-panel-header">
                <span class="nx-dock-panel-title">{{ panel.title }}</span>
                <button type="button" class="nx-dock-panel-close" (click)="closePanel(panel)" [attr.aria-label]="'Close ' + panel.title" *ngIf="panel.closable !== false">
                    <nx-icon icon="nx-close" variant="svg" [size]="12"></nx-icon>
                </button>
            </div>
            <div class="nx-dock-panel-body" #leftSlot></div>
        </div>
        <div class="nx-dock-divider nx-dock-divider-left" (pointerdown)="onDividerPointerDown('left', $event)" *ngIf="!isClosed(panel)">
            <span class="nx-dock-divider-handle"></span>
        </div>
    </ng-container>

    <div class="nx-dock-panel nx-dock-panel-center">
        <div class="nx-dock-panel-header" *ngIf="centerPanel() as panel">
            <span class="nx-dock-panel-title">{{ panel.title }}</span>
        </div>
        <div class="nx-dock-panel-body" #centerSlot></div>
    </div>

    <ng-container *ngIf="rightPanel() as panel">
        <div class="nx-dock-divider nx-dock-divider-right" (pointerdown)="onDividerPointerDown('right', $event)" *ngIf="!isClosed(panel)">
            <span class="nx-dock-divider-handle"></span>
        </div>
        <div class="nx-dock-panel nx-dock-panel-right" [class.closed]="isClosed(panel)">
            <div class="nx-dock-panel-header">
                <span class="nx-dock-panel-title">{{ panel.title }}</span>
                <button type="button" class="nx-dock-panel-close" (click)="closePanel(panel)" [attr.aria-label]="'Close ' + panel.title" *ngIf="panel.closable !== false">
                    <nx-icon icon="nx-close" variant="svg" [size]="12"></nx-icon>
                </button>
            </div>
            <div class="nx-dock-panel-body" #rightSlot></div>
        </div>
    </ng-container>

    <ng-container *ngIf="bottomPanel() as panel">
        <div class="nx-dock-divider nx-dock-divider-bottom" (pointerdown)="onDividerPointerDown('bottom', $event)" *ngIf="!isClosed(panel)">
            <span class="nx-dock-divider-handle"></span>
        </div>
        <div class="nx-dock-panel nx-dock-panel-bottom" [class.closed]="isClosed(panel)">
            <div class="nx-dock-panel-header">
                <span class="nx-dock-panel-title">{{ panel.title }}</span>
                <button type="button" class="nx-dock-panel-close" (click)="closePanel(panel)" [attr.aria-label]="'Close ' + panel.title" *ngIf="panel.closable !== false">
                    <nx-icon icon="nx-close" variant="svg" [size]="12"></nx-icon>
                </button>
            </div>
            <div class="nx-dock-panel-body" #bottomSlot></div>
        </div>
    </ng-container>

    <div class="nx-dock-layout-sink" hidden>
        <ng-content></ng-content>
    </div>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Dock Layout"></nx-pro-locked>
</ng-template>
