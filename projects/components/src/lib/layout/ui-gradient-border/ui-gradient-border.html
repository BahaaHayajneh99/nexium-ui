@if (licensed()) {
    <div
        class="nx-gradient-border"
        [class.nx-gradient-border-animated]="animated"
        [style.border-radius]="radiusValue"
        [style.--nx-gradient-border-width]="borderWidthValue"
        [style.--nx-gradient-border-speed]="speedValue"
        [style.--nx-gradient-border-colors]="colorStopsValue">
        <div class="nx-gradient-border-content" [style.border-radius]="contentRadiusValue">
            <ng-content></ng-content>
        </div>
    </div>
} @else {
    <nx-pro-locked componentName="Gradient Border"></nx-pro-locked>
}
