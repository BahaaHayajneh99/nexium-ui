@if (licensed()) {
    <div class="nx-transform-editor">
        <div class="nx-transform-editor-preview-wrap">
            <div class="nx-transform-editor-preview" [style.transform]="cssValue"></div>
        </div>

        <div class="nx-transform-editor-fields">
            <label class="nx-transform-editor-field">
                <span>Translate X</span>
                <input type="range" min="-100" max="100" [value]="value.translateX" (input)="update({ translateX: $any($event.target).valueAsNumber })" />
                <span class="nx-transform-editor-value">{{ value.translateX }}px</span>
            </label>

            <label class="nx-transform-editor-field">
                <span>Translate Y</span>
                <input type="range" min="-100" max="100" [value]="value.translateY" (input)="update({ translateY: $any($event.target).valueAsNumber })" />
                <span class="nx-transform-editor-value">{{ value.translateY }}px</span>
            </label>

            <label class="nx-transform-editor-field">
                <span>Rotate</span>
                <input type="range" min="-180" max="180" [value]="value.rotate" (input)="update({ rotate: $any($event.target).valueAsNumber })" />
                <span class="nx-transform-editor-value">{{ value.rotate }}deg</span>
            </label>

            <label class="nx-transform-editor-field">
                <span>Scale</span>
                <input type="range" min="0.1" max="2" step="0.05" [value]="value.scale" (input)="update({ scale: $any($event.target).valueAsNumber })" />
                <span class="nx-transform-editor-value">{{ value.scale }}x</span>
            </label>

            <label class="nx-transform-editor-field">
                <span>Skew X</span>
                <input type="range" min="-60" max="60" [value]="value.skewX" (input)="update({ skewX: $any($event.target).valueAsNumber })" />
                <span class="nx-transform-editor-value">{{ value.skewX }}deg</span>
            </label>

            <label class="nx-transform-editor-field">
                <span>Skew Y</span>
                <input type="range" min="-60" max="60" [value]="value.skewY" (input)="update({ skewY: $any($event.target).valueAsNumber })" />
                <span class="nx-transform-editor-value">{{ value.skewY }}deg</span>
            </label>
        </div>

        <div class="nx-transform-editor-css-row">
            <code class="nx-transform-editor-css">{{ cssDeclaration }}</code>
            @if (showCopyButton) {
                <button type="button" class="nx-transform-editor-copy" (click)="copyCss()">
                    {{ copied() ? 'Copied!' : 'Copy' }}
                </button>
            }
        </div>
    </div>
} @else {
    <nx-pro-locked componentName="Transform Editor"></nx-pro-locked>
}
