<div class="nx-property-editor" *ngIf="licensed(); else elseBlock1">
        <div class="nx-property-editor-row" *ngFor="let prop of properties; trackBy: trackByPropKey">
            <label class="nx-property-editor-label">{{ prop.label }}</label>
            <div class="nx-property-editor-control">
                <ng-container [ngSwitch]="prop.type">
                    <ng-container *ngSwitchCase="'text'">
                        <input
                            type="text"
                            [value]="values[prop.key]"
                            (input)="setValue(prop.key, $any($event.target).value)" />
                    </ng-container>
                    <ng-container *ngSwitchCase="'number'">
                        <div class="nx-property-editor-number-wrap">
                            <input
                                type="number"
                                [value]="values[prop.key]"
                                (input)="setValue(prop.key, $any($event.target).valueAsNumber)" />
                            <span class="nx-property-editor-unit" *ngIf="prop.unit">{{ prop.unit }}</span>
                        </div>
                    </ng-container>
                    <ng-container *ngSwitchCase="'color'">
                        <input
                            type="color"
                            [value]="values[prop.key]"
                            (input)="setValue(prop.key, $any($event.target).value)" />
                    </ng-container>
                    <ng-container *ngSwitchCase="'boolean'">
                        <input
                            type="checkbox"
                            [checked]="values[prop.key]"
                            (change)="setValue(prop.key, $any($event.target).checked)" />
                    </ng-container>
                    <ng-container *ngSwitchCase="'select'">
                        <select [value]="values[prop.key]" (change)="setValue(prop.key, $any($event.target).value)">
                            <option *ngFor="let option of prop.options; trackBy: trackByOptionValue" [value]="option.value">{{ option.label }}</option>
                        </select>
                    </ng-container>
                </ng-container>
            </div>
        </div>
    </div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Property Editor"></nx-pro-locked>
</ng-template>
