<div class="nx-data-mapping-editor" *ngIf="licensed(); else elseBlock1">
    <div class="nx-data-mapping-columns">
        <div class="nx-data-mapping-source">
            <div class="nx-data-mapping-column-title">Source fields</div>
            <ul class="nx-data-mapping-source-list">
                <li class="nx-data-mapping-source-item" *ngFor="let field of sourceFields; trackBy: trackByFieldKey">{{ field.label }}</li>
                <li class="nx-data-mapping-source-item nx-data-mapping-source-empty" *ngIf="!sourceFields || sourceFields.length === 0">No source fields</li>
            </ul>
        </div>

        <div class="nx-data-mapping-target">
            <div class="nx-data-mapping-column-title">Target fields</div>
            <div class="nx-data-mapping-target-row" *ngFor="let field of targetFields; trackBy: trackByFieldKey">
                <div class="nx-data-mapping-target-label">
                    <span
                        class="nx-data-mapping-status-dot"
                        [class.mapped]="isMapped(field.key)"
                        [class.missing]="field.required && !isMapped(field.key)">
                    </span>
                    <span class="nx-data-mapping-target-text">{{ field.label }}</span>
                    <span class="nx-data-mapping-required-tag" *ngIf="field.required">Required</span>
                </div>
                <select
                    class="nx-data-mapping-select"
                    [value]="mapping[field.key] ?? ''"
                    (change)="onMapChange(field.key, $event)">
                    <option value="">&mdash; Select source field &mdash;</option>
                    <option [value]="source.key" *ngFor="let source of sourceFields; trackBy: trackByFieldKey">{{ source.label }}</option>
                </select>
            </div>
        </div>
    </div>

    <div class="nx-data-mapping-summary" [class.complete]="allRequiredMapped">
        {{ mappedRequiredCount }} of {{ requiredFields.length }} required fields mapped
    </div>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Data Mapping Editor"></nx-pro-locked>
</ng-template>
