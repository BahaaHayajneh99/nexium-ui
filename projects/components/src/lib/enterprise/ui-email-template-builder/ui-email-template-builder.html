<ng-container *ngIf="licensed(); else elseBlock1">
    <div class="nx-email-builder">
        <aside class="nx-email-builder-palette">
            <div class="nx-email-builder-palette-title">Add block</div>
            <ng-container *ngFor="let type of blockTypes; trackBy: trackByBlockType">
                <button type="button" class="nx-email-builder-add-btn" (click)="addBlock(type)">
                    <nx-icon [icon]="blockIcons[type]" variant="svg" [size]="14"></nx-icon>
                    {{ blockLabels[type] }}
                </button>
            </ng-container>

            <button type="button" class="nx-email-builder-export-toggle" (click)="showExport.set(!showExport())">
                {{ showExport() ? 'Hide HTML' : 'Export HTML' }}
            </button>
        </aside>

        <main class="nx-email-builder-canvas">
            <ng-container *ngFor="let block of blocks; trackBy: trackByBlockId">
                <div
                    class="nx-email-builder-block"
                    [class.selected]="selectedId() === block.id"
                    (click)="selectBlock(block.id)">

                    <div class="nx-email-builder-block-controls">
                        <button type="button" (click)="moveUp(block.id); $event.stopPropagation()" aria-label="Move up">
                            <nx-icon icon="nx-chevron-up" variant="svg" [size]="12"></nx-icon>
                        </button>
                        <button type="button" (click)="moveDown(block.id); $event.stopPropagation()" aria-label="Move down">
                            <nx-icon icon="nx-chevron-down" variant="svg" [size]="12"></nx-icon>
                        </button>
                        <button type="button" class="nx-email-builder-remove" (click)="removeBlock(block.id); $event.stopPropagation()" aria-label="Remove">
                            <nx-icon icon="nx-close" variant="svg" [size]="12"></nx-icon>
                        </button>
                    </div>

                    <ng-container [ngSwitch]="block.type">
                        <h2 *ngSwitchCase="'heading'" class="nx-email-builder-heading" [style.text-align]="block.align">{{ block.text }}</h2>
                        <p *ngSwitchCase="'text'" class="nx-email-builder-text" [style.text-align]="block.align">{{ block.text }}</p>
                        <div *ngSwitchCase="'image'" class="nx-email-builder-image-wrap" [style.text-align]="block.align">
                            <img [src]="block.src" [alt]="block.alt" class="nx-email-builder-image" />
                        </div>
                        <div *ngSwitchCase="'button'" [style.text-align]="block.align">
                            <span class="nx-email-builder-button">{{ block.text }}</span>
                        </div>
                        <hr *ngSwitchCase="'divider'" class="nx-email-builder-divider" />
                        <div *ngSwitchCase="'spacer'" class="nx-email-builder-spacer" [style.height.px]="block.height"></div>
                    </ng-container>
                </div>
            </ng-container>
            <ng-container *ngIf="!blocks || blocks.length === 0">
                <div class="nx-email-builder-empty">Add a block from the left to start your template.</div>
            </ng-container>
        </main>

        <aside class="nx-email-builder-props">
            <ng-container *ngIf="selectedBlock() as block; else elseBlock2">
                <div class="nx-email-builder-props-title">{{ blockLabels[block.type] }} properties</div>

                <label class="nx-email-builder-field" *ngIf="block.type === 'heading' || block.type === 'text' || block.type === 'button'">
                    <span>{{ block.type === 'button' ? 'Label' : 'Text' }}</span>
                    <textarea
                        [ngModel]="block.text"
                        (ngModelChange)="updateSelected({ text: $event })"
                        rows="3">
                    </textarea>
                </label>

                <label class="nx-email-builder-field" *ngIf="block.type === 'button'">
                    <span>Link URL</span>
                    <input type="text" [ngModel]="block.href" (ngModelChange)="updateSelected({ href: $event })" />
                </label>

                <ng-container *ngIf="block.type === 'image'">
                    <label class="nx-email-builder-field">
                        <span>Image URL</span>
                        <input type="text" [ngModel]="block.src" (ngModelChange)="updateSelected({ src: $event })" />
                    </label>
                    <label class="nx-email-builder-field">
                        <span>Alt text</span>
                        <input type="text" [ngModel]="block.alt" (ngModelChange)="updateSelected({ alt: $event })" />
                    </label>
                </ng-container>

                <label class="nx-email-builder-field" *ngIf="block.type === 'spacer'">
                    <span>Height (px)</span>
                    <input type="number" [ngModel]="block.height" (ngModelChange)="updateSelected({ height: $event })" />
                </label>

                <label class="nx-email-builder-field" *ngIf="block.type !== 'divider' && block.type !== 'spacer'">
                    <span>Align</span>
                    <select [ngModel]="block.align" (ngModelChange)="updateSelected({ align: $event })">
                        <option value="left">Left</option>
                        <option value="center">Center</option>
                        <option value="right">Right</option>
                    </select>
                </label>
            </ng-container>
            <ng-template #elseBlock2>
                <div class="nx-email-builder-props-empty">Select a block to edit its properties.</div>
            </ng-template>
        </aside>
    </div>

    <div class="nx-email-builder-export" *ngIf="showExport()">
        <pre class="nx-email-builder-export-code">{{ exportHtml() }}</pre>
        <button type="button" class="nx-email-builder-copy-btn" (click)="copyExport()">Copy</button>
    </div>
</ng-container>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Email Template Builder"></nx-pro-locked>
</ng-template>
