<div class="nx-login-activity" *ngIf="licensed(); else elseBlock1">
    <div class="nx-la-filters">
        <button
            type="button"
            class="nx-la-filter-btn"
            [class.active]="statusFilter() === 'all'"
            (click)="statusFilter.set('all')">
            All
        </button>
        <button
            type="button"
            class="nx-la-filter-btn"
            [class.active]="statusFilter() === 'success'"
            (click)="statusFilter.set('success')">
            Successful
        </button>
        <button
            type="button"
            class="nx-la-filter-btn"
            [class.active]="statusFilter() === 'failed'"
            (click)="statusFilter.set('failed')">
            Failed
        </button>
    </div>

    <table class="nx-la-table">
        <thead>
            <tr>
                <th>Status</th>
                <th>Date</th>
                <th>IP Address</th>
                <th>Location</th>
                <th>Device</th>
            </tr>
        </thead>
        <tbody>
            <tr class="nx-la-row" *ngFor="let entry of filteredEntries; trackBy: trackByEntryId">
                <td>
                    <span class="nx-la-status-badge" [class.success]="entry.success" [class.failed]="!entry.success">
                        <nx-icon
                            [icon]="entry.success ? 'nx-check-circle' : 'nx-x-circle'"
                            variant="svg"
                            [size]="13"></nx-icon>
                        {{ entry.success ? 'Success' : 'Failed' }}
                    </span>
                    <div class="nx-la-failure-reason" *ngIf="!entry.success && entry.failureReason">{{ entry.failureReason }}</div>
                </td>
                <td>{{ formatTimestamp(entry.timestamp) }}</td>
                <td>{{ entry.ipAddress }}</td>
                <td>{{ entry.location || '—' }}</td>
                <td>{{ entry.device }}</td>
            </tr>
            <tr *ngIf="!filteredEntries || filteredEntries.length === 0">
                <td class="nx-la-empty" [attr.colspan]="5">No login attempts match this filter.</td>
            </tr>
        </tbody>
    </table>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Login Activity"></nx-pro-locked>
</ng-template>
