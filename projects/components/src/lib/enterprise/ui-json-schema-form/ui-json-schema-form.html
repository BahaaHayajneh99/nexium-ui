<form class="nx-json-schema-form" novalidate (ngSubmit)="handleSubmit()" *ngIf="licensed(); else elseBlock1">
    <ng-container *ngFor="let key of fieldKeys; trackBy: trackByKey">
        <ng-container *ngIf="field(key) as f">
            <div class="nx-json-schema-form-field">
                <ng-container [ngSwitch]="f.type">
                    <ng-container *ngSwitchCase="'boolean'">
                        <nx-checkbox
                            #ctrl
                            [label]="f.label || key"
                            [checked]="asBoolean(values()[key])"
                            [isRequired]="!!f.required"
                            [requiredErrorMessage]="f.requiredErrorMessage || 'This field is required'"
                            (checkedChange)="setValue(key, $event)">
                        </nx-checkbox>
                    </ng-container>
                    <ng-container *ngSwitchCase="'select'">
                        <nx-select
                            #ctrl
                            [label]="f.label || key"
                            [placeholder]="f.placeholder || 'Select...'"
                            [options]="selectOptions(f)"
                            [value]="asString(values()[key])"
                            [isRequired]="!!f.required"
                            [requiredErrorMessage]="f.requiredErrorMessage || 'Please select an option'"
                            (valueChange)="setValue(key, $event)">
                        </nx-select>
                    </ng-container>
                    <ng-container *ngSwitchCase="'textarea'">
                        <nx-textarea
                            #ctrl
                            [label]="f.label || key"
                            [placeholder]="f.placeholder || ''"
                            [rows]="f.rows || 4"
                            [value]="asString(values()[key])"
                            [isRequired]="!!f.required"
                            [requiredErrorMessage]="f.requiredErrorMessage || 'This field is required'"
                            (valueChange)="setValue(key, $event)">
                        </nx-textarea>
                    </ng-container>
                    <ng-container *ngSwitchCase="'number'">
                        <nx-number
                            #ctrl
                            [label]="f.label || key"
                            [placeholder]="f.placeholder || ''"
                            [ngModel]="asNumber(values()[key])"
                            [ngModelOptions]="{standalone: true}"
                            [isRequired]="!!f.required"
                            [requiredErrorMessage]="f.requiredErrorMessage || 'Please enter a value'"
                            (ngModelChange)="setValue(key, $event)">
                        </nx-number>
                    </ng-container>
                    <ng-container *ngSwitchDefault>
                        <nx-input
                            #ctrl
                            [label]="f.label || key"
                            [type]="f.type === 'email' ? 'email' : 'text'"
                            [pattern]="f.type === 'email' ? 'email' : null"
                            [placeholder]="f.placeholder || ''"
                            [value]="asString(values()[key])"
                            [isRequired]="!!f.required"
                            [requiredErrorMessage]="f.requiredErrorMessage || 'This field is required'"
                            (valueChange)="setValue(key, $event)">
                        </nx-input>
                    </ng-container>
                </ng-container>
            </div>
        </ng-container>
    </ng-container>

    <nx-button variant="primary" *ngIf="showSubmitButton">{{ submitLabel }}</nx-button>
</form>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="JSON Schema Form"></nx-pro-locked>
</ng-template>
