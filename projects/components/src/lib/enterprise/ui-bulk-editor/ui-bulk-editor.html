<nx-modal
        *ngIf="licensed(); else elseBlock1"
        [open]="open"
        [header]="'Bulk Edit ' + records.length + ' Record' + (records.length === 1 ? '' : 's')"
        (openChange)="handleCancel()">
        <ng-container nx-modal-body>
            <div class="nx-bulk-editor">
                <div class="nx-bulk-editor-preview" *ngIf="records.length">
                    <span class="nx-bulk-editor-preview-label">Editing:</span>
                    <div class="nx-bulk-editor-preview-list">
                        <span class="nx-bulk-editor-chip" *ngFor="let record of records; trackBy: trackByIndex">{{ recordLabel(record) }}</span>
                    </div>
                </div>

                <div class="nx-bulk-editor-fields">
                    <div class="nx-bulk-editor-field" [class.active]="isApplied(field.key)" *ngFor="let field of fields; trackBy: trackByFieldKey">
                        <label class="nx-bulk-editor-apply">
                            <input
                                type="checkbox"
                                [checked]="isApplied(field.key)"
                                (change)="toggleApply(field.key, $any($event.target).checked)" />
                            Apply this field
                        </label>

                        <div class="nx-bulk-editor-control">
                            <label class="nx-bulk-editor-field-label" [attr.for]="'nx-bulk-editor-' + field.key">{{ field.label }}</label>

                            <ng-container [ngSwitch]="field.type">
                                <select
                                    *ngSwitchCase="'select'"
                                    [id]="'nx-bulk-editor-' + field.key"
                                    class="nx-bulk-editor-input"
                                    [disabled]="!isApplied(field.key)"
                                    [ngModel]="draftValues()[field.key]"
                                    [ngModelOptions]="{ standalone: true }"
                                    (ngModelChange)="setDraftValue(field.key, $event)">
                                    <option value="">-- Select --</option>
                                    <option [value]="opt.value" *ngFor="let opt of field.options ?? []; trackBy: trackByOptionValue">{{ opt.label }}</option>
                                </select>
                                <input
                                    *ngSwitchCase="'checkbox'"
                                    [id]="'nx-bulk-editor-' + field.key"
                                    type="checkbox"
                                    [disabled]="!isApplied(field.key)"
                                    [ngModel]="draftValues()[field.key]"
                                    [ngModelOptions]="{ standalone: true }"
                                    (ngModelChange)="setDraftValue(field.key, $event)" />
                                <input
                                    *ngSwitchCase="'date'"
                                    [id]="'nx-bulk-editor-' + field.key"
                                    type="date"
                                    class="nx-bulk-editor-input"
                                    [disabled]="!isApplied(field.key)"
                                    [ngModel]="draftValues()[field.key]"
                                    [ngModelOptions]="{ standalone: true }"
                                    (ngModelChange)="setDraftValue(field.key, $event)" />
                                <input
                                    *ngSwitchCase="'number'"
                                    [id]="'nx-bulk-editor-' + field.key"
                                    type="number"
                                    class="nx-bulk-editor-input"
                                    [disabled]="!isApplied(field.key)"
                                    [ngModel]="draftValues()[field.key]"
                                    [ngModelOptions]="{ standalone: true }"
                                    (ngModelChange)="setDraftValue(field.key, $event)" />
                                <input
                                    *ngSwitchDefault
                                    [id]="'nx-bulk-editor-' + field.key"
                                    type="text"
                                    class="nx-bulk-editor-input"
                                    [disabled]="!isApplied(field.key)"
                                    [ngModel]="draftValues()[field.key]"
                                    [ngModelOptions]="{ standalone: true }"
                                    (ngModelChange)="setDraftValue(field.key, $event)" />
                            </ng-container>
                        </div>
                    </div>
                    <div class="nx-bulk-editor-empty" *ngIf="!fields || fields.length === 0">No bulk-editable fields configured.</div>
                </div>
            </div>
        </ng-container>

        <ng-container nx-modal-footer>
            <span class="nx-bulk-editor-applied-count">{{ appliedKeys().size }} field(s) selected</span>
            <button type="button" class="nx-bulk-editor-btn" (click)="handleCancel()">Cancel</button>
            <button
                type="button"
                class="nx-bulk-editor-btn nx-bulk-editor-btn-primary"
                [disabled]="appliedKeys().size === 0"
                (click)="applyChanges()">
                Apply to {{ records.length }} Record{{ records.length === 1 ? '' : 's' }}
            </button>
        </ng-container>
    </nx-modal>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Bulk Editor"></nx-pro-locked>
</ng-template>
