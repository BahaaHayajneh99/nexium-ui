<div class="nx-permission-matrix-wrapper" *ngIf="licensed(); else elseBlock1">
    <div class="nx-permission-matrix-toolbar">
        <input
            type="text"
            class="nx-permission-matrix-search"
            placeholder="Search permissions..."
            [ngModel]="searchText()"
            (ngModelChange)="searchText.set($event)" />

        <div class="nx-permission-matrix-toolbar-actions">
            <input
                type="text"
                class="nx-permission-matrix-role-input"
                placeholder="Role name"
                [ngModel]="newRoleDraft()"
                (ngModelChange)="newRoleDraft.set($event)"
                (keydown.enter)="addRole()"
                (keydown.escape)="cancelAddRole()"
                (blur)="addRole()"
                *ngIf="addingRole(); else elseBlock2" />
            <ng-template #elseBlock2>
                <button type="button" class="nx-permission-matrix-btn" (click)="startAddRole()">
                    <nx-icon icon="nx-plus" variant="svg" [size]="12"></nx-icon> Add role
                </button>
            </ng-template>
            <button type="button" class="nx-permission-matrix-btn" (click)="exportJson()">
                <nx-icon icon="nx-download" variant="svg" [size]="12"></nx-icon> Export JSON
            </button>
            <label class="nx-permission-matrix-btn nx-permission-matrix-import">
                <nx-icon icon="nx-upload" variant="svg" [size]="12"></nx-icon> Import JSON
                <input type="file" accept="application/json" hidden (change)="importJson($any($event.target).files)" />
            </label>
        </div>
    </div>

    <div class="nx-permission-matrix-error" *ngIf="importError() as err">{{ err }}</div>

    <table class="nx-permission-matrix">
        <thead>
            <tr>
                <th class="nx-permission-matrix-corner"></th>
                <th class="nx-permission-matrix-col-header" *ngFor="let role of roles; trackBy: trackByRole">
                    <div class="nx-permission-matrix-role-header">
                        <button type="button" class="nx-permission-matrix-header-btn" (click)="toggleRoleColumn(role)">
                            {{ role }}
                        </button>
                        <button
                            type="button"
                            class="nx-permission-matrix-role-remove"
                            (click)="removeRole(role)"
                            [attr.aria-label]="'Remove role ' + role">
                            <nx-icon icon="nx-close" variant="svg" [size]="10"></nx-icon>
                        </button>
                    </div>
                    <select
                        class="nx-permission-matrix-inherit-select"
                        [attr.aria-label]="role + ' inherits from'"
                        [ngModel]="inheritance[role] ?? ''"
                        (ngModelChange)="setInheritance(role, $event)">
                        <option value="">No inheritance</option>
                        <option [value]="other" *ngFor="let other of rolesExcept(role); trackBy: trackByRole">{{ other }}</option>
                    </select>
                </th>
            </tr>
        </thead>
        <tbody>
            <ng-container *ngIf="groupedRows() as groups; else elseBlock3">
                <ng-container *ngFor="let group of groups; trackBy: trackByGroupLabel">
                    <tr class="nx-permission-matrix-group-row">
                        <th class="nx-permission-matrix-group-header" [attr.colspan]="roles.length + 1">
                            <button type="button" class="nx-permission-matrix-group-toggle" (click)="toggleGroupCollapse(group.label)">
                                <nx-icon
                                    [icon]="isGroupCollapsed(group.label) ? 'nx-chevron-right' : 'nx-chevron-down'"
                                    variant="svg"
                                    [size]="12">
                                </nx-icon>
                                {{ group.label }}
                            </button>
                        </th>
                    </tr>
                    <ng-container *ngIf="!isGroupCollapsed(group.label)">
                        <tr *ngFor="let permission of group.permissions; trackBy: trackByPermission">
                            <th class="nx-permission-matrix-row-header">
                                <button type="button" class="nx-permission-matrix-header-btn" (click)="togglePermissionRow(permission)">
                                    {{ permission }}
                                </button>
                            </th>
                            <td class="nx-permission-matrix-cell" [class.inherited]="isInheritedGranted(role, permission)" *ngFor="let role of roles; trackBy: trackByRole">
                                <input
                                    type="checkbox"
                                    [checked]="isGranted(role, permission)"
                                    (change)="toggleCell(role, permission)" />
                            </td>
                        </tr>
                    </ng-container>
                </ng-container>
                <ng-container *ngIf="!groups || groups.length === 0">
                    <tr><td [attr.colspan]="roles.length + 1" class="nx-permission-matrix-empty">No matching permissions.</td></tr>
                </ng-container>
            </ng-container>
            <ng-template #elseBlock3>
                <ng-container *ngIf="flatRows() as rows">
                    <tr *ngFor="let permission of rows; trackBy: trackByPermission">
                        <th class="nx-permission-matrix-row-header">
                            <button type="button" class="nx-permission-matrix-header-btn" (click)="togglePermissionRow(permission)">
                                {{ permission }}
                            </button>
                        </th>
                        <td class="nx-permission-matrix-cell" [class.inherited]="isInheritedGranted(role, permission)" *ngFor="let role of roles; trackBy: trackByRole">
                            <input
                                type="checkbox"
                                [checked]="isGranted(role, permission)"
                                (change)="toggleCell(role, permission)" />
                        </td>
                    </tr>
                    <ng-container *ngIf="!rows || rows.length === 0">
                        <tr><td [attr.colspan]="roles.length + 1" class="nx-permission-matrix-empty">No matching permissions.</td></tr>
                    </ng-container>
                </ng-container>
            </ng-template>
        </tbody>
    </table>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Permission Matrix"></nx-pro-locked>
</ng-template>
