<div class="nx-rab-wrapper" *ngIf="licensed(); else elseBlock1">
    <table class="nx-rab-table">
        <thead>
            <tr>
                <th class="nx-rab-corner">Person</th>
                <th class="nx-rab-slot-header" *ngFor="let slot of slots; trackBy: trackBySlotId">{{ slot.label }}</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let person of people; trackBy: trackByPersonId">
                <th class="nx-rab-person-cell">
                    <nx-avatar [name]="person.name" [src]="person.avatarSrc" size="small" bordered></nx-avatar>
                    <span class="nx-rab-person-name">{{ person.name }}</span>
                </th>
                <td
                    class="nx-rab-cell"
                    [class.conflict]="isOverAllocated(person, slot.id)"
                    (click)="onCellClick(person.id, slot.id)"
                    *ngFor="let slot of slots; trackBy: trackBySlotId">
                    <nx-icon
                        *ngIf="isOverAllocated(person, slot.id)"
                        class="nx-rab-conflict-icon"
                        icon="nx-alert-triangle"
                        variant="svg"
                        [size]="12"
                        color="var(--nx-color-danger, #e74c3c)">
                    </nx-icon>
                    <div class="nx-rab-chip-stack">
                        <button
                            type="button"
                            class="nx-rab-chip"
                            [style.background-color]="chipColor(assignment)"
                            (click)="onAssignmentClick(assignment, $event)"
                            *ngFor="let assignment of cellAssignments(person.id, slot.id); trackBy: trackByAssignmentId">
                            {{ assignment.projectName }}
                        </button>
                        <span class="nx-rab-cell-empty-hint" *ngIf="!cellAssignments(person.id, slot.id) || cellAssignments(person.id, slot.id).length === 0"></span>
                    </div>
                </td>
            </tr>
            <tr *ngIf="!people || people.length === 0">
                <td [attr.colspan]="slots.length + 1" class="nx-rab-empty-state">No people to show.</td>
            </tr>
        </tbody>
    </table>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Resource Allocation Board"></nx-pro-locked>
</ng-template>
