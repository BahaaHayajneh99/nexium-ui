<div class="nx-device-sessions" *ngIf="licensed(); else elseBlock1">
    <div class="nx-ds-header">
        <span class="nx-ds-count">{{ sessions.length }} active session{{ sessions.length === 1 ? '' : 's' }}</span>
        <button type="button" class="nx-ds-revoke-all" *ngIf="otherSessionsCount > 0" (click)="onRevokeAll()">Revoke all other sessions</button>
    </div>

    <div class="nx-ds-list">
        <ng-container *ngFor="let session of sessions; trackBy: trackBySessionId">
            <div class="nx-ds-row">
                <div class="nx-ds-icon">
                    <nx-icon [icon]="iconFor(session.deviceType)" variant="svg" [size]="20"></nx-icon>
                </div>

                <div class="nx-ds-content">
                    <div class="nx-ds-head">
                        <strong class="nx-ds-name">{{ session.deviceName }}</strong>
                        <span class="nx-ds-current-badge" *ngIf="session.isCurrent">This device</span>
                    </div>
                    <div class="nx-ds-meta">
                        <span>{{ session.browser }}</span>
                        <span *ngIf="session.location">{{ session.location }}</span>
                        <span>Active {{ formatLastActive(session.lastActive) }}</span>
                    </div>
                </div>

                <button type="button" class="nx-ds-revoke-btn" *ngIf="!session.isCurrent" (click)="onRevoke(session.id)">Revoke</button>
            </div>
        </ng-container>
        <ng-container *ngIf="!sessions || sessions.length === 0">
            <p class="nx-ds-empty">No active sessions.</p>
        </ng-container>
    </div>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Device Sessions"></nx-pro-locked>
</ng-template>
