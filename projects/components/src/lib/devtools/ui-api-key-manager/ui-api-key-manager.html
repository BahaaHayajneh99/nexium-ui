<div class="nx-api-key-manager" *ngIf="licensed(); else elseBlock1">
    <div class="nx-api-key-manager-banner" *ngIf="showBanner()">
        <div class="nx-api-key-manager-banner-icon">
            <nx-icon icon="nx-alert-triangle" variant="svg" [size]="16"></nx-icon>
        </div>
        <div class="nx-api-key-manager-banner-body">
            <strong>Copy this key now - you won't be able to see it again.</strong>
            <code class="nx-api-key-manager-banner-key">{{ newlyCreatedKey }}</code>
        </div>
        <div class="nx-api-key-manager-banner-actions">
            <button
                type="button"
                class="nx-api-key-manager-btn"
                [nxCopyToClipboard]="newlyCreatedKey ?? ''"
                (nxCopied)="onCopied()">
                <nx-icon icon="nx-copy" variant="svg" [size]="12"></nx-icon>
                {{ copied() ? 'Copied!' : 'Copy' }}
            </button>
            <button type="button" class="nx-api-key-manager-banner-dismiss" (click)="dismissBanner()" aria-label="Dismiss">
                <nx-icon icon="nx-close" variant="svg" [size]="12"></nx-icon>
            </button>
        </div>
    </div>

    <div class="nx-api-key-manager-toolbar">
        <button type="button" class="nx-api-key-manager-create" (click)="createKey.emit()">
            <nx-icon icon="nx-plus" variant="svg" [size]="12"></nx-icon> Create new key
        </button>
    </div>

    <table class="nx-api-key-manager-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Key</th>
                <th>Scopes</th>
                <th>Created</th>
                <th>Last used</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let key of apiKeys; trackBy: trackByKeyId">
                <td class="nx-api-key-manager-name">{{ key.name }}</td>
                <td><code class="nx-api-key-manager-masked">{{ key.maskedKey }}</code></td>
                <td>
                    <div class="nx-api-key-manager-scopes">
                        <span class="nx-api-key-manager-badge" *ngFor="let scope of key.scopes; trackBy: trackByScope">{{ scope }}</span>
                    </div>
                </td>
                <td class="nx-api-key-manager-date">{{ formatDate(key.createdAt) }}</td>
                <td class="nx-api-key-manager-date">{{ key.lastUsedAt ? formatDate(key.lastUsedAt) : 'Never used' }}</td>
                <td>
                    <button type="button" class="nx-api-key-manager-revoke" (click)="revokeKey.emit(key.id)">
                        <nx-icon icon="nx-trash" variant="svg" [size]="12"></nx-icon> Revoke
                    </button>
                </td>
            </tr>
            <tr *ngIf="!apiKeys || apiKeys.length === 0"><td colspan="6" class="nx-api-key-manager-empty">No API keys yet.</td></tr>
        </tbody>
    </table>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="API Key Manager"></nx-pro-locked>
</ng-template>
