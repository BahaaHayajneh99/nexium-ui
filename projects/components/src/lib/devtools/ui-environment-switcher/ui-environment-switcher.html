<div class="nx-environment-switcher">
    <button type="button" class="nx-environment-switcher-item" [class.active]="env.id === activeId" (click)="select(env.id)" *ngFor="let env of environments; trackBy: trackByEnvId">
        <span class="nx-environment-switcher-dot" [style.background-color]="env.color ?? 'var(--shell-text-secondary)'"></span>
        {{ env.label }}
    </button>
</div>
