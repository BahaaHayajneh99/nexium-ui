<div class="nx-webhook-manager" *ngIf="licensed(); else elseBlock1">
    <div class="nx-webhook-manager-toolbar">
        <button type="button" class="nx-webhook-manager-btn" (click)="startAdd()" *ngIf="!addingWebhook()">
            <nx-icon icon="nx-plus" variant="svg" [size]="12"></nx-icon> Add webhook
        </button>
    </div>

    <div class="nx-webhook-manager-form" *ngIf="addingWebhook()">
        <input
            type="text"
            class="nx-webhook-manager-url-input"
            placeholder="https://example.com/webhooks/incoming"
            [ngModel]="draftUrl()"
            (ngModelChange)="draftUrl.set($event)"
            [ngModelOptions]="{standalone: true}" />

        <div class="nx-webhook-manager-events-checklist">
            <label class="nx-webhook-manager-event-option" *ngFor="let event of availableEvents; trackBy: trackByEventValue">
                <input
                    type="checkbox"
                    [checked]="isDraftEventSelected(event.value)"
                    (change)="toggleDraftEvent(event.value)" />
                {{ event.label }}
            </label>
        </div>

        <div class="nx-webhook-manager-form-actions">
            <button type="button" class="nx-webhook-manager-save" [disabled]="!canSubmitAdd" (click)="submitAdd()">Save webhook</button>
            <button type="button" class="nx-webhook-manager-btn" (click)="cancelAdd()">Cancel</button>
        </div>
    </div>

    <div class="nx-webhook-manager-list">
        <div class="nx-webhook-manager-row" *ngFor="let webhook of webhooks; trackBy: trackByWebhookId">
            <div class="nx-webhook-manager-row-main">
                <div class="nx-webhook-manager-url">{{ webhook.url }}</div>

                <div class="nx-webhook-manager-events">
                    <span class="nx-webhook-manager-badge" *ngFor="let event of webhook.events; trackBy: trackByWebhookEventName">{{ eventLabel(event) }}</span>
                </div>

                <div class="nx-webhook-manager-delivery">
                    <span class="nx-webhook-manager-status success" *ngIf="webhook.lastDeliveryStatus === 'success'; else elseIfBlock2">
                        <nx-icon icon="nx-check-circle" variant="svg" [size]="12"></nx-icon> Success
                    </span>
                    <ng-template #elseIfBlock2>
                        <span class="nx-webhook-manager-status failed" *ngIf="webhook.lastDeliveryStatus === 'failed'; else elseBlock3">
                            <nx-icon icon="nx-x-circle" variant="svg" [size]="12"></nx-icon> Failed
                        </span>
                        <ng-template #elseBlock3>
                            <span class="nx-webhook-manager-status none">No deliveries yet</span>
                        </ng-template>
                    </ng-template>
                    <span class="nx-webhook-manager-delivery-time" *ngIf="webhook.lastDeliveryAt">{{ formatDate(webhook.lastDeliveryAt) }}</span>
                </div>
            </div>

            <div class="nx-webhook-manager-row-actions">
                <label class="nx-webhook-manager-toggle">
                    <input type="checkbox" [checked]="webhook.enabled" (change)="onToggle(webhook)" />
                    <span>{{ webhook.enabled ? 'Enabled' : 'Disabled' }}</span>
                </label>

                <button
                    type="button"
                    class="nx-webhook-manager-btn"
                    [disabled]="pingingId() === webhook.id"
                    (click)="onTestPing(webhook.id)">
                    <nx-icon icon="nx-send" variant="svg" [size]="12"></nx-icon>
                    {{ pingingId() === webhook.id ? 'Sending...' : 'Send test ping' }}
                </button>

                <button
                    type="button"
                    class="nx-webhook-manager-delete"
                    (click)="deleteWebhook.emit(webhook.id)"
                    aria-label="Delete webhook">
                    <nx-icon icon="nx-trash" variant="svg" [size]="12"></nx-icon>
                </button>
            </div>
        </div>
        <div class="nx-webhook-manager-empty" *ngIf="!webhooks || webhooks.length === 0">No webhooks configured yet.</div>
    </div>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Webhook Manager"></nx-pro-locked>
</ng-template>
