@if (licensed()) {
    <div class="nx-code-editor">
        @if (showLineNumbers) {
            <div class="nx-code-editor-gutter" #gutter>
                @for (line of lines; track $index) {
                    <span class="nx-code-editor-line-number">{{ $index + 1 }}</span>
                }
            </div>
        }
        <textarea
            class="nx-code-editor-textarea"
            spellcheck="false"
            [disabled]="disabled"
            [value]="code()"
            (input)="onInput($any($event.target).value)"
            (scroll)="onScroll($event)"></textarea>
    </div>
} @else {
    <nx-pro-locked componentName="Code Editor"></nx-pro-locked>
}
