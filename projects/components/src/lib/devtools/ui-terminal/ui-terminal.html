<div class="nx-terminal" *ngIf="licensed(); else elseBlock1">
    <div class="nx-terminal-output">
        <div class="nx-terminal-line" [class]="line.type" *ngFor="let line of lines; trackBy: trackByIndex">
            <span class="nx-terminal-prompt" *ngIf="line.type === 'input'">{{ prompt }}</span>
            <span class="nx-terminal-text">{{ line.text }}</span>
        </div>
    </div>

    <div class="nx-terminal-input-row" *ngIf="interactive">
        <span class="nx-terminal-prompt">{{ prompt }}</span>
        <input
            type="text"
            class="nx-terminal-input"
            [value]="draft()"
            (input)="draft.set($any($event.target).value)"
            (keydown.enter)="onEnter()" />
    </div>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Terminal"></nx-pro-locked>
</ng-template>
