<div class="nx-calculator" tabindex="0" (keydown)="onKeyDown($event)" *ngIf="licensed(); else elseBlock1">
    <div class="nx-calc-toolbar">
        <div class="nx-calc-mode-toggle">
            <button type="button" [class.active]="mode() === 'standard'" (click)="setMode('standard')">Standard</button>
            <button type="button" [class.active]="mode() === 'scientific'" (click)="setMode('scientific')">Scientific</button>
        </div>

        <div class="nx-calc-angle-toggle" *ngIf="mode() === 'scientific'">
            <button type="button" [class.active]="angleMode() === 'deg'" (click)="setAngleMode('deg')">DEG</button>
            <button type="button" [class.active]="angleMode() === 'rad'" (click)="setAngleMode('rad')">RAD</button>
        </div>

        <button
            type="button"
            class="nx-calc-history-toggle"
            [class.active]="showHistory()"
            (click)="toggleHistory()"
            aria-label="Toggle history">
            <nx-icon icon="nx-clock" variant="svg" [size]="16"></nx-icon>
        </button>
    </div>

    <div class="nx-calc-body">
        <div class="nx-calc-display">
            <span class="nx-calc-memory-indicator" *ngIf="hasMemory()">M</span>
            <div class="nx-calc-expression" [class.empty]="!expression()">{{ expression() || '0' }}</div>
            <div class="nx-calc-preview" *ngIf="preview() as p">= {{ p }}</div>
            <div class="nx-calc-error" *ngIf="error() as err">{{ err }}</div>
        </div>

        <div class="nx-calc-pads">
            <div class="nx-calc-pad nx-calc-pad-sci" *ngIf="mode() === 'scientific'">
                <button type="button" [class]="'nx-calc-btn nx-calc-btn-' + button.variant" (click)="press(button)" *ngFor="let button of scientificButtons; trackBy: trackByScientificButtonLabel">{{ button.label }}</button>
            </div>
            <div class="nx-calc-pad nx-calc-pad-standard">
                <button type="button" [class]="'nx-calc-btn nx-calc-btn-' + button.variant" (click)="press(button)" *ngFor="let button of standardButtons; trackBy: trackByStandardButtonLabel">{{ button.label }}</button>
            </div>
        </div>
    </div>

    <div class="nx-calc-history" *ngIf="showHistory()">
        <div class="nx-calc-history-header">
            <span>History</span>
            <button type="button" class="nx-calc-history-clear" (click)="clearHistory()" aria-label="Clear history">
                <nx-icon icon="nx-trash" variant="svg" [size]="14"></nx-icon>
            </button>
        </div>
        <p class="nx-calc-history-empty" *ngIf="history().length === 0; else elseBlock2">No calculations yet.</p>
        <ng-template #elseBlock2>
            <button type="button" class="nx-calc-history-row" (click)="useHistoryEntry(entry)" *ngFor="let entry of history(); trackBy: trackByHistoryTimestamp">
                <span class="nx-calc-history-expr">{{ entry.expression }}</span>
                <span class="nx-calc-history-result">= {{ entry.result }}</span>
            </button>
        </ng-template>
    </div>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Calculator"></nx-pro-locked>
</ng-template>
