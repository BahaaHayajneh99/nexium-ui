<div class="nx-chart">

    <button type="button" class="nx-chart-table-toggle" (click)="toggleTable()">
        {{ showTable ? 'View as chart' : 'View as table' }}
    </button>

    <ng-container *ngIf="!showTable; else elseBlock1">
        <div class="nx-chart-canvas">
            <svg
                #svgRef
                [attr.viewBox]="viewBox"
                preserveAspectRatio="xMidYMid meet"
                role="img"
                (pointermove)="onPointerMove($event, $any(svgRef))"
                (pointerleave)="onPointerLeave()">

                <ng-container *ngFor="let tick of yTicks; trackBy: trackByTick">
                    <line class="nx-chart-grid" [attr.x1]="44" [attr.x2]="600 - 16" [attr.y1]="tickY(tick)" [attr.y2]="tickY(tick)"></line>
                    <text class="nx-chart-axis-label" text-anchor="end" [attr.x]="38" [attr.y]="tickY(tick) + 4">
                        {{ formatTick(tick) }}
                    </text>
                </ng-container>

                <line
                    *ngIf="hoveredIndex !== null"
                    class="nx-chart-crosshair"
                    [attr.x1]="pointX(hoveredIndex)"
                    [attr.x2]="pointX(hoveredIndex)"
                    [attr.y1]="16"
                    [attr.y2]="height - 32">
                </line>

                <ng-container *ngFor="let s of series; trackBy: trackBySeriesName; let seriesIndex = index">
                    <path class="nx-chart-line" [attr.d]="linePath(s)" [attr.stroke]="seriesColorAt(s, seriesIndex)"></path>

                    <circle
                        *ngIf="hoveredIndex !== null"
                        class="nx-chart-marker"
                        [attr.cx]="pointX(hoveredIndex)"
                        [attr.cy]="pointY(s.data[hoveredIndex] ?? 0)"
                        r="4"
                        [attr.fill]="seriesColorAt(s, seriesIndex)">
                    </circle>
                </ng-container>

                <ng-container *ngFor="let category of categories; trackBy: trackByCategory; let i = index">
                    <text class="nx-chart-axis-label" text-anchor="middle" [attr.x]="categoryLabelX(i)" [attr.y]="height - 12">
                        {{ category }}
                    </text>
                </ng-container>

            </svg>

            <div class="nx-chart-tooltip" *ngIf="hoveredIndex !== null" [style]="tooltipStyle">
                <div class="nx-chart-tooltip-category">{{ categories[hoveredIndex] }}</div>
                <ng-container *ngFor="let s of series; trackBy: trackBySeriesName; let seriesIndex = index">
                    <div class="nx-chart-tooltip-row">
                        <span class="nx-chart-tooltip-key" [style.background]="seriesColorAt(s, seriesIndex)"></span>
                        <span class="nx-chart-tooltip-name">{{ s.name }}</span>
                        <strong class="nx-chart-tooltip-value">{{ formatTick(s.data[hoveredIndex] ?? 0) }}</strong>
                    </div>
                </ng-container>
            </div>
        </div>

        <div class="nx-chart-legend" *ngIf="hasLegend">
            <ng-container *ngFor="let s of series; trackBy: trackBySeriesName; let i = index">
                <div class="nx-chart-legend-item">
                    <span class="nx-chart-legend-key" [style.background]="seriesColorAt(s, i)"></span>
                    {{ s.name }}
                </div>
            </ng-container>
        </div>
    </ng-container>
    <ng-template #elseBlock1>
        <div class="nx-chart-table-wrap">
            <table class="nx-chart-table">
                <thead>
                    <tr>
                        <th></th>
                        <ng-container *ngFor="let s of series; trackBy: trackBySeriesName">
                            <th>{{ s.name }}</th>
                        </ng-container>
                    </tr>
                </thead>
                <tbody>
                    <ng-container *ngFor="let category of categories; trackBy: trackByCategory; let i = index">
                        <tr>
                            <th scope="row">{{ category }}</th>
                            <ng-container *ngFor="let s of series; trackBy: trackBySeriesName">
                                <td>{{ formatTick(s.data[i] ?? 0) }}</td>
                            </ng-container>
                        </tr>
                    </ng-container>
                </tbody>
            </table>
        </div>
    </ng-template>

</div>
