<div class="nx-chart">

    <button type="button" class="nx-chart-table-toggle" (click)="toggleTable()">
        {{ showTable ? 'View as chart' : 'View as table' }}
    </button>

    <ng-container *ngIf="!showTable; else elseBlock1">
        <div class="nx-chart-canvas">
            <svg [attr.viewBox]="viewBox" preserveAspectRatio="xMidYMid meet" role="img">

                <ng-container *ngFor="let tick of yTicks; trackBy: trackByTick">
                    <line
                        class="nx-chart-grid"
                        [attr.x1]="52"
                        [attr.x2]="600 - 16"
                        [attr.y1]="tickY(tick)"
                        [attr.y2]="tickY(tick)">
                    </line>
                    <text class="nx-chart-axis-label" text-anchor="end" [attr.x]="46" [attr.y]="tickY(tick) + 4">
                        {{ formatTick(tick) }}
                    </text>
                </ng-container>

                <line *ngIf="hasNegativeDip" class="nx-chart-baseline" [attr.x1]="52" [attr.x2]="600 - 16" [attr.y1]="tickY(0)" [attr.y2]="tickY(0)"></line>

                <ng-container *ngFor="let connector of connectors; trackBy: trackByConnector">
                    <line
                        class="nx-chart-waterfall-connector"
                        [attr.x1]="connector.x1"
                        [attr.x2]="connector.x2"
                        [attr.y1]="connector.y"
                        [attr.y2]="connector.y">
                    </line>
                </ng-container>

                <ng-container *ngFor="let bar of bars; trackBy: trackByBarIndex">
                    <path
                        class="nx-chart-waterfall-bar"
                        [class.nx-chart-waterfall-bar-hovered]="hovered === bar"
                        [attr.d]="bar.path"
                        [attr.fill]="bar.color"
                        tabindex="0"
                        role="img"
                        [attr.aria-label]="bar.point.label + ': ' + bar.labelText + ', running total ' + formatTick(bar.runningTotalAfter)"
                        (pointerenter)="onBarEnter(bar)"
                        (pointerleave)="onBarLeave()"
                        (focus)="onBarEnter(bar)"
                        (blur)="onBarLeave()">
                    </path>

                    <text class="nx-chart-waterfall-value" text-anchor="middle" [attr.x]="bar.x + bar.width / 2" [attr.y]="bar.labelY">
                        {{ bar.labelText }}
                    </text>
                </ng-container>

                <ng-container *ngFor="let point of data; trackBy: trackByPoint; let i = index">
                    <text class="nx-chart-axis-label" text-anchor="middle" [attr.x]="categoryLabelX(i)" [attr.y]="height - 12">
                        {{ point.label }}
                    </text>
                </ng-container>

            </svg>

            <div *ngIf="hovered" class="nx-chart-tooltip" [style]="hoveredTooltipStyle">
                <div class="nx-chart-tooltip-category">{{ hovered.point.label }}</div>
                <div class="nx-chart-tooltip-row">
                    <span class="nx-chart-tooltip-key" [style.background]="hovered.color"></span>
                    <span class="nx-chart-tooltip-name">{{ hovered.kind === 'total' ? 'Total' : 'Change' }}</span>
                    <strong class="nx-chart-tooltip-value">{{ hovered.labelText }}</strong>
                </div>
                <div class="nx-chart-tooltip-row">
                    <span class="nx-chart-tooltip-name">Running total</span>
                    <strong class="nx-chart-tooltip-value">{{ formatTick(hovered.runningTotalAfter) }}</strong>
                </div>
            </div>
        </div>

        <div class="nx-chart-legend">
            <ng-container *ngFor="let item of legendItems; trackBy: trackByLegendItem">
                <div class="nx-chart-legend-item">
                    <span class="nx-chart-legend-swatch" [style.background]="item.color"></span>
                    {{ item.label }}
                </div>
            </ng-container>
        </div>
    </ng-container>
    <ng-template #elseBlock1>
        <div class="nx-chart-table-wrap">
            <table class="nx-chart-table">
                <thead>
                    <tr>
                        <th>Label</th>
                        <th>Value</th>
                        <th>Running total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let bar of bars; trackBy: trackByBarIndex">
                        <th scope="row">{{ bar.point.label }}</th>
                        <td>{{ bar.labelText }}</td>
                        <td>{{ formatTick(bar.runningTotalAfter) }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </ng-template>

</div>
