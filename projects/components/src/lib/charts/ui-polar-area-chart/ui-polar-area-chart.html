<div class="nx-chart">

    <button type="button" class="nx-chart-table-toggle" (click)="toggleTable()">
        {{ showTable ? 'View as chart' : 'View as table' }}
    </button>

    <ng-container *ngIf="!showTable; else elseBlock1">
        <div class="nx-chart-canvas nx-polar-canvas">
            <svg [attr.viewBox]="viewBox" preserveAspectRatio="xMidYMid meet" role="img">

                <ng-container *ngFor="let radius of gridRadii; trackBy: trackByGridRadius">
                    <circle class="nx-chart-grid nx-polar-grid-ring" cx="150" cy="150" [attr.r]="radius" fill="none"></circle>
                </ng-container>
                <ng-container *ngFor="let grid of gridLabels; trackBy: trackByGridLabel">
                    <text class="nx-chart-axis-label" x="154" [attr.y]="150 - grid.radius + 10">{{ grid.text }}</text>
                </ng-container>

                <ng-container *ngFor="let wedge of wedges; trackBy: trackByWedgeLabel">
                    <path
                        class="nx-chart-slice"
                        [class.nx-chart-slice-hovered]="hoveredIndex === wedge.index"
                        [attr.d]="wedge.path"
                        [attr.fill]="wedge.color"
                        tabindex="0"
                        role="img"
                        [attr.aria-label]="wedge.datum.label + ': ' + formatValue(wedge.datum.value)"
                        (pointerenter)="onWedgeEnter(wedge.index)"
                        (pointerleave)="onWedgeLeave()"
                        (focus)="onWedgeEnter(wedge.index)"
                        (blur)="onWedgeLeave()">
                    </path>
                </ng-container>

            </svg>

            <ng-container *ngIf="hoveredWedge">
                <div class="nx-chart-tooltip" [style]="tooltipStyle">
                    <div class="nx-chart-tooltip-row">
                        <span class="nx-chart-tooltip-key" [style.background]="hoveredWedge.color"></span>
                        <span class="nx-chart-tooltip-name">{{ hoveredWedge.datum.label }}</span>
                        <strong class="nx-chart-tooltip-value">{{ formatValue(hoveredWedge.datum.value) }}</strong>
                    </div>
                </div>
            </ng-container>
        </div>

        <ng-container *ngIf="hasLegend">
            <div class="nx-chart-legend">
                <ng-container *ngFor="let wedge of wedges; trackBy: trackByWedgeLabel">
                    <div class="nx-chart-legend-item">
                        <span class="nx-chart-legend-swatch" [style.background]="wedge.color"></span>
                        {{ wedge.datum.label }} ({{ formatValue(wedge.datum.value) }})
                    </div>
                </ng-container>
            </div>
        </ng-container>
    </ng-container>
    <ng-template #elseBlock1>
        <div class="nx-chart-table-wrap">
            <table class="nx-chart-table">
                <thead>
                    <tr>
                        <th></th>
                        <th>Value</th>
                    </tr>
                </thead>
                <tbody>
                    <ng-container *ngFor="let wedge of wedges; trackBy: trackByWedgeLabel">
                        <tr>
                            <th scope="row">{{ wedge.datum.label }}</th>
                            <td>{{ formatValue(wedge.datum.value) }}</td>
                        </tr>
                    </ng-container>
                </tbody>
            </table>
        </div>
    </ng-template>

</div>
