<div class="nx-chart">

    <button type="button" class="nx-chart-table-toggle" (click)="toggleTable()">
        {{ showTable ? 'View as chart' : 'View as table' }}
    </button>

    <ng-container *ngIf="!showTable; else elseBlock1">
        <div class="nx-chart-canvas">
            <svg [attr.viewBox]="viewBox" preserveAspectRatio="xMidYMid meet" role="img">

                <ng-container *ngFor="let tick of yTicks; trackBy: trackByTick">
                    <line
                        class="nx-chart-grid"
                        [attr.x1]="44"
                        [attr.x2]="600 - 16"
                        [attr.y1]="tickY(tick)"
                        [attr.y2]="tickY(tick)">
                    </line>
                    <text class="nx-chart-axis-label" text-anchor="end" [attr.x]="38" [attr.y]="tickY(tick) + 4">
                        {{ formatTick(tick) }}
                    </text>
                </ng-container>

                <ng-container *ngFor="let bar of bars; trackBy: trackByBar">
                    <path
                        class="nx-chart-bar"
                        [class.nx-chart-bar-hovered]="hovered === bar"
                        [attr.d]="bar.path"
                        [attr.fill]="bar.color"
                        tabindex="0"
                        role="img"
                        [attr.aria-label]="categories[bar.categoryIndex] + ', ' + (series[bar.seriesIndex]?.name ?? '') + ': ' + bar.value"
                        (pointerenter)="onBarEnter(bar)"
                        (pointerleave)="onBarLeave()"
                        (focus)="onBarEnter(bar)"
                        (blur)="onBarLeave()">
                    </path>
                </ng-container>

                <ng-container *ngFor="let category of categories; trackBy: trackByCategory; let i = index">
                    <text class="nx-chart-axis-label" text-anchor="middle" [attr.x]="categoryLabelX(i)" [attr.y]="height - 12">
                        {{ category }}
                    </text>
                </ng-container>

            </svg>

            <ng-container *ngIf="hovered">
                <div class="nx-chart-tooltip" [style]="hoveredTooltipStyle">
                    <div class="nx-chart-tooltip-category">{{ categories[hovered.categoryIndex] }}</div>
                    <div class="nx-chart-tooltip-row">
                        <span class="nx-chart-tooltip-key" [style.background]="hovered.color"></span>
                        <span class="nx-chart-tooltip-name">{{ series[hovered.seriesIndex]?.name }}</span>
                        <strong class="nx-chart-tooltip-value">{{ formatTick(hovered.value) }}</strong>
                    </div>
                </div>
            </ng-container>
        </div>

        <ng-container *ngIf="hasLegend">
            <div class="nx-chart-legend">
                <ng-container *ngFor="let s of series; trackBy: trackBySeriesName; let i = index">
                    <div class="nx-chart-legend-item">
                        <span class="nx-chart-legend-swatch" [style.background]="swatchColor(s, i)"></span>
                        {{ s.name }}
                    </div>
                </ng-container>
            </div>
        </ng-container>
    </ng-container>
    <ng-template #elseBlock1>
        <div class="nx-chart-table-wrap">
            <table class="nx-chart-table">
                <thead>
                    <tr>
                        <th></th>
                        <ng-container *ngFor="let s of series; trackBy: trackBySeriesName">
                            <th>{{ s.name }}</th>
                        </ng-container>
                    </tr>
                </thead>
                <tbody>
                    <ng-container *ngFor="let category of categories; trackBy: trackByCategory; let i = index">
                        <tr>
                            <th scope="row">{{ category }}</th>
                            <ng-container *ngFor="let s of series; trackBy: trackBySeriesName">
                                <td>{{ formatTick(s.data[i] ?? 0) }}</td>
                            </ng-container>
                        </tr>
                    </ng-container>
                </tbody>
            </table>
        </div>
    </ng-template>

</div>
