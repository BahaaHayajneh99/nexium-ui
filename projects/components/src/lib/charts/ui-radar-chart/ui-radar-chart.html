<div class="nx-chart">

    <button type="button" class="nx-chart-table-toggle" (click)="toggleTable()">
        {{ showTable ? 'View as chart' : 'View as table' }}
    </button>

    <ng-container *ngIf="!showTable; else elseBlock1">
        <div class="nx-chart-canvas nx-radar-canvas">
            <svg [attr.viewBox]="viewBox" preserveAspectRatio="xMidYMid meet" role="img">

                <ng-container *ngFor="let level of ringLevels; trackBy: trackByLevel">
                    <path class="nx-chart-radar-ring" [attr.d]="ringPath(level)"></path>
                </ng-container>

                <ng-container *ngFor="let category of categories; trackBy: trackByCategory; let i = index">
                    <line
                        class="nx-chart-radar-spoke"
                        x1="150" y1="150"
                        [attr.x2]="spokePoint(i).x"
                        [attr.y2]="spokePoint(i).y">
                    </line>
                    <text
                        class="nx-chart-axis-label"
                        [attr.text-anchor]="labelAnchor(i)"
                        [attr.x]="labelPoint(i).x"
                        [attr.y]="labelPoint(i).y">
                        {{ category }}
                    </text>
                </ng-container>

                <ng-container *ngFor="let s of series; trackBy: trackBySeriesName; let seriesIndex = index">
                    <path
                        class="nx-chart-radar-area"
                        [attr.d]="seriesPath(s)"
                        [attr.fill]="seriesColorAt(s, seriesIndex)"
                        [attr.stroke]="seriesColorAt(s, seriesIndex)">
                    </path>

                    <ng-container *ngFor="let point of points(s, seriesIndex); trackBy: trackByAxisIndex">
                        <circle
                            class="nx-chart-radar-point"
                            [class.nx-chart-radar-point-hovered]="hovered === point"
                            [attr.cx]="point.x"
                            [attr.cy]="point.y"
                            r="3"
                            [attr.fill]="point.color"
                            tabindex="0"
                            role="img"
                            [attr.aria-label]="categories[point.axisIndex] + ', ' + seriesNameAt(seriesIndex) + ': ' + formatValue(point.value)"
                            (pointerenter)="onPointEnter(point)"
                            (pointerleave)="onPointLeave()"
                            (focus)="onPointEnter(point)"
                            (blur)="onPointLeave()">
                        </circle>
                    </ng-container>
                </ng-container>

            </svg>

            <ng-container *ngIf="hovered">
                <div class="nx-chart-tooltip" [style]="tooltipStyle">
                    <div class="nx-chart-tooltip-category">{{ categories[hovered.axisIndex] }}</div>
                    <div class="nx-chart-tooltip-row">
                        <span class="nx-chart-tooltip-key" [style.background]="hovered.color"></span>
                        <span class="nx-chart-tooltip-name">{{ seriesNameAt(hovered.seriesIndex) }}</span>
                        <strong class="nx-chart-tooltip-value">{{ formatValue(hovered.value) }}</strong>
                    </div>
                </div>
            </ng-container>
        </div>

        <ng-container *ngIf="hasLegend">
            <div class="nx-chart-legend">
                <ng-container *ngFor="let s of series; trackBy: trackBySeriesName; let i = index">
                    <div class="nx-chart-legend-item">
                        <span class="nx-chart-legend-swatch" [style.background]="seriesColorAt(s, i)"></span>
                        {{ s.name }}
                    </div>
                </ng-container>
            </div>
        </ng-container>
    </ng-container>
    <ng-template #elseBlock1>
        <div class="nx-chart-table-wrap">
            <table class="nx-chart-table">
                <thead>
                    <tr>
                        <th></th>
                        <ng-container *ngFor="let s of series; trackBy: trackBySeriesName">
                            <th>{{ s.name }}</th>
                        </ng-container>
                    </tr>
                </thead>
                <tbody>
                    <ng-container *ngFor="let category of categories; trackBy: trackByCategory; let i = index">
                        <tr>
                            <th scope="row">{{ category }}</th>
                            <ng-container *ngFor="let s of series; trackBy: trackBySeriesName">
                                <td>{{ formatTick(s.data[i] ?? 0) }}</td>
                            </ng-container>
                        </tr>
                    </ng-container>
                </tbody>
            </table>
        </div>
    </ng-template>

</div>
