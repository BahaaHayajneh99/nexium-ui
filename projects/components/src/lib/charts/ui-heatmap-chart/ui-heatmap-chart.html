<div class="nx-chart">

    <button type="button" class="nx-chart-table-toggle" (click)="toggleTable()">
        {{ showTable ? 'View as chart' : 'View as table' }}
    </button>

    <ng-container *ngIf="!showTable; else elseBlock1">
        <div class="nx-chart-canvas">
            <svg [attr.viewBox]="viewBox" preserveAspectRatio="xMidYMid meet" role="img">

                <ng-container *ngFor="let column of columns; trackBy: trackByColumn; let i = index">
                    <text class="nx-chart-axis-label" text-anchor="middle" [attr.x]="columnLabelX(i)" y="16">
                        {{ column }}
                    </text>
                </ng-container>

                <ng-container *ngFor="let row of rows; trackBy: trackByRow; let i = index">
                    <text class="nx-chart-axis-label" text-anchor="end" x="88" [attr.y]="rowLabelY(i)">
                        {{ row }}
                    </text>
                </ng-container>

                <ng-container *ngFor="let cell of cells; trackBy: trackByCell">
                    <rect
                        class="nx-chart-heatmap-cell"
                        [class.nx-chart-heatmap-cell-hovered]="hovered === cell"
                        [attr.x]="cell.x"
                        [attr.y]="cell.y"
                        [attr.width]="cell.width"
                        [attr.height]="cell.height"
                        [attr.fill]="cell.color"
                        tabindex="0"
                        role="img"
                        [attr.aria-label]="rows[cell.rowIndex] + ', ' + columns[cell.columnIndex] + ': ' + formatValue(cell.value)"
                        (pointerenter)="onCellEnter(cell)"
                        (pointerleave)="onCellLeave()"
                        (focus)="onCellEnter(cell)"
                        (blur)="onCellLeave()">
                    </rect>
                </ng-container>

            </svg>

            <div class="nx-chart-tooltip" *ngIf="hovered" [style]="tooltipStyle">
                <div class="nx-chart-tooltip-category">{{ rows[hovered.rowIndex] }} · {{ columns[hovered.columnIndex] }}</div>
                <div class="nx-chart-tooltip-row">
                    <strong class="nx-chart-tooltip-value">{{ formatValue(hovered.value) }}</strong>
                </div>
            </div>
        </div>

        <div class="nx-chart-heatmap-scale">
            <span>{{ formatValue(minValue) }}</span>
            <span class="nx-chart-heatmap-scale-bar"></span>
            <span>{{ formatValue(maxValue) }}</span>
        </div>
    </ng-container>
    <ng-template #elseBlock1>
        <div class="nx-chart-table-wrap">
            <table class="nx-chart-table">
                <thead>
                    <tr>
                        <th></th>
                        <ng-container *ngFor="let column of columns; trackBy: trackByColumn">
                            <th>{{ column }}</th>
                        </ng-container>
                    </tr>
                </thead>
                <tbody>
                    <ng-container *ngFor="let row of rows; trackBy: trackByRow; let rowIndex = index">
                        <tr>
                            <th scope="row">{{ row }}</th>
                            <ng-container *ngFor="let column of columns; trackBy: trackByColumn; let columnIndex = index">
                                <td>{{ formatValue(data[rowIndex]?.[columnIndex] ?? 0) }}</td>
                            </ng-container>
                        </tr>
                    </ng-container>
                </tbody>
            </table>
        </div>
    </ng-template>

</div>
