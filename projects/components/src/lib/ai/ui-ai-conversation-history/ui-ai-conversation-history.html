<ng-container *ngIf="licensed(); else elseBlock1">
    <div class="nx-ai-conversation-history">
        <button type="button" class="nx-ai-conversation-history-new" (click)="onNewChat()">
            <nx-icon icon="nx-plus" variant="svg" [size]="13"></nx-icon> New chat
        </button>

        <div class="nx-ai-conversation-history-search">
            <nx-icon icon="nx-search" variant="svg" [size]="13"></nx-icon>
            <input
                type="text"
                placeholder="Search conversations"
                [ngModel]="searchTerm()"
                (ngModelChange)="setSearch($event)"
                [ngModelOptions]="{standalone: true}" />
        </div>

        <div class="nx-ai-conversation-history-list">
            <ng-container *ngFor="let group of groups(); trackBy: trackByGroupLabel">
                <div class="nx-ai-conversation-history-group">
                    <div class="nx-ai-conversation-history-group-label">{{ group.label }}</div>

                    <ng-container *ngFor="let conversation of group.conversations; trackBy: trackByConversationId">
                        <div
                            class="nx-ai-conversation-history-row"
                            [class.active]="conversation.id === activeId"
                            (click)="onSelect(conversation)">

                            <input
                                *ngIf="renamingId() === conversation.id; else elseBlock2"
                                type="text"
                                class="nx-ai-conversation-history-rename-input"
                                [ngModel]="renameDraft()"
                                (ngModelChange)="setRenameDraft($event)"
                                [ngModelOptions]="{standalone: true}"
                                (click)="$event.stopPropagation()"
                                (keydown.enter)="commitRename()"
                                (keydown.escape)="cancelRename()"
                                (blur)="commitRename()" />
                            <ng-template #elseBlock2>
                                <span class="nx-ai-conversation-history-title">{{ conversation.title }}</span>

                                <div class="nx-ai-conversation-history-actions">
                                    <button
                                        type="button"
                                        class="nx-ai-conversation-history-action"
                                        aria-label="Rename conversation"
                                        (click)="startRename(conversation, $event)">
                                        <nx-icon icon="nx-edit" variant="svg" [size]="12"></nx-icon>
                                    </button>
                                    <button
                                        type="button"
                                        class="nx-ai-conversation-history-action"
                                        aria-label="Delete conversation"
                                        (click)="onDelete(conversation, $event)">
                                        <nx-icon icon="nx-trash" variant="svg" [size]="12"></nx-icon>
                                    </button>
                                </div>
                            </ng-template>
                        </div>
                    </ng-container>
                </div>
            </ng-container>
            <div class="nx-ai-conversation-history-empty" *ngIf="!groups() || groups().length === 0">No conversations found.</div>
        </div>
    </div>
</ng-container>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="AI Conversation History"></nx-pro-locked>
</ng-template>
