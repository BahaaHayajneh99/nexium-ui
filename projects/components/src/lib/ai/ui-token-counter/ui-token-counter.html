<div class="nx-token-counter">
    <div class="nx-token-count">
        <span class="nx-token-value">{{ estimatedTokens() }}</span>
        <span class="nx-token-label">estimated token{{ estimatedTokens() === 1 ? '' : 's' }}</span>
        @if (limit) {
            <span class="nx-token-limit">/ {{ limit }}</span>
        }
    </div>

    @if (limit) {
        <div class="nx-token-bar-track">
            <div class="nx-token-bar-fill" [class]="'nx-token-bar-' + barState()" [style.width.%]="percent()"></div>
        </div>
    }
</div>
