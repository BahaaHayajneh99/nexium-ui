<ng-container *ngIf="licensed(); else elseBlock1">
    <ng-container *ngIf="open">
        <div class="nx-ai-cmdbar-backdrop" (click)="onBackdropClick()"></div>

        <div class="nx-ai-cmdbar-panel" (click)="$event.stopPropagation()">
            <div class="nx-ai-cmdbar-inputrow">
                <nx-icon icon="nx-star" variant="svg" [size]="18" class="nx-ai-cmdbar-sparkle"></nx-icon>

                <input
                    #inputRef
                    type="text"
                    class="nx-ai-cmdbar-input"
                    [placeholder]="placeholder"
                    [value]="query"
                    (input)="onQueryChange($event)"
                    autofocus />

                <button *ngIf="isLoading; else elseIfBlock2" type="button" class="nx-ai-cmdbar-stop" (click)="onCancel()">
                    <nx-icon icon="nx-x-circle" variant="svg" [size]="14"></nx-icon>
                    Stop
                </button>
                <ng-template #elseIfBlock2>
                    <button *ngIf="query.trim() && mode === 'typing'" type="button" class="nx-ai-cmdbar-send" (click)="trySubmit()" aria-label="Ask">
                        <nx-icon icon="nx-send" variant="svg" [size]="14"></nx-icon>
                    </button>
                </ng-template>
            </div>

            <ng-container *ngIf="activeQuery() as asked; else elseIfBlock3">
                <div class="nx-ai-cmdbar-response" #responseScrollRef>
                    <div class="nx-ai-cmdbar-asked">
                        <nx-icon icon="nx-search" variant="svg" [size]="12"></nx-icon>
                        {{ asked }}
                    </div>

                    <div *ngIf="isLoading && !streamingText; else elseBlock4" class="nx-ai-cmdbar-thinking" aria-label="Thinking">
                        <span class="nx-ai-cmdbar-dot"></span>
                        <span class="nx-ai-cmdbar-dot"></span>
                        <span class="nx-ai-cmdbar-dot"></span>
                    </div>
                    <ng-template #elseBlock4>
                        <div class="nx-ai-cmdbar-answer">{{ streamingText }}<span class="nx-ai-cmdbar-cursor" [class.blink]="isLoading"></span></div>
                    </ng-template>
                </div>
            </ng-container>
            <ng-template #elseIfBlock3>
                <ng-container *ngIf="mode === 'commands'; else elseIfBlock5">
                    <div class="nx-ai-cmdbar-list">
                        <ng-container *ngFor="let command of filteredCommands; trackBy: trackByCommandAction; let i = index">
                            <button
                                type="button"
                                class="nx-ai-cmdbar-item"
                                [class.active]="i === activeIndex"
                                (mouseenter)="activeIndex = i"
                                (click)="selectCommand(command)">
                                <nx-icon *ngIf="command.icon" [icon]="command.icon" variant="svg" [size]="16"></nx-icon>
                                <span>{{ command.label }}</span>
                            </button>
                        </ng-container>
                        <div class="nx-ai-cmdbar-empty" *ngIf="!filteredCommands || filteredCommands.length === 0">No matching commands.</div>
                    </div>
                </ng-container>
                <ng-template #elseIfBlock5>
                    <ng-container *ngIf="mode === 'idle'">
                        <div class="nx-ai-cmdbar-list">
                            <ng-container *ngIf="suggestions.length">
                                <div class="nx-ai-cmdbar-label">Suggestions</div>
                                <ng-container *ngFor="let suggestion of suggestions; trackBy: trackBySuggestion; let i = index">
                                    <button
                                        type="button"
                                        class="nx-ai-cmdbar-item"
                                        [class.active]="isSuggestionActive(i)"
                                        (mouseenter)="activeIndex = i"
                                        (click)="useSuggestion(suggestion)">
                                        <nx-icon icon="nx-star" variant="svg" [size]="14"></nx-icon>
                                        <span>{{ suggestion }}</span>
                                    </button>
                                </ng-container>
                            </ng-container>

                            <ng-container *ngIf="history.length">
                                <div class="nx-ai-cmdbar-label">Recent</div>
                                <ng-container *ngFor="let entry of history; trackBy: trackByHistoryEntry; let i = index">
                                    <button
                                        type="button"
                                        class="nx-ai-cmdbar-item"
                                        [class.active]="isHistoryActive(i)"
                                        (mouseenter)="activeIndex = suggestions.length + i"
                                        (click)="useHistory(entry)">
                                        <nx-icon icon="nx-clock" variant="svg" [size]="14"></nx-icon>
                                        <span>{{ entry }}</span>
                                    </button>
                                </ng-container>
                            </ng-container>

                            <div class="nx-ai-cmdbar-empty" *ngIf="!suggestions.length && !history.length">Type a question, or "/" for commands.</div>
                        </div>
                    </ng-container>
                </ng-template>
            </ng-template>

            <div class="nx-ai-cmdbar-footer">
                <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
                <span><kbd>Enter</kbd> select</span>
                <span><kbd>Esc</kbd> close</span>
            </div>
        </div>
    </ng-container>
</ng-container>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="AI Command Bar"></nx-pro-locked>
</ng-template>
