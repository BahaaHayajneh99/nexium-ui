<div class="nx-prompt-input" *ngIf="licensed(); else elseBlock1">
    <div class="nx-prompt-suggestions" *ngIf="suggestions.length">
        <ng-container *ngFor="let suggestion of suggestions; trackBy: trackBySuggestion">
            <button type="button" class="nx-prompt-chip" (click)="useSuggestion(suggestion)">{{ suggestion }}</button>
        </ng-container>
    </div>

    <div class="nx-prompt-composer">
        <textarea
            #textareaRef
            class="nx-prompt-textarea"
            rows="1"
            [placeholder]="placeholder"
            [style.max-height.px]="maxHeight"
            [value]="value"
            (input)="onInput($event)"
            (keydown)="onKeydown($event)"></textarea>

        <button
            type="button"
            class="nx-prompt-send"
            [disabled]="isOverLimit || !value.trim()"
            (click)="trySubmit()"
            aria-label="Send">
            <nx-icon icon="nx-send" variant="svg" [size]="16"></nx-icon>
        </button>
    </div>

    <div class="nx-prompt-counter" [class.over]="isAtOrOverLimit" *ngIf="maxLength">{{ value.length }}/{{ maxLength }}</div>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Prompt Input"></nx-pro-locked>
</ng-template>
