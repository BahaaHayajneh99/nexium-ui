@if (licensed()) {
    <div class="nx-kanban">
        @for (column of columns; track column.id) {
            <div
                class="nx-kanban-column"
                [class.drag-over]="dragOverColumnId() === column.id"
                (dragover)="onColumnDragOver(column.id, $event)"
                (dragleave)="onColumnDragLeave()"
                (drop)="onColumnDrop(column.id, $event)">
                <div class="nx-kanban-column-header">
                    <span class="nx-kanban-column-title">{{ column.title }}</span>
                    <span class="nx-kanban-column-count">{{ column.cards.length }}</span>
                </div>

                <div class="nx-kanban-column-cards">
                    @for (card of column.cards; track card.id) {
                        <div
                            class="nx-kanban-card"
                            draggable="true"
                            (dragstart)="onCardDragStart(card, column.id, $event)"
                            (dragend)="onCardDragEnd()">
                            <div class="nx-kanban-card-title">{{ card.title }}</div>
                            @if (card.description) {
                                <div class="nx-kanban-card-description">{{ card.description }}</div>
                            }
                        </div>
                    }
                </div>
            </div>
        }
    </div>
} @else {
    <nx-pro-locked componentName="Kanban Board"></nx-pro-locked>
}
