<div class="nx-kanban" *ngIf="licensed(); else elseBlock1">
    <div
        class="nx-kanban-column"
        [class.drag-over]="dragOverColumnId() === column.id"
        (dragover)="onColumnDragOver(column.id, $event)"
        (dragleave)="onColumnDragLeave()"
        (drop)="onColumnDrop(column.id, $event)"
        *ngFor="let column of columns; trackBy: trackByColumnId">
        <div class="nx-kanban-column-header">
            <span class="nx-kanban-column-title">{{ column.title }}</span>
            <span class="nx-kanban-column-count">{{ column.cards.length }}</span>
        </div>

        <div class="nx-kanban-column-cards">
            <div
                class="nx-kanban-card"
                draggable="true"
                (dragstart)="onCardDragStart(card, column.id, $event)"
                (dragend)="onCardDragEnd()"
                *ngFor="let card of column.cards; trackBy: trackByCardId">
                <div class="nx-kanban-card-title">{{ card.title }}</div>
                <div class="nx-kanban-card-description" *ngIf="card.description">{{ card.description }}</div>
                <div class="nx-kanban-card-footer" *ngIf="hasAssigneeSupport()">
                    <div class="nx-kanban-card-assignees">
                        <nx-avatar [name]="assigneeName(id)" size="small" bordered *ngFor="let id of visibleAssignees(card); trackBy: trackByAssigneeId"></nx-avatar>
                        <span class="nx-kanban-card-assignee-more" *ngIf="(card.assignees ?? []).length > 3">+{{ (card.assignees ?? []).length - 3 }}</span>
                    </div>
                    <button
                        type="button"
                        class="nx-kanban-card-assign-btn"
                        (click)="$event.stopPropagation(); cardAssignClicked.emit(card)">
                        {{ card.assignees?.length ? 'Edit' : '+ Assign' }}
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<ng-template #elseBlock1>
    <nx-pro-locked componentName="Kanban Board"></nx-pro-locked>
</ng-template>
