<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" width="100%" height="100%">
  <style>
    .brand-mono { fill: #212529; }
    @media (prefers-color-scheme: dark) {
      .brand-mono { fill: #FFFFFF; }
    }
  </style>

  <!-- FULL BRAND TEXT "NexiumUI" -->
  <text x="0" y="42" font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="42" letter-spacing="-1.5">
    <tspan fill="var(--shell-primary, #3498db)">N</tspan><tspan class="brand-mono">e</tspan><tspan fill="var(--shell-primary, #3498db)">x</tspan><tspan class="brand-mono">iumUI</tspan>
  </text>

  <!-- SEPARATE UI BADGE WITH CLEAR SPACE (MARGIN) TO THE RIGHT -->
  <g transform="translate(202, 12)">
    <!-- Pill Container -->
    <rect x="0" y="0" width="48" height="32" rx="10" fill="var(--shell-primary, #3498db)" />
    
    <!-- UI Text Inside Badge -->
    <text x="24" y="23" font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
      UI
    </text>
  </g>
</svg>
