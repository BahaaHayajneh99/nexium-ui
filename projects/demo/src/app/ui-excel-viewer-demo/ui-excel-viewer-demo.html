<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Multi-Sheet, Read-Only Grid"
                description="{{ commonService.appName }} Excel Viewer - sheet tabs at the bottom (click Headcount), column-letter/row-number headers, and CSV export of the active sheet. Like NxWordViewer, this renders already-parsed sheet data, not a .xlsx binary parser - pair it with SheetJS for that. Need an editable grid with formulas instead? Reach for NxSpreadsheet. This is a PRO component."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">
                <nx-excel-viewer [sheets]="sheets" exportFilename="workbook"></nx-excel-viewer>
            </app-demo-section>

        </div>
    </div>
</div>
