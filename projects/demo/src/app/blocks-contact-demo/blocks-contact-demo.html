<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <section class="main-section">
                <h4 class="main-section-header">Contact</h4>
                <p class="main-section-description">
                    A contact form block - name, email, message.
                </p>
            </section>

            <app-demo-section
                header="Contact form"
                description="A contact form block - name, email, message."
                [code]="code"
                [tsCode]="tsCode"
                [hasSampleClass]="false">

                <div class="template-preview demo-preview">
                    <nx-card class="template-card-wide" variant="elevated">
                        <nx-card-header>
                            <nx-card-title>Get in touch</nx-card-title>
                        </nx-card-header>
                        <nx-card-content>
                            <form class="template-form">
                                <nx-input label="Name" [(value)]="name"></nx-input>
                                <nx-input label="Email" type="email" [(value)]="email"></nx-input>
                                <nx-textarea label="Message" [rows]="4" [(value)]="message"></nx-textarea>
                                <nx-button variant="primary">Send Message</nx-button>
                            </form>
                        </nx-card-content>
                    </nx-card>
                </div>

            </app-demo-section>

        </div>
    </div>
</div>
