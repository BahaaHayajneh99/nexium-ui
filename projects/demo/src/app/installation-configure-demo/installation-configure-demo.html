<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Configure"
                description="Step 3 of 7. {{ commonService.appName }} ships a pre-compiled stylesheet with every component's styles and design tokens. Register it in your app's global styles through angular.json&hellip;"
                [code]="angularJsonCode"
                [codeLang]="'ts'"
                [hasSampleClass]="false">
            </app-demo-section>

            <app-demo-section
                header="&hellip;or Import It Directly"
                description="Alternatively, import the stylesheet directly into your own global stylesheet."
                [code]="globalImportCode"
                [codeLang]="'ts'"
                [hasSampleClass]="false">
            </app-demo-section>

        </div>
    </div>
</div>
