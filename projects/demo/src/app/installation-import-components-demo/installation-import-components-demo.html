<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import Components"
                description="Step 4 of 7. Every component is standalone &mdash; import each class directly and add it to your own component's imports array. No NgModule or app-wide provider setup is required."
                [code]="usageCode"
                [codeLang]="'ts'"
                [hasSampleClass]="false">
            </app-demo-section>

            <app-demo-section
                header="Or Use NexiumUiModule"
                description="If your app still assembles feature modules the @NgModule way, import NexiumUiModule once instead to get every component and directive available in that module's templates."
                [code]="moduleCode"
                [codeLang]="'ts'"
                [hasSampleClass]="false">
            </app-demo-section>

        </div>
    </div>
</div>
