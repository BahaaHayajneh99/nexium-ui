<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Basic Key-Value List"
                description="A label/value definition list for order summaries, profile details, or any other set of facts."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">
                <nx-key-value-list [items]="orderDetails"></nx-key-value-list>
            </app-demo-section>

            <app-demo-section
                header="Stacked"
                description="Set layout to stacked to put the value on its own line below the key - useful for longer values."
                [code]="stackedCode"
                [hasSampleClass]="false">
                <nx-key-value-list [items]="orderDetails" layout="stacked"></nx-key-value-list>
            </app-demo-section>

        </div>
    </div>
</div>
