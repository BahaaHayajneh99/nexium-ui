<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Verify Installation"
                description="Step 7 of 7. Drop this into any standalone component and confirm it renders styled - if the button below looks like a real button (not plain text), you're set up correctly."
                [code]="smokeTestCode"
                [codeLang]="'ts'">

                <nx-button variant="primary">It works</nx-button>
                <nx-badge variant="success" class="ml-3">Installed</nx-badge>

            </app-demo-section>

            <section class="main-section">
                <h4 class="main-section-header">Checklist</h4>
                <ul class="main-section-description">
                    @for (item of checklist; track item) {
                        <li>{{ item }}</li>
                    }
                </ul>
            </section>

        </div>
    </div>
</div>
