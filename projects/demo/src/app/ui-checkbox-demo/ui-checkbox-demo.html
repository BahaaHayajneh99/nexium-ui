<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Reactive Form"
                description="The {{ commonService.appName }} Checkbox implements ControlValueAccessor, so it can be bound with formControlName inside a FormGroup."
                [code]="reactiveCode"
                [tsCode]="reactiveTs"
                [hasSampleClass]="false">
                <div [formGroup]="agreedForm">
                    <nx-checkbox label="I agree to the terms and conditions" formControlName="agreed"></nx-checkbox>
                </div>
            </app-demo-section>

            <app-demo-section
                header="Template-Driven Form"
                description="The same checkbox also works with plain [(ngModel)] binding, using Angular's standard forms integration."
                [code]="templateCode"
                [tsCode]="templateTs"
                [hasSampleClass]="false">
                <nx-checkbox label="I agree to the terms and conditions" [(ngModel)]="agreed"></nx-checkbox>
            </app-demo-section>

            <app-demo-section
                header="Dynamic"
                description="Render checkboxes from an array and control whether items lay out inline or block."
                [code]="dynamicCode"
                [tsCode]="dynamicTs"
                [hasSampleClass]="false">
                <div class="nx-checkbox-layout-controls">
                    <button type="button" class="demo-btn" [class.active]="dynamicLayout === 'inline'" (click)="setDynamicLayout('inline')">Inline</button>
                    <button type="button" class="demo-btn" [class.active]="dynamicLayout === 'block'" (click)="setDynamicLayout('block')">Block</button>
                </div>
                <div class="nx-checkbox-list" [class.nx-checkbox-list-inline]="dynamicLayout === 'inline'">
                    @for (category of categories; track category.key) {
                        <nx-checkbox
                            [label]="category.label"
                            [checked]="selectedCategories.includes(category.key)"
                            (checkedChange)="toggleCategory(category.key)">
                        </nx-checkbox>
                    }
                </div>
            </app-demo-section>

            <app-demo-section
                header="Filled"
                description="Specify the variant property as filled to display the checkbox with a higher visual emphasis than the default outlined style."
                [code]="filledCode"
                [hasSampleClass]="false">
                <nx-checkbox label="Filled checkbox" variant="filled" [(ngModel)]="agreed"></nx-checkbox>
            </app-demo-section>

            <app-demo-section
                header="Disabled"
                description="Disabled checkboxes cannot be toggled."
                [code]="disabledCode"
                [hasSampleClass]="false">
                <nx-checkbox label="Disabled option" [disabled]="true"></nx-checkbox>
            </app-demo-section>

            <app-demo-section
                header="Invalid"
                description="Set invalid to true to highlight the checkbox with an error state."
                [code]="invalidCode"
                [hasSampleClass]="false">
                <nx-checkbox label="This field is required" [invalid]="true"></nx-checkbox>
            </app-demo-section>

        </div>
    </div>
</div>
