<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Reactive Form"
                description="Bind the rating to a reactive form control with formControlName."
                [code]="reactiveCode"
                [tsCode]="reactiveTs"
                [hasSampleClass]="false">
                <div [formGroup]="ratingForm">
                    <nx-rating formControlName="rating"></nx-rating>
                </div>
            </app-demo-section>

            <app-demo-section
                header="Template-Driven Form"
                description="Bind the rating to a plain component property with [(ngModel)]."
                [code]="templateCode"
                [tsCode]="templateTs"
                [hasSampleClass]="false">
                <nx-rating [(ngModel)]="rating"></nx-rating>
            </app-demo-section>

            <app-demo-section
                header="Read-only"
                description="Set readonly to true to display a rating without allowing interaction."
                [code]="readonlyCode"
                [hasSampleClass]="false">
                <nx-rating [value]="4" [readonly]="true"></nx-rating>
            </app-demo-section>

            <app-demo-section
                header="Custom Max"
                description="Set max for a scale other than 5 stars."
                [code]="maxCode"
                [hasSampleClass]="false">
                <nx-rating [(ngModel)]="rating" [max]="10"></nx-rating>
            </app-demo-section>

        </div>
    </div>
</div>
