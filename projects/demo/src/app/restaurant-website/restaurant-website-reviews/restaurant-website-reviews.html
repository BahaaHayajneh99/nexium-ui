<div class="resto-container resto-section">
    @if (licensed()) {
        <ng-container *ngTemplateOutlet="pageContent"></ng-container>
    } @else {
        <div class="resto-locked-wrapper">
            <div class="resto-locked-content">
                <ng-container *ngTemplateOutlet="pageContent"></ng-container>
            </div>
            <div class="resto-lock-overlay">
                <nx-icon icon="nx-lock" variant="svg" [size]="32"></nx-icon>
                <p>Unlock the full Restaurant Website template for $45</p>
                <nx-button variant="primary" [routerLink]="'/pro-upgrade'">Get a PRO license</nx-button>
            </div>
        </div>
    }
</div>

<ng-template #pageContent>

    <div class="resto-breadcrumb-row">
        <nx-breadcrumb [items]="breadcrumbItems"></nx-breadcrumb>
    </div>

    <div class="rreviews-hero">
        <h1>What our guests are saying</h1>
        <p class="resto-muted">Real feedback from the people who keep coming back.</p>
    </div>

    <div class="rreviews-summary-row">
        <nx-statistic label="Average rating" [value]="averageRating()" suffix=" / 5"></nx-statistic>
        <nx-statistic label="Total reviews" [value]="reviewCount()"></nx-statistic>
    </div>

    <div class="rreviews-grid">
        @for (review of reviews; track review.name) {
            <div class="rreviews-card">
                <div class="rreviews-card-header">
                    <img class="resto-avatar-photo" [src]="review.avatar" [alt]="review.name">
                    <div>
                        <div class="rreviews-card-name">{{ review.name }}</div>
                        <nx-rating [value]="review.rating" [readonly]="true"></nx-rating>
                    </div>
                </div>
                <p class="rreviews-card-quote">&ldquo;{{ review.quote }}&rdquo;</p>
            </div>
        }
    </div>

</ng-template>
