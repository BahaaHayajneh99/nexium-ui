<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <section class="main-section">
                <h4 class="main-section-header">Pie Chart</h4>
                <p class="main-section-description">
                    Part-to-whole for a handful of categories. Hover or focus a slice for its value and
                    share of the total; set <code>innerRadius</code> for a donut with a centered total.
                </p>
            </section>

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Pie"
                description="Every slice is direct-labeled in the legend below, never by color alone."
                [code]="pieCode"
                [tsCode]="tsCode"
                [hasSampleClass]="false">

                <nx-pie-chart [data]="browserShare"></nx-pie-chart>

            </app-demo-section>

            <app-demo-section
                header="Donut"
                description="innerRadius opens up the center for a total - useful when the whole matters as much as its parts."
                [code]="donutCode"
                [tsCode]="tsCode"
                [hasSampleClass]="false">

                <nx-pie-chart [data]="browserShare" [innerRadius]="0.65"></nx-pie-chart>

            </app-demo-section>

        </div>
    </div>
</div>
