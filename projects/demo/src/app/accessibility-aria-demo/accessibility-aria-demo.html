<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <section class="main-section">
                <h4 class="main-section-header">ARIA</h4>
                <div class="gs-code">
                    <pre>{{ ruleOfThumb }}</pre>
                </div>
            </section>

            <section class="main-section">
                <h4 class="main-section-header">Roles &amp; Attributes in Use</h4>
                <div class="utility-list">
                    @for (p of patterns; track p.component) {
                        <div class="utility-row">
                            <code class="utility-class">{{ p.component }}</code>
                            <span class="utility-desc">{{ p.pattern }}</span>
                        </div>
                    }
                </div>
            </section>

        </div>
    </div>
</div>
