<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <section class="main-section">
                <h4 class="main-section-header">Chat / Messaging UI</h4>
                <p class="main-section-description">
                    A simple two-way conversation view built from <code>nx-avatar</code> and <code>nx-input</code>.
                </p>
            </section>

            <app-demo-section
                header="Conversation"
                description="Messages are appended to an array; own messages are right-aligned via a class binding."
                [code]="code"
                [tsCode]="tsCode"
                [hasSampleClass]="false">

                <div class="template-form" style="max-width: 420px;">
                    <div class="chat-log">
                        @for (message of messages; track $index) {
                            <div class="chat-row" [class.chat-row-me]="message.from === 'me'">
                                <nx-avatar [name]="message.author" size="small"></nx-avatar>
                                <div class="chat-bubble">{{ message.text }}</div>
                            </div>
                        }
                    </div>

                    <div class="template-form-row">
                        <nx-input placeholder="Type a message..." [(ngModel)]="draft" (keyup.enter)="send()"
                            style="flex: 1;"></nx-input>
                        <nx-button variant="primary" (click)="send()">Send</nx-button>
                    </div>
                </div>

            </app-demo-section>

        </div>
    </div>
</div>
