<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="File Input"
                description="{{ commonService.appName }} File Input - requires PDF or image attachments, up to 2MB each and 3 files total. Try attaching an oversized file, a non-PDF/image file, or more than 3 files to see the inline rejection reasons, or attach valid files to see them listed with their size and a remove button. Currently valid: {{ isValid() }} - {{ selectedFiles().length }} file(s) attached. This is a PRO component."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">
                <nx-file-input
                    label="Attachments"
                    accept="application/pdf,image/*"
                    [multiple]="true"
                    [maxSizeMb]="2"
                    [maxFiles]="3"
                    [isRequired]="true"
                    (filesChange)="onFilesChange($event)"
                    (validChange)="onValidChange($event)">
                </nx-file-input>
            </app-demo-section>

        </div>
    </div>
</div>
