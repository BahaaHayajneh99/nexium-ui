<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Basic Modal"
                description="The {{ commonService.appName }} Modal displays content in a dialog overlay above the page."
                [code]="basicCode"
                [tsCode]="basicTs">
                <button class="demo-btn" (click)="basicOpen = true">Open Modal</button>

                <nx-modal [(open)]="basicOpen" header="Modal Title">
                    This is the modal body content.
                </nx-modal>
            </app-demo-section>

            <app-demo-section
                header="Modal with Footer Actions"
                description="Project footer buttons using the nx-modal-footer attribute selector."
                [code]="footerCode"
                [tsCode]="footerTs">
                <button class="demo-btn" (click)="footerOpen = true">Delete Item</button>

                <nx-modal [(open)]="footerOpen" header="Confirm Action">
                    <ng-container nx-modal-body>
                        Are you sure you want to delete this item? This action cannot be undone. 
                    </ng-container>
                    <ng-container nx-modal-footer>
                        <button class="demo-btn" (click)="footerOpen = false">Cancel</button>
                        <button class="demo-btn" (click)="footerOpen = false">Confirm</button>
                    </ng-container>
                </nx-modal>
            </app-demo-section>

        </div>
    </div>
</div>
