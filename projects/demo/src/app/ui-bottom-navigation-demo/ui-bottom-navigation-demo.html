<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Bottom Navigation"
                description="A mobile-style tab bar - icon + label items with an active state, typically fixed to the bottom of the viewport."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">
                <div style="max-width: 360px;">
                    <nx-bottom-navigation [items]="items" [(active)]="active"></nx-bottom-navigation>
                </div>
            </app-demo-section>

        </div>
    </div>
</div>
