<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <section class="main-section">
                <h4 class="main-section-header">Changelog</h4>
                <p class="main-section-description">
                    Notable changes to {{ commonService.appName }} are tracked here, most recent first.
                </p>
            </section>

            @for (entry of entries; track entry.version) {
                <section class="main-section">
                    <h4 class="main-section-header">{{ entry.version }} <small>&mdash; {{ entry.date }}</small></h4>
                    <ul class="main-section-description">
                        @for (change of entry.changes; track change) {
                            <li>{{ change }}</li>
                        }
                    </ul>
                </section>
            }

        </div>
    </div>
</div>
