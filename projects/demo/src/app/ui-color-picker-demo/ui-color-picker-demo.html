<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Reactive Form"
                description="Bind the color picker to a FormGroup with formControlName - it fully implements Angular's ControlValueAccessor."
                [code]="reactiveCode"
                [tsCode]="reactiveTs"
                [hasSampleClass]="false">
                <div [formGroup]="brandColorForm">
                    <nx-color-picker label="Brand color" formControlName="brandColor"></nx-color-picker>
                </div>
            </app-demo-section>

            <app-demo-section
                header="Template-Driven Form"
                description="Bind the color picker with a plain [(ngModel)] for simple template-driven forms."
                [code]="templateCode"
                [tsCode]="templateTs"
                [hasSampleClass]="false">
                <nx-color-picker label="Brand color" [(ngModel)]="brandColor"></nx-color-picker>
            </app-demo-section>

            <app-demo-section
                header="Custom Presets"
                description="Pass your own preset swatches - useful for constraining choices to a brand or chart palette."
                [code]="customPresetsCode"
                [tsCode]="customPresetsTs"
                [hasSampleClass]="false">
                <nx-color-picker label="Chart series color" [presets]="customPresets" [(ngModel)]="customPresetColor"></nx-color-picker>
            </app-demo-section>

            <app-demo-section
                header="Invalid"
                description="Set invalid to true to highlight the field with an error state."
                [code]="invalidCode"
                [hasSampleClass]="false">
                <nx-color-picker label="Required color" [invalid]="true" [(ngModel)]="invalidColor"></nx-color-picker>
            </app-demo-section>

            <app-demo-section
                header="Disabled"
                description="Disabled color pickers cannot be interacted with."
                [code]="disabledCode"
                [hasSampleClass]="false">
                <nx-color-picker label="Disabled color" [disabled]="true" value="#adb5bd"></nx-color-picker>
            </app-demo-section>

        </div>
    </div>
</div>
