<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Theme Setup"
                description="Step 5 of 7 - optional. {{ commonService.appName }} looks good with its defaults; override the CSS custom properties before anything else if you want your own brand colors."
                [code]="overrideCode"
                [codeLang]="'ts'"
                [hasSampleClass]="false">
            </app-demo-section>

            <app-demo-section
                header="Dark Mode"
                description="Dark mode is a runtime attribute, not a separate build - no theme provider needed."
                [code]="darkModeCode"
                [codeLang]="'ts'"
                [hasSampleClass]="false">
            </app-demo-section>

        </div>
    </div>
</div>
