<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Design Tokens"
                description="Every component reads its colors from a shared set of CSS custom properties, exposed once you've included the library's stylesheet - restyling the whole library means overriding a property in one place."
                [code]="tokensCode"
                [codeLang]="'ts'"
                [hasSampleClass]="false">
            </app-demo-section>

            <app-demo-section
                header="Using Tokens In Your Own Styles"
                description="Reuse the same custom properties in your own styles so custom UI stays visually consistent with {{ commonService.appName }}."
                [code]="usageCode"
                [codeLang]="'ts'"
                [hasSampleClass]="false">
            </app-demo-section>

            <app-demo-section
                header="Re-theming"
                description="Since every component reads from the same custom properties, overriding one in your own :root - after importing the library's stylesheet - re-themes every component that relies on it."
                [code]="overrideCode"
                [codeLang]="'ts'"
                [hasSampleClass]="false">
            </app-demo-section>

        </div>
    </div>
</div>
