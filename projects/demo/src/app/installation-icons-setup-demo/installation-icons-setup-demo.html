<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Icons Setup"
                description="Step 6 of 7 - there's nothing to set up. Icons come from nx-icon, part of the same nexium-ui package."
                [code]="usageCode">

                <nx-icon icon="nx-check-circle" variant="svg" [size]="18"></nx-icon>

            </app-demo-section>

            <app-demo-section
                header="No Icon Font or Extra Package"
                description="Browse every available name on the Icons page."
                [code]="noSetupCode"
                [codeLang]="'ts'"
                [hasSampleClass]="false">
            </app-demo-section>

        </div>
    </div>
</div>
