<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <section class="main-section">
                <h4 class="main-section-header">Icons Setup</h4>
                <p class="main-section-description">
                    Step 6 of 7 - there's nothing to set up. Icons come from <code>nx-icon</code>, part
                    of <code>@nexium/components</code>.
                </p>
                <div class="gs-code">
                    <pre>{{ usageCode }}</pre>
                </div>
                <div class="mt-2">
                    <nx-icon icon="nx-check-circle" variant="svg" [size]="18"></nx-icon>
                </div>
            </section>

            <section class="main-section">
                <h4 class="main-section-header">No Icon Font or Extra Package</h4>
                <div class="gs-code">
                    <pre>{{ noSetupCode }}</pre>
                </div>
                <p class="main-section-description">
                    Browse every available name on the <code>Icons</code> page.
                </p>
            </section>

        </div>
    </div>
</div>
