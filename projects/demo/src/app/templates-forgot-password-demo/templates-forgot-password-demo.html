<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Forgot Password"
                description="A single-field recovery form - the pattern every &quot;forgot password&quot; screen boils down to once you strip the branding."
                [code]="previewCode"
                [hasSampleClass]="false">

                <div class="template-preview">
                    <nx-card class="template-card" variant="elevated">
                        <nx-card-header>
                            <nx-card-title>Reset your password</nx-card-title>
                            <nx-card-subtitle>We'll email you a link to get back in</nx-card-subtitle>
                        </nx-card-header>

                        <nx-card-content>
                            <form class="template-form" (submit)="onSubmit()">
                                <nx-input label="Email" type="email" placeholder="you@company.com" [(value)]="email"></nx-input>

                                <nx-button variant="primary" [fullWidth]="true">Send Reset Link</nx-button>

                                @if (sent) {
                                    <p class="template-form-note">
                                        Preview only - no email was sent to {{ email || 'you@company.com' }}.
                                    </p>
                                }
                            </form>
                        </nx-card-content>
                    </nx-card>

                    <p class="template-footnote">
                        Remembered it after all?
                        <a class="template-link" routerLink="/templates/login">Back to sign in</a>
                    </p>
                </div>

            </app-demo-section>

        </div>
    </div>
</div>
