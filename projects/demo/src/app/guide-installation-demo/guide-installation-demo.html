<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Installation"
                description="In an existing Angular application, install {{ commonService.appName }} from npm."
                [code]="installCode"
                [codeLang]="'ts'"
                [hasSampleClass]="false">
            </app-demo-section>

            <app-demo-section
                header="Usage"
                description="Every component is standalone, so import it directly into your own component's imports array - no NgModule or app-wide provider setup is required."
                [code]="usageCode"
                [codeLang]="'ts'"
                [hasSampleClass]="false">
            </app-demo-section>

        </div>
    </div>
</div>
