<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Image Upload"
                description="Restrict the accepted files to images and preview the selected image using nx-preview."
                [code]="basicCode"
                [tsCode]="basicTs">
                <nx-file-upload accept="image/*" label="Drop an image here or click to browse" (filesSelected)="onFilesSelected($event)"></nx-file-upload>

                @if (previewSrc) {
                    <nx-preview [src]="previewSrc" [fileName]="fileName" type="image"></nx-preview>
                }
            </app-demo-section>

            <app-demo-section
                header="Multiple Images"
                description="Set multiple to select several images at once - each one gets its own thumbnail preview."
                [code]="multipleCode"
                [tsCode]="multipleTs">
                <nx-file-upload accept="image/*" label="Drop images here or click to browse" multiple (filesSelected)="onMultipleFilesSelected($event)"></nx-file-upload>

                @if (previewSrcs.length) {
                    <div class="image-preview-grid">
                        @for (src of previewSrcs; track src) {
                            <nx-preview [src]="src" type="image"></nx-preview>
                        }
                    </div>
                }
            </app-demo-section>

            <app-demo-section
                header="Click to Browse Only"
                description="Set draggable to false to disable drag-and-drop entirely - the zone only responds to a click, opening the native file picker. Useful when the surrounding page already handles drag-and-drop for something else."
                [code]="noDragCode">
                <nx-file-upload
                    accept="image/*"
                    label="Click to browse - drag & drop is disabled"
                    [draggable]="false"
                    multiple>
                </nx-file-upload>
            </app-demo-section>

        </div>
    </div>
</div>
