<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Image Upload"
                description="Restrict the accepted files to images and preview the selected image using nx-preview."
                [code]="basicCode"
                [tsCode]="basicTs">
                <nx-file-upload accept="image/*" label="Drop an image here or click to browse" (filesSelected)="onFilesSelected($event)"></nx-file-upload>

                @if (previewSrc) {
                    <nx-preview [src]="previewSrc" [fileName]="fileName" type="image"></nx-preview>
                }
            </app-demo-section>

        </div>
    </div>
</div>
