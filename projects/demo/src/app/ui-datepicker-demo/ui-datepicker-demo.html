<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Reactive Form"
                description="Single-date mode implements ControlValueAccessor, so it works with formControlName inside a FormGroup."
                [code]="reactiveCode"
                [tsCode]="reactiveTs"
                [hasSampleClass]="false">
                <div [formGroup]="birthDateForm">
                    <nx-datepicker label="Date of birth" formControlName="birthDate"></nx-datepicker>
                </div>
            </app-demo-section>

            <app-demo-section
                header="Template-Driven Form"
                description="Bind directly with ngModel for template-driven forms - no wrapping form element required."
                [code]="templateCode"
                [tsCode]="templateTs"
                [hasSampleClass]="false">
                <nx-datepicker label="Date of birth" [(ngModel)]="birthDate"></nx-datepicker>
            </app-demo-section>

            <app-demo-section
                header="No Icon"
                description="showIcon defaults to true; set it to false to hide the calendar icon in the field."
                [code]="iconCode"
                [hasSampleClass]="false">
                <nx-datepicker label="Appointment date" [showIcon]="false" [(ngModel)]="iconDate"></nx-datepicker>
            </app-demo-section>

            <app-demo-section
                header="Min / Max"
                description="Restrict the selectable range with the min and max properties."
                [code]="minMaxCode"
                [hasSampleClass]="false">
                <nx-datepicker
                    label="Booking date"
                    min="2026-01-01"
                    max="2026-12-31"
                    [(ngModel)]="minMaxDate">
                </nx-datepicker>
            </app-demo-section>

            <app-demo-section
                header="Range"
                description="Set range to true - the field shows both dates, and the calendar highlights the span between the first and second click."
                [code]="rangeCode"
                [hasSampleClass]="false">
                <nx-datepicker
                    label="Stay duration"
                    [range]="true"
                    [(value)]="rangeStart"
                    [(endValue)]="rangeEnd">
                </nx-datepicker>
            </app-demo-section>

            <app-demo-section
                header="Time"
                description="Set showTime to true to include a time selector alongside the date."
                [code]="timeCode"
                [hasSampleClass]="false">
                <nx-datepicker label="Meeting time" [showTime]="true" [(ngModel)]="meetingTime"></nx-datepicker>
            </app-demo-section>

            <app-demo-section
                header="Invalid"
                description="Set invalid to true to highlight the field with an error state."
                [code]="invalidCode"
                [hasSampleClass]="false">
                <nx-datepicker label="Required date" [invalid]="true"></nx-datepicker>
            </app-demo-section>

            <app-demo-section
                header="Disabled"
                description="Disabled date pickers cannot be interacted with."
                [code]="disabledCode"
                [hasSampleClass]="false">
                <nx-datepicker label="Disabled date" [disabled]="true"></nx-datepicker>
            </app-demo-section>

        </div>
    </div>
</div>
