<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="4-step import wizard"
                description="{{ commonService.appName }}'s Data Import Wizard walks through Upload -> Map columns -> Review -> Done. This library has no CSV/Excel parser, so parseFile is supplied by the consumer - this demo simulates parsing with fake sample data after a short delay. This is a PRO component."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">
                <div style="max-width:720px;">
                    <nx-data-import-wizard
                        [targetFields]="targetFields"
                        [parseFile]="parseFile"
                        (importConfirmed)="onImportConfirmed($event)"
                        (cancelled)="onCancelled()">
                    </nx-data-import-wizard>
                    @if (lastImport) {
                        <p style="margin-top:12px; color:var(--shell-text-secondary); font-size:0.85rem;">
                            {{ lastImport }}
                        </p>
                    }
                </div>
            </app-demo-section>

        </div>
    </div>
</div>
