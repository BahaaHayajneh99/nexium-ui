<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Environment Switcher"
                description="The {{ commonService.appName }} Environment Switcher is a segmented control for toggling between environments (dev/staging/prod), each with its own colored indicator."
                [code]="basicCode"
                [tsCode]="basicTs">
                <nx-environment-switcher
                    [environments]="environments"
                    [activeId]="activeId()"
                    (activeIdChange)="onActiveIdChange($event)">
                </nx-environment-switcher>
            </app-demo-section>

            <app-demo-section
                header="Reacting to Selection"
                description="activeIdChange emits the selected environment id, so the parent can react - for example, showing which environment is currently active."
                [code]="selectedCode"
                [tsCode]="selectedTs"
                [hasSampleClass]="false">
                <p style="margin:0;">Currently viewing: <strong>{{ selectedLabel() }}</strong></p>
            </app-demo-section>

        </div>
    </div>
</div>
