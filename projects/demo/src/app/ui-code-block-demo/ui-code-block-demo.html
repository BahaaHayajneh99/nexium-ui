<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Basic Code Block"
                description="The {{ commonService.appName }} Code Block is a monospace box with a language label and a copy button - plain formatting only, bring your own syntax highlighter for coloring."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">
                <div style="max-width:520px;">
                    <nx-code-block language="ts" [code]="snippet"></nx-code-block>
                </div>
            </app-demo-section>

            <app-demo-section
                header="With Line Numbers"
                description="Set showLineNumbers to true to prefix each line with a padded line number."
                [code]="lineNumbersCode"
                [tsCode]="lineNumbersTs"
                [hasSampleClass]="false">
                <div style="max-width:520px;">
                    <nx-code-block language="bash" [showLineNumbers]="true" [code]="installSteps"></nx-code-block>
                </div>
            </app-demo-section>

        </div>
    </div>
</div>
