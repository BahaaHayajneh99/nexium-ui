<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Description List"
                description="{{ commonService.appName }} Description List renders a semantic term/definition property grid from a plain array - no markup to hand-write per row."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">
                <div style="max-width:420px;">
                    <nx-description-list [items]="productDetails"></nx-description-list>
                </div>
            </app-demo-section>

            <app-demo-section
                header="Multi-Column with Spanning Rows"
                description="Set columns to wrap items into a grid, and give any item a span to stretch its row across multiple columns - handy for a trailing note under a block of short fields."
                [code]="columnsCode"
                [tsCode]="columnsTs"
                [hasSampleClass]="false">
                <div style="max-width:560px;">
                    <nx-description-list [items]="specDetails" [columns]="2"></nx-description-list>
                </div>
            </app-demo-section>

        </div>
    </div>
</div>
