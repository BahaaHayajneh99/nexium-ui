<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <section class="main-section">
                <h4 class="main-section-header">Funnel Chart</h4>
                <p class="main-section-description">
                    Sequential stages that narrow as a value drops off - every stage is direct-labeled
                    with its value and share of the first stage, so no legend is needed. Hover or focus a
                    stage to highlight it, or switch to the accessible table view.
                </p>
            </section>

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Signup funnel"
                description="stages is a plain array in drop-off order - each one tapers into the next."
                [code]="code"
                [tsCode]="tsCode"
                [hasSampleClass]="false">

                <nx-funnel-chart [stages]="signupFunnel"></nx-funnel-chart>

            </app-demo-section>

        </div>
    </div>
</div>
