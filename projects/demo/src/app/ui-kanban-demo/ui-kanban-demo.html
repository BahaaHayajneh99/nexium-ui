<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Board with columns"
                description="Drag a card from one column to another. {{ commonService.appName }}'s Kanban moves cards via native HTML5 drag and drop and emits cardMoved with the card and its source/destination column ids."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">
                <div style="max-width:820px;">
                    <nx-kanban [(columns)]="columns" (cardMoved)="onCardMoved($event)"></nx-kanban>
                    @if (lastMove) {
                        <p style="margin-top:12px; color:var(--shell-text-secondary); font-size:0.85rem;">
                            Last move: {{ lastMove }}
                        </p>
                    }
                </div>
            </app-demo-section>

        </div>
    </div>
</div>
