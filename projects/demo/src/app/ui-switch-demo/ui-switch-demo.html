<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Reactive Form"
                description="Bind the {{ commonService.appName }} Switch to a FormGroup using formControlName."
                [code]="reactiveCode"
                [tsCode]="reactiveTs"
                [hasSampleClass]="false">
                <div [formGroup]="notificationsForm">
                    <nx-switch label="Enable notifications" formControlName="notifications"></nx-switch>
                </div>
            </app-demo-section>

            <app-demo-section
                header="Template-Driven Form"
                description="Bind the {{ commonService.appName }} Switch with [(ngModel)] for simple template-driven forms."
                [code]="templateCode"
                [tsCode]="templateTs"
                [hasSampleClass]="false">
                <nx-switch label="Enable notifications" [(ngModel)]="notifications"></nx-switch>
            </app-demo-section>

            <app-demo-section
                header="Disabled Switch"
                description="Disabled switches cannot be toggled."
                [code]="disabledCode"
                [hasSampleClass]="false">
                <nx-switch label="Disabled switch" [disabled]="true"></nx-switch>
            </app-demo-section>

        </div>
    </div>
</div>
