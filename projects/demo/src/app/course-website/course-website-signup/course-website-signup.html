<div class="course-auth-page">
  @if (licensed()) {
    <ng-container *ngTemplateOutlet="pageContent"></ng-container>
  } @else {
    <div class="course-locked-wrapper course-auth-locked">
      <div class="course-locked-content">
        <ng-container *ngTemplateOutlet="pageContent"></ng-container>
      </div>
      <div class="course-lock-overlay">
        <nx-icon icon="nx-lock" variant="svg" [size]="32"></nx-icon>
        <p>Unlock the full Course Website template for $55</p>
        <nx-button variant="primary" [routerLink]="'/pro-upgrade'">Get a PRO license</nx-button>
      </div>
    </div>
  }
</div>

<ng-template #pageContent>
  <div class="course-auth-layout">
    <div class="course-auth-marketing">
      <div class="course-auth-brand">
        <nx-icon icon="nx-book" variant="svg" [size]="20"></nx-icon>
        Pathwise Academy
      </div>

      <div class="course-auth-perks">
        <h2>Join 50,000+ learners</h2>
        <ul>
          @for (perk of perks; track perk.text) {
            <li>
              <nx-icon [icon]="perk.icon" variant="svg" [size]="18"></nx-icon>
              <span>{{ perk.text }}</span>
            </li>
          }
        </ul>
      </div>
    </div>

    <div class="course-auth-form-panel">
      <div class="course-auth-form">
        <h1>Create your account</h1>

        <div class="course-auth-fields">
          <div class="course-auth-name-row">
            <nx-input label="First name" placeholder="Jane" [isRequired]="true"></nx-input>
            <nx-input label="Last name" placeholder="Doe" [isRequired]="true"></nx-input>
          </div>
          <nx-input label="Email" type="email" placeholder="you@example.com" [isRequired]="true"></nx-input>
          <nx-input label="Password" type="password" placeholder="••••••••" [isRequired]="true"></nx-input>
          <nx-input label="Confirm password" type="password" placeholder="••••••••" [isRequired]="true"></nx-input>

          <nx-checkbox
            label="I agree to the Terms of Service and Privacy Policy"
            [checked]="agreedToTerms()"
            (checkedChange)="agreedToTerms.set($event)"></nx-checkbox>

          <nx-button variant="primary" [fullWidth]="true">Create account</nx-button>

          <nx-divider label="or continue with"></nx-divider>

          <div class="course-auth-social-row">
            <nx-button variant="outline" [fullWidth]="true">
              <nx-icon icon="nx-user" variant="svg" [size]="16"></nx-icon>
              Google
            </nx-button>
            <nx-button variant="outline" [fullWidth]="true">
              <nx-icon icon="nx-user" variant="svg" [size]="16"></nx-icon>
              Apple
            </nx-button>
          </div>

          <p class="course-auth-footer-line">
            Already have an account? <a [routerLink]="'/course-website/login'">Log in</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</ng-template>
