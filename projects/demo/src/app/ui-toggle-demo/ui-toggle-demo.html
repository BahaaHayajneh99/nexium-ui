<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Basic Toggle"
                description="The {{ commonService.appName }} Toggle is a two-state button, useful for formatting toolbars."
                [code]="basicCode"
                [tsCode]="basicTs">
                <nx-toggle [(pressed)]="bold">Bold</nx-toggle>
                <nx-toggle [(pressed)]="italic">Italic</nx-toggle>
            </app-demo-section>

            <app-demo-section
                header="Reactive Form"
                description="The {{ commonService.appName }} Toggle implements ControlValueAccessor, so it works with formControlName inside a reactive form."
                [code]="reactiveCode"
                [tsCode]="reactiveTs">
                <div [formGroup]="boldForm">
                    <nx-toggle formControlName="bold">Bold</nx-toggle>
                </div>
            </app-demo-section>

            <app-demo-section
                header="Template-Driven Form"
                description="It also works with [(ngModel)] for template-driven forms."
                [code]="templateCode"
                [tsCode]="templateTs">
                <nx-toggle [(ngModel)]="bold">Bold</nx-toggle>
            </app-demo-section>

            <app-demo-section
                header="Required Field"
                description="Set isRequired to true to mark the toggle mandatory - it must be pressed, and a validation message shows once the toggle is blurred while still unpressed. Note there is no built-in asterisk marker here, since the toggle has no separate label element like the checkbox or switch - the required state is only surfaced through the error message."
                [code]="requiredCode"
                [tsCode]="requiredTs">
                <nx-toggle [isRequired]="true" [(ngModel)]="accepted">Accept</nx-toggle>
            </app-demo-section>

        </div>
    </div>
</div>
