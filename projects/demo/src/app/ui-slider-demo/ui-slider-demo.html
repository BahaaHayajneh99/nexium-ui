<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Reactive Form"
                description="The {{ commonService.appName }} Slider works with Angular reactive forms via formControlName."
                [code]="reactiveCode"
                [tsCode]="reactiveTs"
                [hasSampleClass]="false">
                <div [formGroup]="volumeForm">
                    <nx-slider label="Volume" formControlName="volume"></nx-slider>
                </div>
            </app-demo-section>

            <app-demo-section
                header="Template-Driven Form"
                description="The {{ commonService.appName }} Slider also works with template-driven forms via [(ngModel)]."
                [code]="templateCode"
                [tsCode]="templateTs"
                [hasSampleClass]="false">
                <nx-slider label="Volume" [(ngModel)]="volume"></nx-slider>
            </app-demo-section>

            <app-demo-section
                header="Custom Range"
                description="Control the min, max, and step values."
                [code]="rangeCode"
                [tsCode]="rangeTs"
                [hasSampleClass]="false">
                <nx-slider label="Custom Range" [min]="0" [max]="10" [step]="1" [(ngModel)]="rangeVolume"></nx-slider>
            </app-demo-section>

        </div>
    </div>
</div>
