<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Basic Table"
                description="The basic {{ commonService.appName }} Table renders tabular data from a columns and data input."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">

                <nx-table [columns]="columns" [data]="data"></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Striped Table"
                description="Striped tables alternate row background colors for easier scanning."
                [code]="stripedCode"
                [tsCode]="stripedTs"
                [hasSampleClass]="false">
                <nx-table [columns]="columns" [data]="data" striped></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Bordered Table"
                description="Bordered tables add visible borders around cells."
                [code]="borderedCode"
                [tsCode]="borderedTs"
                [hasSampleClass]="false">
                <nx-table [columns]="columns" [data]="data" bordered></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Hoverable Table"
                description="Hoverable tables highlight the row under the cursor."
                [code]="hoverableCode"
                [tsCode]="hoverableTs"
                [hasSampleClass]="false">
                <nx-table [columns]="columns" [data]="data" hoverable></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Size"
                description="Use the size input to render a compact, default or large table."
                [code]="sizeCode"
                [tsCode]="sizeTs"
                [hasSampleClass]="false">
                <div style="display:flex; flex-direction:column; gap:16px;">
                    <nx-table [columns]="columns" [data]="data" bordered size="sm"></nx-table>
                    <nx-table [columns]="columns" [data]="data" bordered size="md"></nx-table>
                    <nx-table [columns]="columns" [data]="data" bordered size="lg"></nx-table>
                </div>
            </app-demo-section>

            <app-demo-section
                header="Sortable Columns"
                description="Set col.sortable to enable click-to-sort on a column header."
                [code]="sortCode"
                [tsCode]="sortTs"
                [hasSampleClass]="false">
                <nx-table [columns]="sortableColumns" [data]="employees" bordered paginator [rows]="5" (sort)="onSort($event)"></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Multi-Column Sort"
                description="Enable multiSortable and Ctrl/Shift + click column headers to sort by multiple columns."
                [code]="multiSortCode"
                [tsCode]="multiSortTs"
                [hasSampleClass]="false">
                <nx-table [columns]="sortableColumns" [data]="employees" bordered multiSortable paginator [rows]="5" (sort)="onMultiSort($event)"></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Custom Sort"
                description="Provide a col.sortFn to fully control how a column is compared."
                [code]="customSortCode"
                [tsCode]="customSortTs"
                [hasSampleClass]="false">
                <nx-table [columns]="customSortColumns" [data]="employees" bordered paginator [rows]="5"></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Scroll (Vertical & Horizontal)"
                description="Use scrollable with scrollHeight for a sticky header and vertical scroll; horizontal scroll is automatic when content overflows."
                [code]="scrollCode"
                [tsCode]="scrollTs"
                [hasSampleClass]="false">
                <nx-table [columns]="scrollColumns" [data]="employees" bordered scrollable scrollHeight="320px"></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Frozen Columns"
                description="Set col.frozen to 'left' or 'right' to pin columns while scrolling horizontally."
                [code]="frozenCode"
                [tsCode]="frozenTs"
                [hasSampleClass]="false">
                <nx-table [columns]="frozenColumns" [data]="employees" bordered scrollable scrollHeight="320px"></nx-table>
            </app-demo-section>

            <p class="nx-table-demo-note">
                Need filtering, row selection, inline editing, column groups, resizable columns, CSV export, or huge
                datasets? All of that now lives on the
                <a routerLink="/enterprise/advanced-data-grid">Advanced Data Grid</a> (a PRO component).
            </p>

            <app-demo-section
                header="Paginator"
                description="Enable paginator to page through data with configurable rowsPerPageOptions."
                [code]="paginatorCode"
                [tsCode]="paginatorTs"
                [hasSampleClass]="false">
                <nx-table [columns]="columns" [data]="employees" bordered paginator [rows]="10" [rowsPerPageOptions]="[10, 25, 50]"></nx-table>
            </app-demo-section>

        </div>
    </div>
</div>
