<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Basic Table"
                description="The basic {{ commonService.appName }} Table renders tabular data from a columns and data input."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">
                
                <nx-table [columns]="columns" [data]="data"></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Striped Table"
                description="Striped tables alternate row background colors for easier scanning."
                [code]="stripedCode"
                [tsCode]="stripedTs"
                [hasSampleClass]="false">
                <nx-table [columns]="columns" [data]="data" striped></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Bordered Table"
                description="Bordered tables add visible borders around cells."
                [code]="borderedCode"
                [tsCode]="borderedTs"
                [hasSampleClass]="false">
                <nx-table [columns]="columns" [data]="data" bordered></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Hoverable Table"
                description="Hoverable tables highlight the row under the cursor."
                [code]="hoverableCode"
                [tsCode]="hoverableTs"
                [hasSampleClass]="false">
                <nx-table [columns]="columns" [data]="data" hoverable></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Size"
                description="Use the size input to render a compact, default or large table."
                [code]="sizeCode"
                [tsCode]="sizeTs"
                [hasSampleClass]="false">
                <div style="display:flex; flex-direction:column; gap:16px;">
                    <nx-table [columns]="columns" [data]="data" bordered size="sm"></nx-table>
                    <nx-table [columns]="columns" [data]="data" bordered size="md"></nx-table>
                    <nx-table [columns]="columns" [data]="data" bordered size="lg"></nx-table>
                </div>
            </app-demo-section>

            <app-demo-section
                header="Sortable Columns"
                description="Set col.sortable to enable click-to-sort on a column header."
                [code]="sortCode"
                [tsCode]="sortTs"
                [hasSampleClass]="false">
                <nx-table [columns]="sortableColumns" [data]="employees" bordered paginator [rows]="5" (sort)="onSort($event)"></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Multi-Column Sort"
                description="Enable multiSortable and Ctrl/Shift + click column headers to sort by multiple columns."
                [code]="multiSortCode"
                [tsCode]="multiSortTs"
                [hasSampleClass]="false">
                <nx-table [columns]="sortableColumns" [data]="employees" bordered multiSortable paginator [rows]="5" (sort)="onMultiSort($event)"></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Custom Sort"
                description="Provide a col.sortFn to fully control how a column is compared."
                [code]="customSortCode"
                [tsCode]="customSortTs"
                [hasSampleClass]="false">
                <nx-table [columns]="customSortColumns" [data]="employees" bordered paginator [rows]="5"></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Filter"
                description="Set col.filterable for per-column filters, and showGlobalFilter for a search box."
                [code]="filterCode"
                [tsCode]="filterTs"
                [hasSampleClass]="false">
                <nx-table [columns]="filterColumns" [data]="employees" bordered showGlobalFilter paginator [rows]="5" (filter)="onFilter($event)"></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Row Selection - Single (Radio)"
                description="Use selectionMode=&quot;single&quot; to select one row at a time via radio button."
                [code]="selectionSingleCode"
                [tsCode]="selectionSingleTs"
                [hasSampleClass]="false">
                <nx-table [columns]="columns" [data]="employees" bordered selectionMode="single" [(selection)]="selectedEmployee" paginator [rows]="5"></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Row Selection - Multiple (Checkbox)"
                description="Use selectionMode=&quot;multiple&quot; to select many rows via checkbox, including a select-all header checkbox."
                [code]="selectionMultipleCode"
                [tsCode]="selectionMultipleTs"
                [hasSampleClass]="false">
                <nx-table [columns]="columns" [data]="employees" bordered selectionMode="multiple" [(selection)]="selectedEmployees" paginator [rows]="5"></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Edit Cell"
                description="Set col.editable and double-click a cell to edit its value inline."
                [code]="editCode"
                [tsCode]="editTs"
                [hasSampleClass]="false">
                <nx-table [columns]="editableColumns" [data]="employees" bordered paginator [rows]="5" (cellEditComplete)="onCellEditComplete($event)"></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Scroll (Vertical & Horizontal)"
                description="Use scrollable with scrollHeight for a sticky header and vertical scroll; horizontal scroll is automatic when content overflows."
                [code]="scrollCode"
                [tsCode]="scrollTs"
                [hasSampleClass]="false">
                <nx-table [columns]="resizableColumns" [data]="employees" bordered scrollable scrollHeight="320px"></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Frozen Columns"
                description="Set col.frozen to 'left' or 'right' to pin columns while scrolling horizontally."
                [code]="frozenCode"
                [tsCode]="frozenTs"
                [hasSampleClass]="false">
                <nx-table [columns]="frozenColumns" [data]="employees" bordered scrollable scrollHeight="320px"></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Virtual Scroll - Preload"
                description="virtualScroll with mode 'preload' virtualizes an already in-memory dataset for smooth scrolling of large lists."
                [code]="virtualPreloadCode"
                [tsCode]="virtualPreloadTs"
                [hasSampleClass]="false">
                <nx-table [columns]="columns" [data]="employees" bordered virtualScroll virtualScrollMode="preload" scrollHeight="320px"></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Virtual Scroll - Lazy"
                description="virtualScroll with mode 'lazy' emits (lazyLoad) with the visible window so data can be fetched on demand."
                [code]="virtualLazyCode"
                [tsCode]="virtualLazyTs"
                [hasSampleClass]="false">
                <nx-table [columns]="columns" [data]="lazyData" bordered virtualScroll virtualScrollMode="lazy" [totalRecords]="employees.length" scrollHeight="320px" (lazyLoad)="onLazyLoad($event)"></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Column Group"
                description="Provide columnGroups to render a grouped header row spanning multiple columns."
                [code]="groupCode"
                [tsCode]="groupTs"
                [hasSampleClass]="false">
                <nx-table [columns]="groupColumns" [columnGroups]="columnGroups" [data]="employees" bordered paginator [rows]="5"></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Column Resize"
                description="Set col.resizable to allow dragging the column edge to resize it."
                [code]="resizeCode"
                [tsCode]="resizeTs"
                [hasSampleClass]="false">
                <nx-table [columns]="resizableColumns" [data]="employees" bordered paginator [rows]="5"></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Paginator"
                description="Enable paginator to page through data with configurable rowsPerPageOptions."
                [code]="paginatorCode"
                [tsCode]="paginatorTs"
                [hasSampleClass]="false">
                <nx-table [columns]="columns" [data]="employees" bordered paginator [rows]="10" [rowsPerPageOptions]="[10, 25, 50]"></nx-table>
            </app-demo-section>

            <app-demo-section
                header="Export"
                description="Enable showExport to render a button that exports the currently displayed data to CSV."
                [code]="exportCode"
                [tsCode]="exportTs"
                [hasSampleClass]="false">
                <nx-table [columns]="columns" [data]="employees" bordered showExport></nx-table>
            </app-demo-section>

        </div>
    </div>
</div>
