<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Reactive Form"
                description="Bind the radio group to a FormGroup control using formControlName - the component fully implements ControlValueAccessor."
                [code]="reactiveCode"
                [tsCode]="reactiveTs"
                [hasSampleClass]="false">
                <div [formGroup]="planForm">
                    <nx-radio-group name="plan" [options]="options" formControlName="plan"></nx-radio-group>
                </div>
            </app-demo-section>

            <app-demo-section
                header="Template-Driven Form"
                description="Bind the radio group with plain [(ngModel)] for simple template-driven forms."
                [code]="templateCode"
                [tsCode]="templateTs"
                [hasSampleClass]="false">
                <nx-radio-group name="plan" [options]="options" [(ngModel)]="plan"></nx-radio-group>
            </app-demo-section>

            <app-demo-section
                header="Inline"
                description="Set inline to true to lay out the options in a row instead of stacked (block)."
                [code]="inlineCode"
                [hasSampleClass]="false">
                <nx-radio-group name="inline-plan" [options]="options" [inline]="true" [(ngModel)]="inlinePlan"></nx-radio-group>
            </app-demo-section>

        </div>
    </div>
</div>
