<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Video Upload"
                description="Restrict the accepted files to video formats."
                [code]="basicCode"
                [tsCode]="basicTs">
                <nx-file-upload accept="video/*" label="Drop a video here or click to browse"></nx-file-upload>
            </app-demo-section>

        </div>
    </div>
</div>
