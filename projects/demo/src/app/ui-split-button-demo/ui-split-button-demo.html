<div class="main-content">

    <div class="main-container">

        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Basic Split Button"
                description="{{ commonService.appName }}'s Split Button pairs a primary action with a caret that opens a menu of secondary actions. Click the caret to open the menu, click an item to select it, click outside or press Escape to close it."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">
                <nx-split-button
                    label="Save"
                    [actions]="actions"
                    (primaryClick)="onPrimaryClick()"
                    (actionSelected)="onActionSelected($event)">
                </nx-split-button>
                @if (status) {
                    <p style="margin-top:12px; color:var(--shell-text-secondary); font-size:0.85rem;">
                        Last action: {{ status }}
                    </p>
                }
            </app-demo-section>

        </div>

    </div>

</div>
