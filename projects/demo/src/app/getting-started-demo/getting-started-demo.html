<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <section class="main-section">
                <h4 class="main-section-header">Getting Started</h4>
                <p class="main-section-description">
                    {{ commonService.appName }} is a library of standalone Angular UI components,
                    published to npm as <code>nexium-ui</code>. This page walks through installing
                    it and using it in your own application.
                </p>
            </section>

            <app-demo-section
                header="Installation"
                description="Install the package from npm."
                [code]="installCode"
                [codeLang]="'ts'"
                [hasSampleClass]="false">
            </app-demo-section>

            <app-demo-section
                header="Styles &amp; Theming"
                description="{{ commonService.appName }} ships a pre-compiled stylesheet with every component's styles and design tokens. Add it to your app's global styles through angular.json&hellip;"
                [code]="angularJsonStylesCode"
                [codeLang]="'ts'"
                [hasSampleClass]="false">
            </app-demo-section>

            <app-demo-section
                header="&hellip;or Import It Directly"
                description="Alternatively, import the stylesheet directly into your own global stylesheet."
                [code]="globalImportStylesCode"
                [codeLang]="'ts'"
                [hasSampleClass]="false">
            </app-demo-section>

            <app-demo-section
                header="Usage"
                description="Every component is standalone, so no NgModule or app-wide provider setup is required &mdash; import the components you need directly into your own component's imports array."
                [code]="standaloneUsageCode"
                [codeLang]="'ts'"
                [hasSampleClass]="false">
            </app-demo-section>

            <app-demo-section
                header="NexiumUiModule"
                description="If your app still assembles feature modules the @NgModule way, import NexiumUiModule once instead to get every {{ commonService.appName }} component and directive available in that module's templates."
                [code]="moduleUsageCode"
                [codeLang]="'ts'"
                [hasSampleClass]="false">
            </app-demo-section>

            <app-demo-section
                header="Design Tokens"
                description="Component colors are driven by CSS custom properties, exposed once you've included the stylesheet above &mdash; reuse them in your own styles to stay consistent with the library's theme, including dark mode."
                [code]="designTokensCode"
                [codeLang]="'ts'"
                [hasSampleClass]="false">
            </app-demo-section>

        </div>
    </div>
</div>
