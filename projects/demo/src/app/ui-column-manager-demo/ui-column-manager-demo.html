<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Column Manager"
                description="{{ commonService.appName }} Column Manager is a standalone column-configuration panel - it isn't wired to any specific grid, it just manages a column list and emits the updated config via columnsChange. Click 'Columns' to open the panel: toggle visibility with the checkbox, drag a row by its handle to reorder, and use the pin-left/unpin/pin-right buttons. The plain table below is driven entirely by the emitted config, proving the panel works standalone. This is a PRO component."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">
                <nx-column-manager [columns]="columns" (columnsChange)="onColumnsChange($event)"></nx-column-manager>

                <table class="demo-plain-table">
                    <thead>
                        <tr>
                            @for (column of visibleColumns; track column.field) {
                                <th>{{ column.header }} @if (column.pinned) {<span class="demo-pin-tag">{{ column.pinned }}</span>}</th>
                            }
                        </tr>
                    </thead>
                    <tbody>
                        @for (row of rows; track row['id']) {
                            <tr>
                                @for (column of visibleColumns; track column.field) {
                                    <td>{{ row[column.field] }}</td>
                                }
                            </tr>
                        }
                    </tbody>
                </table>
            </app-demo-section>

        </div>
    </div>
</div>
