<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Data Grid"
                description="{{ commonService.appName }} Data Grid is the zero-config, 80%-case table: click a sortable header to cycle asc/desc/none, type in the search box to filter across every column, and page through results. Much less surface area than the PRO nx-advanced-data-grid - intentionally."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">
                <nx-data-grid [columns]="columns" [rows]="rows"></nx-data-grid>
            </app-demo-section>

            <app-demo-section
                header="Custom Page Size"
                description="Set pageSize to control how many rows render per page."
                [code]="pageSizeCode"
                [tsCode]="pageSizeTs"
                [hasSampleClass]="false">
                <nx-data-grid [columns]="columns" [rows]="rows" [pageSize]="5"></nx-data-grid>
            </app-demo-section>

        </div>
    </div>
</div>
