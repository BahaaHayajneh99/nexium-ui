<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Horizontal"
                description="Drag the gutter to resize the two panes - built with pointer events, no external drag library."
                [code]="horizontalCode"
                [hasSampleClass]="false">

                <nx-splitter>
                    <div nx-splitter-start class="layout-demo-box">Left pane</div>
                    <div nx-splitter-end class="layout-demo-box layout-demo-box-alt">Right pane</div>
                </nx-splitter>

            </app-demo-section>

            <app-demo-section
                header="Vertical"
                description="Set orientation to vertical to stack the panes top-to-bottom instead."
                [code]="verticalCode"
                [hasSampleClass]="false">

                <nx-splitter orientation="vertical">
                    <div nx-splitter-start class="layout-demo-box">Top pane</div>
                    <div nx-splitter-end class="layout-demo-box layout-demo-box-alt">Bottom pane</div>
                </nx-splitter>

            </app-demo-section>

        </div>
    </div>
</div>
