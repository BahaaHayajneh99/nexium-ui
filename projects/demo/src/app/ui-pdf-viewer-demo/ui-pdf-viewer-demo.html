<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Zoom, Download &amp; Open in New Tab"
                description="{{ commonService.appName }} PDF Viewer - a toolbar (zoom in/out/reset, download, open in a new tab) wrapped around the browser's own built-in PDF renderer. This demo's PDF is generated entirely client-side, so there's no external file to fetch. This is a PRO component."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">
                <nx-pdf-viewer [src]="pdfUrl" title="sample.pdf"></nx-pdf-viewer>
            </app-demo-section>

        </div>
    </div>
</div>
