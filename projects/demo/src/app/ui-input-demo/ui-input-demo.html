<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Reactive Form"
                description="The {{ commonService.appName }} Input implements ControlValueAccessor, so it plugs straight into a FormGroup with formControlName."
                [code]="reactiveCode"
                [tsCode]="reactiveTs"
                [hasSampleClass]="false">
                <div [formGroup]="nameForm">
                    <nx-input label="Full Name" placeholder="Enter your name" formControlName="name"></nx-input>
                </div>
            </app-demo-section>

            <app-demo-section
                header="Template-Driven Form"
                description="For simple cases, bind the {{ commonService.appName }} Input directly with [(ngModel)]."
                [code]="templateCode"
                [tsCode]="templateTs"
                [hasSampleClass]="false">
                <nx-input label="Full Name" placeholder="Enter your name" [(ngModel)]="name"></nx-input>
            </app-demo-section>

            <app-demo-section
                header="Input with Error"
                description="Pass an error message to display validation feedback."
                [code]="errorCode"
                [tsCode]="errorTs"
                [hasSampleClass]="false">
                <nx-input label="Email" [(ngModel)]="email" error="Please enter a valid email address"></nx-input>
            </app-demo-section>

            <app-demo-section
                header="Disabled Input"
                description="Disabled inputs cannot be edited."
                [code]="disabledCode"
                [hasSampleClass]="false">
                <nx-input label="Disabled" value="Can't edit this" [disabled]="true"></nx-input>
            </app-demo-section>

        </div>
    </div>
</div>
