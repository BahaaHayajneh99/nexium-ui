<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <section class="main-section">
                <h4 class="main-section-header">Register</h4>
                <p class="main-section-description">
                    A standalone sign-up card block.
                </p>
            </section>

            <app-demo-section
                header="Sign up card"
                description="A standalone sign-up card block."
                [code]="code"
                [tsCode]="tsCode"
                [hasSampleClass]="false">

                <div class="template-preview demo-preview">
                    <nx-card class="template-card" variant="elevated">
                        <nx-card-header>
                            <nx-card-title>Create an account</nx-card-title>
                            <nx-card-subtitle>Start building with {{ commonService.appName }}</nx-card-subtitle>
                        </nx-card-header>
                        <nx-card-content>
                            <form class="template-form">
                                <nx-input label="Full Name" [(value)]="name"></nx-input>
                                <nx-input label="Email" type="email" [(value)]="email"></nx-input>
                                <nx-input label="Password" type="password" [(value)]="password"></nx-input>
                                <nx-checkbox label="I agree to the Terms of Service" [(checked)]="agree"></nx-checkbox>
                                <nx-button variant="primary" [fullWidth]="true">Create Account</nx-button>
                            </form>
                        </nx-card-content>
                    </nx-card>
                </div>

            </app-demo-section>

        </div>
    </div>
</div>
