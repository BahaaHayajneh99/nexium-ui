<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Role x Permission Grid"
                description="{{ commonService.appName }} Permission Matrix - click a cell to toggle it, or click a row/column header to toggle the whole row/column at once. This is a PRO component."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">
                <nx-permission-matrix [roles]="roles" [permissions]="permissions" [(value)]="value"></nx-permission-matrix>
            </app-demo-section>

        </div>
    </div>
</div>
