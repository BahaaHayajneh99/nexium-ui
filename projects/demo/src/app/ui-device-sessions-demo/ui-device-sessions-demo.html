<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Device Sessions"
                description="{{ commonService.appName }} Device Sessions lists currently-active login sessions, one per device - the session matching this browser is badged 'This device'. Revoke any other session individually, or use 'Revoke all other sessions' to sign every other device out at once. This is a PRO component."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">
                <div style="max-width:640px;">
                    <nx-device-sessions
                        [sessions]="sessions()"
                        (revoke)="onRevoke($event)"
                        (revokeAll)="onRevokeAll()">
                    </nx-device-sessions>
                </div>
            </app-demo-section>

        </div>
    </div>
</div>
