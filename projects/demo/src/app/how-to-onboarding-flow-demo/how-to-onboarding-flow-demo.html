<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <section class="main-section">
                <h4 class="main-section-header">User Onboarding Flow</h4>
                <p class="main-section-description">
                    A step-by-step welcome flow built from <code>nx-progress-bar</code>,
                    <code>nx-card</code> and <code>nx-button</code>.
                </p>
            </section>

            <app-demo-section
                header="Onboarding steps"
                description="Progress and the active step are tracked in component state."
                [code]="code"
                [tsCode]="tsCode"
                [hasSampleClass]="false">

                <div class="template-form" style="max-width: 420px;">
                    <nx-progress-bar [value]="progress" [showLabel]="true"></nx-progress-bar>

                    <nx-card variant="outlined">
                        <nx-card-content style="text-align: center;">
                            <nx-icon [icon]="steps[currentStep].icon" variant="svg" [size]="40"></nx-icon>
                            <h3 class="mt-2">{{ steps[currentStep].title }}</h3>
                            <p>{{ steps[currentStep].description }}</p>
                        </nx-card-content>
                    </nx-card>

                    <div class="template-form-row">
                        <nx-button variant="secondary" [disabled]="currentStep === 0" (click)="back()">Back</nx-button>
                        <nx-button variant="primary" [disabled]="currentStep === steps.length - 1" (click)="next()">Next</nx-button>
                    </div>
                </div>

            </app-demo-section>

        </div>
    </div>
</div>
