<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Reactive Form"
                description="The {{ commonService.appName }} Select works with ReactiveFormsModule via formControlName."
                [code]="reactiveCode"
                [tsCode]="reactiveTs"
                [hasSampleClass]="false">
                <div [formGroup]="countryForm">
                    <nx-select
                        label="Country"
                        placeholder="Select a country"
                        [options]="options"
                        formControlName="country">
                    </nx-select>
                </div>
            </app-demo-section>

            <app-demo-section
                header="Template-Driven Form"
                description="The {{ commonService.appName }} Select also works with FormsModule via [(ngModel)]."
                [code]="templateCode"
                [tsCode]="templateTs"
                [hasSampleClass]="false">
                <nx-select
                    label="Country"
                    placeholder="Select a country"
                    [options]="options"
                    [(ngModel)]="country">
                </nx-select>
            </app-demo-section>

        </div>
    </div>
</div>
