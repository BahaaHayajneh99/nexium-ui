<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Reactive Form"
                description="The component fully implements ControlValueAccessor, so it drops straight into a FormGroup via formControlName."
                [code]="reactiveCode"
                [tsCode]="reactiveTs"
                [hasSampleClass]="false">
                <div [formGroup]="codeForm">
                    <nx-otp-input formControlName="code" [length]="6"></nx-otp-input>
                </div>
            </app-demo-section>

            <app-demo-section
                header="Template-Driven Form"
                description="Six auto-advancing digit boxes bound with plain [(ngModel)] - typing moves focus forward, backspace on an empty box moves back, and pasting a full code fills every box at once."
                [code]="templateCode"
                [tsCode]="templateTs"
                [hasSampleClass]="false">
                <nx-otp-input [(ngModel)]="code" [length]="6"></nx-otp-input>
            </app-demo-section>

            <app-demo-section
                header="Completed Event"
                description="completed fires once with the full code as soon as every box is filled."
                [code]="completedTemplate"
                [tsCode]="completedTs"
                [hasSampleClass]="false">
                <nx-otp-input [length]="4" (completed)="onCompleted($event)"></nx-otp-input>
                @if (completedCode) {
                    <p class="template-form-note mt-2">Completed: {{ completedCode }}</p>
                }
            </app-demo-section>

            <app-demo-section
                header="Invalid"
                description="Set invalid to true to highlight the boxes with an error state."
                [code]="invalidCode"
                [hasSampleClass]="false">
                <nx-otp-input [length]="6" [invalid]="true"></nx-otp-input>
            </app-demo-section>

            <app-demo-section
                header="Disabled"
                description="Disabled OTP inputs cannot be interacted with."
                [code]="disabledCode"
                [hasSampleClass]="false">
                <nx-otp-input [length]="6" [disabled]="true" value="123"></nx-otp-input>
            </app-demo-section>

        </div>
    </div>
</div>
