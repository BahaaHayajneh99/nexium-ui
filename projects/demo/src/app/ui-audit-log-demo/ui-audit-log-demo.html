<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Basic Audit Log"
                description="The {{ commonService.appName }} Audit Log renders a filterable, expandable table of activity - search by user, entity or action, filter by action, and click a row with changes to reveal its before/after field diff."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">
                <div style="max-width:760px;">
                    <nx-audit-log [entries]="entries"></nx-audit-log>
                </div>
            </app-demo-section>

            <app-demo-section
                header="In Context"
                description="A typical use case - an activity feed embedded in a settings or admin panel."
                [code]="contextCode"
                [tsCode]="contextTs"
                [hasSampleClass]="false">
                <div style="max-width:760px; padding:16px; border:1px solid var(--nx-border-color, #e2e8f0); border-radius:12px;">
                    <h4 style="margin:0 0 16px;">Activity</h4>
                    <nx-audit-log [entries]="entries"></nx-audit-log>
                </div>
            </app-demo-section>

        </div>
    </div>
</div>
