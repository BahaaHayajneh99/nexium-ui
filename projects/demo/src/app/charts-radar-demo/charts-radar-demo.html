<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <section class="main-section">
                <h4 class="main-section-header">Radar Chart</h4>
                <p class="main-section-description">
                    Multi-axis comparison for a handful of dimensions - each axis is its own scale from
                    zero to a shared "nice" maximum. Hover or focus a vertex for its exact value, or
                    switch to the accessible table view.
                </p>
            </section>

            <app-demo-section
                header="Single series"
                description="One series needs no legend - the chart's own title already says what's plotted."
                [code]="basicCode"
                [tsCode]="tsCode"
                [hasSampleClass]="false">

                <nx-radar-chart [categories]="skills" [series]="singlePlan"></nx-radar-chart>

            </app-demo-section>

            <app-demo-section
                header="Comparison"
                description="Two or more series always get a legend, so identity never rides on color alone."
                [code]="comparisonCode"
                [tsCode]="tsCode"
                [hasSampleClass]="false">

                <nx-radar-chart [categories]="skills" [series]="comparisonPlans"></nx-radar-chart>

            </app-demo-section>

        </div>
    </div>
</div>
