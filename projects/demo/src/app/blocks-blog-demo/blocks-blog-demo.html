<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <section class="main-section">
                <h4 class="main-section-header">Blog</h4>
                <p class="main-section-description">
                    A grid of article cards for a blog index page.
                </p>
            </section>

            <app-demo-section
                header="Article grid"
                description="A grid of article cards for a blog index page."
                [code]="code"
                [tsCode]="tsCode"
                [hasSampleClass]="false">

                <div class="block-grid-3">
                    @for (post of posts; track post.title) {
                        <nx-card variant="outlined">
                            <nx-card-content>
                                <div class="block-hero-media" style="height: 140px; margin-bottom: 1rem;">Image placeholder</div>
                                <nx-badge variant="secondary" size="small">{{ post.tag }}</nx-badge>
                                <h4 class="mt-2">{{ post.title }}</h4>
                                <p class="template-stat-label">{{ post.date }}</p>
                                <p>{{ post.excerpt }}</p>
                            </nx-card-content>
                        </nx-card>
                    }
                </div>

            </app-demo-section>

        </div>
    </div>
</div>
