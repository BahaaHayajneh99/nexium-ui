<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Reactive Form"
                description="The {{ commonService.appName }} AutoComplete implements ControlValueAccessor, so it works with formControlName inside a reactive form."
                [code]="reactiveCode"
                [tsCode]="reactiveTs"
                [hasSampleClass]="false">
                <div [formGroup]="cityForm">
                    <nx-autocomplete
                        label="City"
                        placeholder="Search cities..."
                        [options]="options"
                        formControlName="city">
                    </nx-autocomplete>
                </div>
            </app-demo-section>

            <app-demo-section
                header="Template-Driven Form"
                description="The {{ commonService.appName }} AutoComplete also works with [(ngModel)] in a template-driven form."
                [code]="templateCode"
                [tsCode]="templateTs"
                [hasSampleClass]="false">
                <nx-autocomplete
                    label="City"
                    placeholder="Search cities..."
                    [options]="options"
                    [(ngModel)]="city">
                </nx-autocomplete>
            </app-demo-section>

            <app-demo-section
                header="Group"
                description="Options sharing a group are rendered under a common group header."
                [code]="groupCode"
                [tsCode]="groupTs"
                [hasSampleClass]="false">
                <nx-autocomplete
                    label="City"
                    placeholder="Search cities..."
                    [options]="groupedOptions"
                    [(ngModel)]="groupCountry">
                </nx-autocomplete>
            </app-demo-section>

            <app-demo-section
                header="Virtual Scroll"
                description="Enable virtualScroll to render only the visible options for large datasets."
                [code]="virtualScrollCode"
                [tsCode]="virtualScrollTs"
                [hasSampleClass]="false">
                <nx-autocomplete
                    label="Item"
                    placeholder="Search items..."
                    [options]="virtualScrollOptions"
                    [virtualScroll]="true"
                    [(ngModel)]="virtualScrollCity">
                </nx-autocomplete>
            </app-demo-section>

            <app-demo-section
                header="Multiple"
                description="Set multiple to true to select more than one option as removable chips."
                [code]="multipleCode"
                [tsCode]="multipleTs"
                [hasSampleClass]="false">
                <nx-autocomplete
                    label="Cities"
                    placeholder="Search cities..."
                    [options]="options"
                    [multiple]="true"
                    [(ngModel)]="multipleCities">
                </nx-autocomplete>
            </app-demo-section>

            <app-demo-section
                header="Float Label"
                description="Set floatLabel to true to float the label over the input."
                [code]="floatLabelCode"
                [hasSampleClass]="false">
                <nx-autocomplete
                    label="City"
                    [options]="options"
                    [floatLabel]="true"
                    [(ngModel)]="floatLabelCity">
                </nx-autocomplete>
            </app-demo-section>

            <app-demo-section
                header="Filled"
                description="Specify the variant property as filled to display the component with a higher visual emphasis than the default outlined style."
                [code]="filledCode"
                [hasSampleClass]="false">
                <nx-autocomplete
                    label="City"
                    placeholder="Search cities..."
                    variant="filled"
                    [options]="options"
                    [(ngModel)]="filledCity">
                </nx-autocomplete>
            </app-demo-section>

            <app-demo-section
                header="Disabled"
                description="Set disabled to true to prevent user interaction with the component."
                [code]="disabledCode"
                [hasSampleClass]="false">
                <nx-autocomplete
                    label="City"
                    [options]="options"
                    [disabled]="true"
                    [(ngModel)]="disabledCity">
                </nx-autocomplete>
            </app-demo-section>

            <app-demo-section
                header="Show Clear"
                description="Set showClear to true to display a clear icon to reset the value."
                [code]="showClearCode"
                [hasSampleClass]="false">
                <nx-autocomplete
                    label="City"
                    placeholder="Search cities..."
                    [options]="options"
                    [showClear]="true"
                    [(ngModel)]="showClearCity">
                </nx-autocomplete>
            </app-demo-section>

            <app-demo-section
                header="Invalid"
                description="Set invalid to true to highlight the component with an error state."
                [code]="invalidCode"
                [hasSampleClass]="false">
                <nx-autocomplete
                    label="City"
                    placeholder="Search cities..."
                    [options]="options"
                    [invalid]="true"
                    [(ngModel)]="invalidCity">
                </nx-autocomplete>
            </app-demo-section>

        </div>
    </div>
</div>
