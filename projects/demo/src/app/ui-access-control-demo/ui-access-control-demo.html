<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="User-Centric Access Control"
                description="{{ commonService.appName }} Access Control - a user-centric admin table. Search by name or email, filter by role, reassign a user's role inline via the colored role dropdown, and flip a user's status between Active and Suspended with the switch. This is a PRO component."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">
                <nx-access-control
                    [users]="users()"
                    [roles]="roles"
                    (roleChanged)="onRoleChanged($event)"
                    (statusChanged)="onStatusChanged($event)">
                </nx-access-control>
                <p class="nx-access-control-demo-event">{{ lastEvent() }}</p>
            </app-demo-section>

        </div>
    </div>
</div>
