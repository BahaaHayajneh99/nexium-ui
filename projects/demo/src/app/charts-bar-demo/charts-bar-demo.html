<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <section class="main-section">
                <h4 class="main-section-header">Bar Chart</h4>
                <p class="main-section-description">
                    A grouped column chart for comparing magnitude across categories. Hover or focus a
                    bar for its exact value, or switch to the accessible table view.
                </p>
            </section>

            <app-demo-section
                header="Basic"
                description="A single series needs no legend - the chart's own title already says what's plotted."
                [code]="basicCode"
                [tsCode]="tsCode"
                [hasSampleClass]="false">

                <nx-bar-chart [categories]="months" [series]="revenue"></nx-bar-chart>

            </app-demo-section>

            <app-demo-section
                header="Grouped"
                description="Two or more series always get a legend, so identity never rides on color alone."
                [code]="groupedCode"
                [tsCode]="tsCode"
                [hasSampleClass]="false">

                <nx-bar-chart [categories]="months" [series]="revenueVsExpenses"></nx-bar-chart>

            </app-demo-section>

        </div>
    </div>
</div>
