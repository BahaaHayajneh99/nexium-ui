<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Reactive Form"
                description="Bound through a FormGroup via formControlName - type @ inside the textarea to open a filtered suggestion list - arrow keys to move, Enter or Tab to insert, Escape to dismiss."
                [code]="reactiveCode"
                [tsCode]="reactiveTs"
                [hasSampleClass]="false">
                <div [formGroup]="commentForm">
                    <nx-mention
                        formControlName="comment"
                        [suggestions]="teammates"
                        placeholder="Leave a comment - type @ to mention someone"
                        (mentioned)="onMentioned($event)">
                    </nx-mention>
                </div>
                @if (lastMentioned) {
                    <p class="template-form-note mt-2">Last mentioned: &#64;{{ lastMentioned }}</p>
                }
            </app-demo-section>

            <app-demo-section
                header="Template-Driven Form"
                description="Bound with plain [(ngModel)] - type @ inside the textarea to open a filtered suggestion list - arrow keys to move, Enter or Tab to insert, Escape to dismiss."
                [code]="templateCode"
                [tsCode]="templateTs"
                [hasSampleClass]="false">
                <nx-mention
                    [(ngModel)]="comment"
                    [suggestions]="teammates"
                    placeholder="Leave a comment - type @ to mention someone"
                    (mentioned)="onMentioned($event)">
                </nx-mention>
                @if (lastMentioned) {
                    <p class="template-form-note mt-2">Last mentioned: &#64;{{ lastMentioned }}</p>
                }
            </app-demo-section>

            <app-demo-section
                header="Required Field"
                description="Set isRequired to true to mark the field mandatory - since nx-mention has no built-in label, add a plain label in the demo markup - a validation message shows once the field is touched and left empty."
                [code]="requiredCode"
                [hasSampleClass]="false">
                <label class="template-form-note">Comment <span style="color: #e74c3c;">*</span></label>
                <nx-mention
                    [isRequired]="true"
                    [(ngModel)]="requiredComment"
                    [suggestions]="teammates"
                    placeholder="Leave a comment - type @ to mention someone">
                </nx-mention>
            </app-demo-section>

            <app-demo-section
                header="Pattern Validation"
                description="Use pattern with a named preset ('email', 'url', 'phone', 'numeric', 'alpha', 'alphanumeric'), a custom RegExp, or a regex string to validate the field's format once it's touched - here 'alphanumeric' restricts the comment to letters and digits."
                [code]="patternCode"
                [hasSampleClass]="false">
                <nx-mention
                    pattern="alphanumeric"
                    [(ngModel)]="patternComment"
                    [suggestions]="teammates"
                    placeholder="Letters and digits only">
                </nx-mention>
            </app-demo-section>

        </div>
    </div>
</div>
