<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <section class="main-section">
                <h4 class="main-section-header">Statistics</h4>
                <p class="main-section-description">
                    A metrics grid for landing pages or reports - a compact way to surface key numbers.
                </p>
            </section>

            <app-demo-section
                header="Metrics grid"
                description="A compact way to surface key numbers."
                [code]="code"
                [tsCode]="tsCode"
                [hasSampleClass]="false">

                <div  style="--nx-grid-min-width: 250px; --nx-grid-gap: 1.5rem;" class="nx-auto-fit-grid">
                    @for (stat of stats; track stat.label) {
                        <nx-card variant="outlined">
                            <nx-card-content>
                                <nx-statistic
                                    [label]="stat.label"
                                    [value]="stat.value"
                                    [delta]="stat.delta"
                                    [upIsGood]="stat.upIsGood ?? true"
                                ></nx-statistic>
                            </nx-card-content>
                        </nx-card>
                    }
                </div>

            </app-demo-section>

        </div>
    </div>
</div>
