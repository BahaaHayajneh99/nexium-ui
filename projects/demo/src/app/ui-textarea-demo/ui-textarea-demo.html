<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Reactive Form"
                description="The {{ commonService.appName }} Textarea implements ControlValueAccessor, so it binds to a FormGroup with formControlName."
                [code]="reactiveCode"
                [tsCode]="reactiveTs"
                [hasSampleClass]="false">
                <div [formGroup]="messageForm">
                    <nx-textarea label="Message" placeholder="Write your message" formControlName="message"></nx-textarea>
                </div>
            </app-demo-section>

            <app-demo-section
                header="Template-Driven Form"
                description="It also works with plain [(ngModel)] two-way binding for simple template-driven forms."
                [code]="templateCode"
                [tsCode]="templateTs"
                [hasSampleClass]="false">
                <nx-textarea label="Message" placeholder="Write your message" [(ngModel)]="message"></nx-textarea>
            </app-demo-section>

            <app-demo-section
                header="Custom Rows"
                description="Control the visible number of text rows."
                [code]="rowsCode"
                [tsCode]="rowsTs"
                [hasSampleClass]="false">
                <nx-textarea label="Description" [rows]="6" [(ngModel)]="message"></nx-textarea>
            </app-demo-section>

            <app-demo-section
                header="Required Field"
                description="Set isRequired to true to mark the field mandatory - a '*' appears next to the label and a validation message shows once the field is touched and left empty."
                [code]="requiredCode"
                [hasSampleClass]="false">
                <nx-textarea label="Feedback" placeholder="Tell us what you think" [isRequired]="true" [(ngModel)]="requiredMessage"></nx-textarea>
            </app-demo-section>

            <app-demo-section
                header="Pattern Validation"
                description="Use pattern with a named preset ('email', 'url', 'phone', 'numeric', 'alpha', 'alphanumeric'), a custom RegExp, or a regex string to validate the field's format once it's touched."
                [code]="patternCode"
                [hasSampleClass]="false">
                <nx-textarea label="Bio" placeholder="Letters only, please" pattern="alpha" [(ngModel)]="patternMessage"></nx-textarea>
            </app-demo-section>

        </div>
    </div>
</div>
