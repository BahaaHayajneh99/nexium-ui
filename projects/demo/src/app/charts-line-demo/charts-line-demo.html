<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <section class="main-section">
                <h4 class="main-section-header">Line Chart</h4>
                <p class="main-section-description">
                    A multi-series line chart with a crosshair that snaps to the nearest point and a
                    single tooltip listing every series at that position.
                </p>
            </section>

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Basic"
                description="One series, one line - no legend needed."
                [code]="basicCode"
                [tsCode]="tsCode"
                [hasSampleClass]="false">

                <nx-line-chart [categories]="months" [series]="activeUsers"></nx-line-chart>

            </app-demo-section>

            <app-demo-section
                header="Multi-Series"
                description="Move the pointer across the plot - the crosshair and tooltip track every series at once."
                [code]="multiCode"
                [tsCode]="tsCode"
                [hasSampleClass]="false">

                <nx-line-chart [categories]="months" [series]="usersByDevice"></nx-line-chart>

            </app-demo-section>

        </div>
    </div>
</div>
