<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Confirm Dialog"
                description="The {{ commonService.appName }} Dialog is a focused confirm/cancel prompt for critical actions."
                [code]="basicCode"
                [tsCode]="basicTs">
                <button class="demo-btn" (click)="open = true">Delete item</button>

                <nx-dialog
                    [open]="open"
                    title="Delete item"
                    message="Are you sure you want to delete this item? This action cannot be undone."
                    confirmText="Delete"
                    (confirm)="onConfirm()"
                    (cancel)="open = false">
                </nx-dialog>
            </app-demo-section>

        </div>
    </div>
</div>
