<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Basic App Shell"
                description="The {{ commonService.appName }} App Shell is a standard app layout scaffold - header, collapsible sidebar, content and footer regions, composed via named content-projection slots."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">
                <div style="height:340px; border:1px solid var(--shell-border, #e5e7eb); border-radius:8px; overflow:hidden;">
                    <nx-app-shell>
                        <div nxAppShellHeader style="padding:12px 16px; font-weight:600;">Header</div>
                        <div nxAppShellSidebar style="padding:12px 16px;">Sidebar</div>
                        <div nxAppShellFooter style="padding:12px 16px; font-size:13px;">Footer &copy; 2026</div>

                        <h2 style="margin:0 0 8px;">Page content</h2>
                        <p style="margin:0;">Everything not assigned to a named slot lands in the default content area.</p>
                    </nx-app-shell>
                </div>
            </app-demo-section>

            <app-demo-section
                header="Toggling the Sidebar"
                description="sidebarCollapsed can be driven externally, or toggled from within projected content via a template reference variable calling toggleSidebar()."
                [code]="toggleCode"
                [tsCode]="toggleTs"
                [hasSampleClass]="false">
                <div style="height:280px; border:1px solid var(--shell-border, #e5e7eb); border-radius:8px; overflow:hidden;">
                    <nx-app-shell #shell [(sidebarCollapsed)]="collapsed">
                        <div nxAppShellHeader style="padding:12px 16px;">
                            <button class="demo-btn" type="button" (click)="shell.toggleSidebar()">Toggle sidebar</button>
                        </div>
                        <div nxAppShellSidebar style="padding:12px 16px;">Nav links...</div>
                        <p style="margin:0;">Sidebar collapsed: {{ collapsed }}</p>
                    </nx-app-shell>
                </div>
            </app-demo-section>

        </div>
    </div>
</div>
