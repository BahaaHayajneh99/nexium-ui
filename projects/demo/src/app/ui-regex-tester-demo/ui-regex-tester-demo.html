<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Regex Tester"
                description="The {{ commonService.appName }} Regex Tester is a self-contained playground - it owns its own pattern, flags, and test-string state internally, so there's nothing to bind. Type a pattern (e.g. \[a-z\]+@\[a-z\]+\.com), adjust the flags (defaults to g), then type or paste text into the test string box - matches highlight inline and capture groups list below."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">
                <div style="max-width:640px;">
                    <nx-regex-tester></nx-regex-tester>
                </div>
            </app-demo-section>

        </div>
    </div>
</div>
