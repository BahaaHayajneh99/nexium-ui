<div class="main-content">
    <div class="main-container">
        <div class="main-sections">

            <app-demo-section
                header="Import"
                description="Every component is standalone - import it directly from 'nexium-ui', no NgModule needed."
                [codeLang]="'ts'"
                [code]="importCode">
            </app-demo-section>

            <app-demo-section
                header="Basic Permission Denied"
                description="{{ commonService.appName }}'s Permission Denied is a preset of Result with sensible 403 defaults."
                [code]="basicCode"
                [tsCode]="basicTs"
                [hasSampleClass]="false">
                <nx-permission-denied (actionClick)="goBack()"></nx-permission-denied>
            </app-demo-section>

            <app-demo-section
                header="Custom Copy"
                description="Override any of the defaults to fit your own copy."
                [code]="customCode"
                [tsCode]="customTs"
                [hasSampleClass]="false">
                <nx-permission-denied
                    title="Admins only"
                    description="Ask a workspace admin to grant you access to this section.">
                </nx-permission-denied>
            </app-demo-section>

        </div>
    </div>
</div>
